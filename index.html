<style>
:root{
  --bg:#dcefee; --fg:#05303d; --muted:#45707a; --chip:#c5e2e0; --line:#a9d0cd;
  --accent:#0d7a8a; --gold:#f6c445; --milli:#7cc4f0; --coral:#ff6f73;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#03141c;--fg:#d5eef0;--muted:#82a7b0;--chip:#0c2a35;--line:#163c49;--accent:#3bc2cf;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#03141c;--fg:#d5eef0;--muted:#82a7b0;--chip:#0c2a35;--line:#163c49;--accent:#3bc2cf;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
/* nothing on the page is selectable: a thumb sliding off the pad or resting on a button must never start a text selection or a long-press menu, which froze the touch controls on iOS. Buttons also skip the double-tap zoom delay. */
body,button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
.wrap{max-width:1000px;margin:0 auto;padding:12px 12px 14px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 auto 8px;font-size:clamp(.88rem,calc(var(--boardW,600px)/62),1.08rem);font-variant-numeric:tabular-nums}
.hud .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.lvl{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:clamp(1.05rem,calc(var(--boardW,600px)/52),1.3rem);margin-right:4px}
.pips{display:inline-flex;gap:4px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.pips i.done{background:var(--muted)}
.pips i.boss{background:#e8463a}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.k{background:var(--gold)}.dot.m{background:var(--milli)}
.meter{display:inline-block;width:40px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--gold)}
.pchip.m .meter i{background:var(--milli)}
.pchip.out{opacity:.45}
.chip[hidden]{display:none}
.chip.sb{gap:6px;background:var(--fg);color:var(--bg)}
.chip.sb small{font-size:.72rem;opacity:.75;text-transform:none}
.chip.sb b{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:1rem;min-width:3.2ch;text-align:right}
.chip.sb.flash b{color:var(--gold)}
.pchip .pts{font-weight:700;min-width:2.5ch;text-align:right}
.pchip.hid{opacity:.7}.pchip.hid .dot{box-shadow:0 0 0 2px #4fb37a}
.stage{position:relative;margin:0 auto;border-radius:18px;overflow:hidden;background:#0b4a5c;box-shadow:0 18px 40px rgba(2,40,52,.3),inset 0 0 0 1px rgba(255,255,255,.05)}
canvas{display:block;touch-action:none}
canvas:focus{outline:none}
.rotate{display:none;margin:0 0 8px;font-size:.82rem;color:var(--muted);text-align:center}
@media (pointer:coarse) and (orientation:portrait) and (max-height:640px){.rotate{display:block}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse at center,rgba(2,30,42,.55),rgba(2,20,30,.82));color:#e6f6f5;text-align:center}
.overlay[hidden],.banner[hidden]{display:none}
/* panels ease in rather than popping; display:none to shown restarts the animation each time */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.overlay:not([hidden]){animation:fadeIn .25s ease-out}
.overlay:not([hidden]) .card{animation:cardIn .3s ease-out}
.banner:not([hidden]){animation:cardIn .25s ease-out}
.story:not([hidden]){animation:slideUp .3s ease-out}
@keyframes fadeOut{to{opacity:0;transform:translateY(8px)}}
.story.out{animation:fadeOut .2s ease-in forwards}
.stage.fresh canvas{animation:fadeIn .35s ease-out}
@media (prefers-reduced-motion:reduce){.overlay,.card,.banner,.story,.stage.fresh canvas{animation:none !important}}
.card{width:100%;max-width:520px;max-height:100%;overflow:auto;padding:4px;scrollbar-width:thin}
.card h2{margin:0;font-family:"Grandstander",system-ui,sans-serif;font-weight:900;font-size:clamp(1.9rem,6vw,3rem);line-height:.95;color:var(--gold);letter-spacing:-.01em;text-shadow:0 3px 0 #a5640f,0 6px 18px rgba(0,0,0,.35)}
.card h3{margin:0 0 4px;font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);color:var(--gold)}
.card p{margin:8px auto;color:#bfe0e2;line-height:1.45;max-width:40ch;font-size:.95rem}
.tag{margin-top:4px;color:#9fd0d4;font-size:.95rem}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;margin:10px 0 2px}
.seg button{border:0;background:transparent;color:#cfe9ea;padding:8px 14px;border-radius:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:#e6f6f5;color:#05303d}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0 2px}
button{font:inherit;cursor:pointer}
.lv{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);color:#e6f6f5;border:0;border-radius:11px;padding:6px 9px;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.lv:hover:not(:disabled){background:rgba(255,255,255,.14)}
.lv b{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;color:var(--gold);min-width:1.4em;font-size:1.05rem}
.lv span{display:block;font-weight:600;font-size:.88rem;line-height:1.15}
.lv small{display:block;color:#93c0c4;font-size:.74rem}
.lv:disabled{opacity:.38;cursor:not-allowed}
.st{font-style:normal;color:var(--gold);letter-spacing:1px}.st em{font-style:normal;color:rgba(255,255,255,.25)}
.stars{font-size:1.9rem;color:var(--gold);letter-spacing:4px;margin:2px 0 4px;text-shadow:0 2px 0 #a5640f}.stars span{color:rgba(255,255,255,.2);text-shadow:none}
.btn{background:var(--gold);color:#3a2700;border:0;border-radius:12px;padding:10px 16px;font-weight:800}
.btn.ghost{background:transparent;color:#e6f6f5;box-shadow:inset 0 0 0 1.5px rgba(230,246,245,.45)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(2,26,36,.82);color:#e6f6f5;padding:8px 16px;border-radius:14px;text-align:center;pointer-events:none;font-size:.9rem;width:max-content;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.banner b{display:block;font-family:"Grandstander",system-ui,sans-serif;font-size:1.15rem;color:var(--gold)}
.board{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.board div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 16px;min-width:130px;display:flex;flex-direction:column;align-items:center}
.board small{color:#9fd0d4;font-size:.8rem}
.board b{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums}
.board em{font-style:normal;font-size:.8rem;color:var(--gold)}
.scores{display:flex;gap:10px;justify-content:center;margin-top:6px;font-weight:700}
.foot{display:flex;justify-content:center;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:10px auto 0;color:var(--muted);font-size:clamp(.86rem,calc(var(--boardW,600px)/64),1.02rem);line-height:1.7}
kbd{font-family:inherit;background:var(--chip);color:var(--fg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{background:var(--chip);color:var(--fg);border:0;border-radius:999px;padding:5px 10px;font-size:clamp(.85rem,calc(var(--boardW,600px)/64),1rem);white-space:nowrap}
.tools button[hidden],.mini button[hidden]{display:none}
.mini{display:inline-flex;gap:6px}
.mini button{width:34px;height:34px;padding:0;border-radius:11px;display:inline-flex;align-items:center;justify-content:center}
.mini svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini svg .s{fill:none}
.mini svg .x,.mini svg .alt{display:none}
.mini button.off{color:var(--muted)}.mini button.off svg .x{display:block}
.mini button.on svg .main{display:none}.mini button.on svg .alt{display:block}
.touch{display:none;justify-content:space-between;align-items:center;margin:12px auto 0;gap:12px;user-select:none;-webkit-user-select:none}
.keys{display:none} /* the controls text is shown in the pause and Controls cards instead of under the board */
.help{font-size:.92rem;line-height:1.9;color:#bfe0e2;max-width:48ch;margin:6px auto 2px}

@media (pointer:coarse){.touch{display:flex}}
@media (pointer:coarse) and (orientation:landscape){

  .touch{display:contents}
  .pad{grid-column:1;grid-row:1;align-self:start}

}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}

.pad button{border-radius:14px}

.pick small{color:#93c0c4;font-size:.75rem}

.flabel{font-size:.8rem;color:#9fd0d4;margin:4px 0 4px}
.fopts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.swatch{width:34px;height:34px;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold)}
.fopt{border:0;border-radius:999px;padding:6px 11px;min-height:34px;background:rgba(255,255,255,.08);color:#e6f6f5;font-size:.85rem}
.fopt[aria-pressed="true"]{background:#e6f6f5;color:#05303d;font-weight:700}
.fopt.locked{display:inline-flex;align-items:center;gap:5px;opacity:.6;cursor:not-allowed;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.fopt.locked small{color:#93c0c4;font-size:.72rem}

@media (max-width:520px){.fishedit{flex-direction:column;align-items:center}.bigprev{width:110px;height:110px}.fcontrols{width:100%}}
.style{margin:14px auto 0;background:var(--chip);border-radius:16px;padding:14px 14px 4px;scrollbar-width:thin}
.style .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

.style details[open] summary::before{transform:rotate(90deg)}
.style[hidden]{display:none}
/* in the stacked layout the lab covers the whole frame and scrolls inside itself, so an itch.io embed or a phone never has to scroll the page to reach it */
.wrap:not(.side) .style:not([hidden]){position:fixed;inset:0;z-index:30;margin:0;max-width:none !important;border-radius:0;overflow:auto;padding:14px 16px 10px;box-sizing:border-box}
.story{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(to top,rgba(2,18,28,.97),rgba(2,18,28,.97) 30%,rgba(2,18,28,.8) 65%,rgba(2,18,28,0));color:#eaf7f6}
.story[hidden]{display:none}
.story p{margin:0 0 10px;font-size:clamp(.9rem,2.3vw,1.08rem);line-height:1.5;min-height:4.5em;max-width:62ch}
.storybar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sdots{display:flex;gap:5px}.sdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.sdots i.on{background:var(--gold)}

.srow{margin-bottom:18px}
.srow h4 span{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:6px}

#optTrack{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){#optTrack{grid-template-columns:repeat(2,minmax(0,1fr))}}

.opt small{color:var(--muted);font-size:.8rem;line-height:1.3}
.sw{display:flex;gap:3px}.sw i{width:20px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.previews button{border:0;border-radius:999px;padding:6px 11px;background:var(--bg);color:var(--fg);font-size:.85rem;box-shadow:inset 0 0 0 1px var(--line)}
.previews button.all{background:var(--accent);color:var(--bg);font-weight:700}
/* the overlay is a container: on a wide board the menu widens and lists the reefs in three columns, so 18 fit without a scrollbar */
.overlay{container-type:size}
@container (min-width:540px){.card{max-width:720px}.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (max-height:520px){.card h2{font-size:1.7rem}.tag{display:none}.seg{margin:6px 0 0}.seg button{padding:5px 12px}.fishrow{margin:4px 0 0}.fishmini canvas{width:40px;height:40px}.levels{gap:4px;margin:6px 0 0}.lv{padding:4px 8px}.lv span{font-size:.82rem}.lv small{font-size:.7rem}.row{margin-top:6px}}
/* One layout, scaled as a whole: the strip, the board and (on wide windows) the icon buttons are laid out once at the
   reference size (840 x 728 board under a 46 px strip) inside .scaled, which resize() scales to fit the window. The
   cards, the banner and the lab stay unscaled over it. */
.scaled{position:relative;width:840px;height:774px;transform-origin:0 0;overflow:hidden}
.scaled>canvas{display:block}
.scaled>.hud{position:relative;z-index:5;margin:0;height:46px;box-sizing:border-box;flex-wrap:nowrap;overflow:hidden;gap:6px;padding:0 10px;color:#e6f6f5;background:rgba(2,26,36,.85);font-size:.88rem}
.scaled>.hud #hWave{display:none} /* the pips say it */

.scaled>.hud .grp{flex-wrap:nowrap;min-width:0}.scaled>.hud .lvl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:1.05rem;color:var(--gold)}
.scaled>.hud .chip{background:rgba(255,255,255,.14);padding:2px 8px}
.scaled>.hud .chip.sb{background:rgba(2,26,36,.75);color:#e6f6f5}
.scaled>.hud .chip.sb small{opacity:.7}
.scaled>.hud .pips i{background:rgba(255,255,255,.3)}.scaled>.hud .pips i.on{background:var(--accent)}.scaled>.hud .pips i.done{background:rgba(255,255,255,.6)}.scaled>.hud .pips i.boss{background:#e8463a}
.scaled>.mini{position:absolute;right:10px;bottom:10px;z-index:5}
.scaled>.mini button{background:rgba(2,26,36,.7);color:#e6f6f5}
.scaled>.mini button.off{color:rgba(230,246,245,.5)}
.stage{display:block}
.stage .banner{top:calc(var(--hudTop,46px) + 10px)}
.stage.miniin .overlay{padding-bottom:62px}
.stage.miniin .storybar{margin-right:180px}
/* phones: the block is under 60% of reference size, so the strip's type grows back and the time and score chips step aside */
.stage.small .scaled>.hud{font-size:1.5rem;gap:10px;padding:0 14px}.stage.small .scaled>.hud .lvl{font-size:1.7rem}.stage.small .scaled>.hud .chip{padding:3px 12px}
.stage.small .scaled>.hud .chip.sb{display:none}.stage.small .scaled>.hud .pips{gap:7px}.stage.small .scaled>.hud .pips i{width:13px;height:13px}
.stage.small .scaled>.hud .dot{width:16px;height:16px}.stage.small .scaled>.hud .meter{width:64px;height:11px}
.stage.small .story p{font-size:.78rem;line-height:1.35;min-height:0}.stage.small .story{padding:20px 12px 10px}
.wrap.inmenu .touch{display:none} /* the pad has nothing to do on the title screen */
/* wide desktop windows: the board alone, as tall as the window; the reef info sits in a strip over the top row of rocks
   and the sound, music, pause and fullscreen buttons in the bottom right corner (see resize, which moves them in) */
@media (pointer:fine) and (min-width:900px){
  .wrap.side{display:grid;grid-template-columns:auto;justify-content:center;column-gap:16px;align-items:center;max-width:none;min-height:100vh;box-sizing:border-box;padding:12px 16px}
  .wrap.side .rotate,.wrap.side .touch,.wrap.side .foot{display:none}
  .wrap.side .stage{grid-column:1;grid-row:1;margin:0}
  .wrap.side .stage>.style:not([hidden]){position:absolute;grid-area:auto;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;margin:0;width:min(760px,94%);max-width:none !important;max-height:calc(100% - 24px);border-radius:16px;background:rgba(7,34,43,.96);color:#e6f6f5;overflow:auto;padding:16px 18px 8px;box-shadow:0 0 0 3000px rgba(2,20,30,.6),0 24px 60px rgba(0,0,0,.45)}
  .wrap.side .stage>.style .opts{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
  .wrap.side .stage>.style .opt{padding:10px 11px}.wrap.side .stage>.style .opt b{font-size:.98rem}.wrap.side .stage>.style .opt small{font-size:.82rem}
  .stage>.style .opt{background:rgba(255,255,255,.08)}.stage>.style .opt[aria-pressed="true"]{background:rgba(255,255,255,.16)}
  .stage>.style .lead,.stage>.style summary{color:#9fc3c9}.stage>.style .previews button{background:rgba(255,255,255,.1);color:#e6f6f5;box-shadow:none}
  .mini #bStyle.on{background:var(--accent);color:var(--bg)}
  .wrap.side:has(.style:not([hidden])){grid-template-columns:auto;justify-content:center;max-width:none}
  .wrap.side .style{padding:18px 18px 8px}.wrap.side .style .opt{padding:12px 13px;gap:6px}.wrap.side .style .opt b{font-size:1.02rem}.wrap.side .style .opt small{font-size:.86rem}
  .wrap.side .style .head h3{font-size:1.45rem}.wrap.side .style .lead{font-size:.92rem}.wrap.side .srow{margin-bottom:20px}
}
</style>
</head>
<body>
<main class="wrap">

<script>
(() => {
'use strict';

// ================= config =================
const TITLE = 'Killi and Milli';
const COLS = 15, ROWS = 13;
const PIXEL_BUDGET = 2.2e6;
const PSPEED = 5.2, PUFF_T = 1.3, PUFF_CD = 4.5, STUN_T = 2.6, INV_T = 1.8;
const UP = {x:0,y:-1}, DOWN = {x:0,y:1}, LEFT = {x:-1,y:0}, RIGHT = {x:1,y:0};

const DLIST = [UP, RIGHT, DOWN, LEFT];
const CUR = {U:UP, D:DOWN, L:LEFT, R:RIGHT};
const ESPEED = {C:2.7, J:1.5, E:3.0, O:2.3, S:2.0, M:2.4, A:4.2, Y:2.6, F:1.2, K:2.4};
const FLY = {J:1, A:1};
const SNACK_PTS = {krill:10, grape:15, pearl:20, star:25, clam:30, shrimp:40, moon:50};
const STREAK_PTS = 5, STREAK_MAX = 10, STREAK_WINDOW = 1.2, BOSS_HIT_PTS = 200, BOSS_WIN_PTS = 1000;
const SNACK_NAMES = {krill:'krill', pearl:'pearls', grape:'sea grapes', star:'starfish', shrimp:'shrimp', moon:'moon pearls', clam:'clams'};
const PALETTES = {
  sunny:     {name:'Sunny',     c1:'#ffe58a', c2:'#f2b632', belly:'#fff4cc', spot:'#a8740f', fin:'#e9a92a', spike:'#c48f16', tag:'#f6c445'},
  sky:       {name:'Sky',       c1:'#f2fbff', c2:'#9fd3f2', belly:'#ffffff', spot:'#2f6fb4', fin:'#7cbbe6', spike:'#4c88bf', tag:'#7cc4f0'},
  coral:     {name:'Coral',     c1:'#ffe0e5', c2:'#ff8fa3', belly:'#fff4f6', spot:'#c2415f', fin:'#ff7a90', spike:'#d0566e', tag:'#ff9fb2'},
  mint:      {name:'Mint',      c1:'#e6fff3', c2:'#7fdcb0', belly:'#f6fffa', spot:'#2f8f63', fin:'#5cc796', spike:'#3f9f73', tag:'#8fe6bf'},
  lavender:  {name:'Lavender',  c1:'#f3ebff', c2:'#bba3f0', belly:'#fbf8ff', spot:'#6b4fb8', fin:'#a58be6', spike:'#7d62c8', tag:'#c7b4f5'},
  tangerine: {name:'Tangerine', c1:'#ffe3c7', c2:'#ff9f4a', belly:'#fff6ec', spot:'#b8561a', fin:'#f28a36', spike:'#c96a24', tag:'#ffb066'},
  midnight:  {name:'Midnight',  c1:'#a9b9e2', c2:'#3e4f86', belly:'#dfe5f7', spot:'#e8ecff', fin:'#33447a', spike:'#2a3866', tag:'#a9b8e8'},
  gold:      {name:'Gold',      c1:'#fff1a8', c2:'#a8650a', belly:'#ffe59a', spot:'#6a4000', fin:'#b9770e', spike:'#8a5a08', tag:'#f0b43c'},
};
const PATTERNS = {spots:'Spots', plain:'Plain', stripes:'Stripes', freckles:'Freckles', hearts:'Hearts'};
const ACCESSORIES = {none:'None', bow:'Bow', flower:'Flower', glasses:'Glasses', cap:'Sailor cap', star:'Starfish clip', fin:'Shark fin hat', crown:'Royal crown', pearls:'Pearl necklace'};
// How each locked piece is earned. lv is a level index (0-based); anything not listed is available from the start.
const UNLOCKS = {
  color:   {lavender:{lv:2}, tangerine:{lv:7}, midnight:{lv:16}, gold:{special:'allstars', text:'Earn 3 stars on every level'}},
  pattern: {stripes:{lv:4}, freckles:{lv:11}, hearts:{lv:17, text:'Beat the Kraken Queen'}},
  acc:     {glasses:{lv:5}, cap:{lv:9}, star:{lv:14}, fin:{lv:12, text:'Defeat Bruiser'}, crown:{lv:17, text:'Beat the Kraken Queen'}, pearls:{special:'snacks', n:500, text:'Eat 500 snacks in total'}},
};
const ITEM_NAMES = {color:PALETTES, pattern:PATTERNS, acc:ACCESSORIES};
function levelCleared(i) { return !!(save.best && (save.best['1-' + i] || save.best['2-' + i])); }

// Works with the Poki SDK or the CrazyGames SDK when one is loaded on the page, and does nothing otherwise.
let adMute = false;
const Ads = (() => {
  const poki = () => window.PokiSDK, cg = () => (window.CrazyGames && window.CrazyGames.SDK) || null;
  let ready = false, playing = false;
  const quiet = on => { adMute = on; if (typeof master !== 'undefined' && master && ac) master.gain.setTargetAtTime(on || muted ? 0 : .9, ac.currentTime, .05); };
  return {
    init() {
      try {
        if (poki()) poki().init().then(() => { ready = true; poki().gameLoadingFinished(); }).catch(() => {});
        else if (cg()) Promise.resolve(cg().init()).then(() => { ready = true; }).catch(() => {});
      } catch (e) {}
    },
    get ready() { return ready; },
    play() { if (playing) return; playing = true; try { if (poki()) poki().gameplayStart(); else if (cg()) cg().game.gameplayStart(); } catch (e) {} },
    stop() { if (!playing) return; playing = false; try { if (poki()) poki().gameplayStop(); else if (cg()) cg().game.gameplayStop(); } catch (e) {} },
    // an interstitial at a natural pause; the SDKs decide how often one actually shows
    break(done) {
      try {
        if (poki() && ready) { this.stop(); poki().commercialBreak(() => quiet(true)).then(() => { quiet(false); done(); }).catch(() => { quiet(false); done(); }); return; }
        if (cg() && ready) { this.stop(); cg().ad.requestAd('midgame', {adStarted: () => quiet(true), adFinished: () => { quiet(false); done(); }, adError: () => { quiet(false); done(); }}); return; }
      } catch (e) {}
      done();
    },
    canReward() { return ready && !!(poki() || cg()); },
    reward(done, fail) {
      try {
        if (poki() && ready) { this.stop(); poki().rewardedBreak(() => quiet(true)).then(ok => { quiet(false); ok ? done() : fail(); }).catch(() => { quiet(false); fail(); }); return; }
        if (cg() && ready) { this.stop(); cg().ad.requestAd('rewarded', {adStarted: () => quiet(true), adFinished: () => { quiet(false); done(); }, adError: () => { quiet(false); fail(); }}); return; }
      } catch (e) {}
      fail();
    },
  };
})();

function advance(a, speed, dt) {
  const dx = a.tx - a.fx, dy = a.ty - a.fy, d = Math.abs(dx) + Math.abs(dy), s = speed * dt;
  if (s >= d) { a.fx = a.tx; a.fy = a.ty; a.x = a.tx; a.y = a.ty; a.moving = false; return dt - d / speed; }
  a.fx += Math.sign(dx) * s; a.fy += Math.sign(dy) * s; return -1;
}

// ================= level flow =================
function loadLevel(i, retry) {
  persist();
  hideStyle();
  levelIdx = i;
  if (autoTrack) setTrack(trackForLevel(i));
  const L = LEVELS[i];
  const grid = [], floor = [], born = [], wavePos = [[], [], [], []], enemies = [], urchins = new Map(), friends = [], bossTiles = new Set();
  const starts = [null, null];
  for (let y = 0; y < ROWS; y++) {
    grid.push([]); floor.push([]); born.push([]);
    for (let x = 0; x < COLS; x++) {
      const ch = (L.map[y] || '')[x] || '#';
      let g = '.', f = '';
      if (ch === '#') g = '#';
      else if (ch === 'c') { g = 'c'; born[y][x] = -9; }
      else if (ch >= '1' && ch <= '4') wavePos[ch.charCodeAt(0) - 49].push({x, y});
      else if (ch === 'P') starts[0] = {x, y};
      else if (ch === 'Q') starts[1] = {x, y};
      else if (ch === 'h' || ch === 'k' || 'UDLR'.includes(ch)) f = ch;
      else if (ch === 'N') friends.push(makeFriend(x, y));
      else if (ch === 'B') { if (L.boss === 'queen') { g = '#'; bossTiles.add(y * COLS + x); } else enemies.push(makeEnemy('K', x, y)); }
      else if (ch === 'x') { f = 'x'; urchins.set(y * COLS + x, {x, y, armed:true, cov:false, rearm:0}); }
      else if (ESPEED[ch]) enemies.push(makeEnemy(ch, x, y));
      grid[y].push(g); floor[y].push(f);
    }
  }
  const players = [];
  const count = twoP ? 2 : 1;
  for (let k = 0; k < count; k++) {
    const st = starts[k] || starts[0];
    const p = makeActor(st.x, st.y);
    const who = twoP ? (k ? 'milli' : 'killi') : (save.pick === 'milli' ? 'milli' : 'killi');
    Object.assign(p, {id:who === 'milli' ? 1 : 0, fish:getFish(who), sx:st.x, sy:st.y, face:DOWN, puff:0, puffCd:0, dead:false, deathT:0, inv:0, score:0, points:0, streak:0, lastGet:-9, held:[], bufAct:false, bufPuff:false});
    players.push(p);
  }
  S = {grid, floor, born, urchins, enemies, friends, bossTiles, boss:null, catches:0, players, snacks:[], popups:[], wavePos, waves:L.waves.slice(0, wavePos.filter(w => w.length).length),
       wave:-1, readyT: retry ? 1.0 : 1.9, failT:0, elapsed:0, vents:[], ventT:0};
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (floor[y][x] === 'h') S.vents.push({x, y});
  S.unlocksAtStart = new Set(unlockedSet());
  if (L.boss) setupBoss(L); else nextWave(true);
  mode = 'play';
  overlay.hidden = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  buildHudPlayers();
  showBanner(retry ? 'Try again' : `${i + 1}. ${L.name}`, retry ? L.name : L.hint);
  stage.classList.remove('fresh'); void stage.offsetWidth; stage.classList.add('fresh'); // restart the fade-in
}

function makeFriend(x, y) {
  const n = makeActor(x, y);
  Object.assign(n, {kind:'N', name:'Niko', speed:3.4, shieldCd:0, dir:pick(DLIST), wait:0});
  return n;
}
function makeEnemy(k, x, y) {
  const e = makeActor(x, y);
  Object.assign(e, {kind:k, speed:ESPEED[k], stun:0, chew:0, chewT:null, punch:0, punchFx:0, windup:0, daze:0, charge:false, dir:pick(DLIST), trail:[],
    state:'buried', t:1 + Math.random(), ph:'calm', ft:1.5 + Math.random() * 2});
  for (let i = 0; i < 9; i++) e.trail.push({x:x - e.dir.x * i * .14, y:y - e.dir.y * i * .14});
  return e;
}

function nextWave(silent) {
  S.wave++;
  if (S.wave >= S.waves.length) { levelWon(); return; }
  const type = S.waves[S.wave];
  S.wavePos[S.wave].forEach((p, i) => {
    const s = makeActor(p.x, p.y);
    Object.assign(s, {type, born: time + i * 0.05 + (silent ? 0 : 0.25), wait:rand(0, .5), t:rand(2.5, 5), open:Math.random() < .5, ct:rand(.3, 2), lid:0});
    S.snacks.push(s);
  });
  if (!silent) {
    sfx('wave');
    for (const p of S.players) if (p.dead) revive(p);
  }
}

function revive(p) {
  if (isBlock(p.sx, p.sy)) breakBlock(p.sx, p.sy, 0);
  Object.assign(p, {x:p.sx, y:p.sy, fx:p.sx, fy:p.sy, tx:p.sx, ty:p.sy, moving:false, dead:false, deathT:0, inv:INV_T, puff:0, shield:false});
  sfx('revive', {x:p.sx});
  ring(p.sx + .5, p.sy + .5, '#fff4b8');
}

function levelWon() {
  mode = 'won'; Ads.stop();
  sfx('win');
  const before = S.unlocksAtStart || new Set(unlockedSet());
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, levelIdx + 2));
  const key = `${twoP ? 2 : 1}-${levelIdx}`, secs = +S.elapsed.toFixed(1);
  const prev = save.best[key];
  const isBest = !prev || secs < prev;
  if (isBest) save.best[key] = secs;
  const stars = S.catches === 0 ? 3 : S.catches <= 2 ? 2 : 1;
  const total = S.players.reduce((a, p) => a + p.points, 0), prevScore = save.scores[key] || 0, bestScore = total > prevScore;
  if (bestScore) save.scores[key] = total;
  save.stars[key] = Math.max(save.stars[key] || 0, stars);
  persist();
  const fresh = unlockedSet().filter(id => !before.has(id));
  const unlockRow = fresh.length ? `<div class="unlocked"><b>New for your fish</b>${fresh.map(itemName).join(', ')}<button class="btn ghost" data-act="fish">Try it on</button></div>` : '';
  const last = levelIdx === LEVELS.length - 1;
  const scores = twoP ? `<div class="scores">${S.players.map(p => `<span style="color:${p.fish.tag}">${p.fish.name} ${p.points.toLocaleString()}</span>`).join('')}</div>` : '';
  const board = `<div class="board"><div><small>Time</small><b>${fmtTime(secs)}</b><em>${isBest ? 'New best' : `Best ${fmtTime(prev)}`}</em></div><div><small>Score</small><b>${total.toLocaleString()}</b><em>${bestScore ? 'New best' : `Best ${prevScore.toLocaleString()}`}</em></div></div>`;
  const starRow = `<div class="stars" aria-label="${stars} of 3 stars">${'★'.repeat(stars)}<span>${'★'.repeat(3 - stars)}</span></div>`;
  card.innerHTML = `<h3>${last ? 'The whole reef is clear' : 'Reef cleared'}</h3>${starRow}
    ${board}${scores}
    <p>${S.catches === 0 ? 'Nobody got caught.' : `Caught ${S.catches} ${S.catches === 1 ? 'time' : 'times'}.`}</p>${unlockRow}
    <div class="row">${last ? '' : '<button class="btn" data-act="next">Next reef</button>'}<button class="btn ghost" data-act="retry">Play again</button><button class="btn ghost" data-act="menu">Levels</button></div>`;
  S.wonT = .8; // a beat before the card: the board holds, the jingle plays, the last particles settle
  hideBanner();
  if (LEVELS[levelIdx].ending) {
    const html = card.innerHTML;
    playStory('ending', () => { mode = 'won'; card.innerHTML = html; overlay.hidden = false; });
  }
}

function startLevel(i) {
  const L = LEVELS[i];
  save.seenStory = save.seenStory || {};
  const go = () => {
    if (L.story && !save.seenStory[L.story]) { save.seenStory[L.story] = true; persist(); playStory(L.story, () => loadLevel(i)); }
    else loadLevel(i);
  };
  Ads.break(go);
}

function offerContinue() {
  S.offeredContinue = true; mode = 'fail'; Ads.stop();
  card.innerHTML = `<h3>Caught</h3><p>Keep going from here, with the snacks and score you have, or start the reef over.</p>
    <div class="row"><button class="btn" data-act="continue">Watch an ad to continue</button><button class="btn ghost" data-act="retry">Start over</button></div>`;
  overlay.hidden = false;
}
function continueLevel() {
  for (const p of S.players) if (p.dead) revive(p);
  S.failT = 0; mode = 'play'; overlay.hidden = true; Ads.play();
}
function pause() {
  if (mode !== 'play') return;
  mode = 'paused'; Ads.stop();
  card.innerHTML = `<h3>Paused</h3><p class="help">${keysEl.innerHTML}</p><div class="row"><button class="btn" data-act="resume">Resume</button><button class="btn ghost" data-act="retry">Restart</button><button class="btn ghost" data-act="menu">Levels</button></div>`;
  overlay.hidden = false;
}
function resume() { if (mode !== 'paused') return; mode = 'play'; overlay.hidden = true; for (const p of S.players) p.held.length = 0; if (S.readyT <= 0) Ads.play(); }
function showBanner(t, s) { banner.innerHTML = `<b>${t}</b>${s}`; banner.hidden = false; }
function hideBanner() { banner.hidden = true; }

card.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  unlockAudio(); sfx('click');
  if (b.dataset.mode) { twoP = b.dataset.mode === '2'; showMenu(); return; }
  if (b.dataset.lv) { startLevel(+b.dataset.lv); return; }
  const a = b.dataset.act;
  if (a === 'style') { openStyle(); return; }
  if (a === 'help') { showControls(); return; }
  if (a === 'fish') { fishEdit = twoP ? 'killi' : (save.pick === 'milli' ? 'milli' : 'killi'); showFish(); return; }
  if (a === 'fishdone') { showMenu(); return; }
  if (a === 'fishreset') { save.fish = save.fish || {}; delete save.fish[fishEdit]; persist(); showFish(); return; }
  if (b.dataset.pick) { save.pick = b.dataset.pick; fishEdit = b.dataset.pick; persist(); showFish(); return; }
  if (b.dataset.edit) { fishEdit = b.dataset.edit; showFish(); return; }
  if (b.dataset.fcolor || b.dataset.fpattern || b.dataset.facc) {
    save.fish = save.fish || {}; const cfg = {...fishCfg(fishEdit)};
    if (b.dataset.fcolor) cfg.color = b.dataset.fcolor;
    if (b.dataset.fpattern) cfg.pattern = b.dataset.fpattern;
    if (b.dataset.facc) cfg.acc = b.dataset.facc;
    save.fish[fishEdit] = cfg; persist(); showFish(); return;
  }
  if (a === 'story') { playStory('intro', showMenu); return; }
  if (a === 'next') startLevel(levelIdx + 1);
  else if (a === 'retry') Ads.break(() => loadLevel(levelIdx));
  else if (a === 'continue') Ads.reward(continueLevel, () => loadLevel(levelIdx, true));
  else if (a === 'menu') showMenu();
  else if (a === 'resume') resume();
});

// ================= simulation =================
function update(dt) {
  updateParts(dt);
  if (mode === 'story' && story) { story.chars += dt * 48; return; }
  if (mode === 'style' && S) {
    for (const p of S.players) updatePlayer(p, dt);
    updateUrchins(dt); updateSnacks(dt);
    for (const e of S.enemies) updateEnemy(e, dt);
    for (const n of S.friends) updateFriend(n, dt);
    friendCheck();
    return;
  }
  if (mode === 'won' && S && S.wonT > 0) { S.wonT -= dt; if (S.wonT <= 0) overlay.hidden = false; }
  if (mode !== 'play' || !S) return;
  if (S.readyT > 0) { S.readyT -= dt; if (S.readyT <= 0) { hideBanner(); Ads.play(); } return; }
  if (S.failT > 0) {
    S.failT -= dt;
    for (const p of S.players) if (p.deathT > 0) p.deathT -= dt;
    if (S.failT <= 0) {
      if (Ads.canReward() && !S.offeredContinue) offerContinue();
      else loadLevel(levelIdx, true);
    }
    return;
  }
  S.elapsed += dt;
  updateVents(dt);
  for (const q of S.popups) q.t += dt;
  S.popups = S.popups.filter(q => q.t < 1);
  for (const p of S.players) updatePlayer(p, dt);
  updateUrchins(dt);
  updateSnacks(dt);
  const calm = S.boss && S.boss.dead;
  for (const e of S.enemies) if (!calm || e.kind === 'K') updateEnemy(e, dt);
  for (const n of S.friends) updateFriend(n, dt);
  updateBoss(dt);
  if (mode !== 'play' || (S.boss && S.boss.dead)) return;
  collide();
  tentCollide();
  friendCheck();
  hazardCheck();
  collectCheck();
  if (mode === 'play' && S.failT <= 0 && S.players.every(p => p.dead)) S.failT = 1.6;
}

function updatePlayer(p, dt) {
  p.anim += dt;
  if (p.dead) { if (p.deathT > 0) p.deathT -= dt; return; }
  if (p.inv > 0) p.inv -= dt;
  if (p.puffCd > 0) p.puffCd = Math.max(0, p.puffCd - dt);
  if (p.puff > 0) { p.puff = Math.max(0, p.puff - dt); return; }
  const hid = hiddenP(p); if (hid && !p.inKelp) sfx('rustle', {x:p.fx, p:p.id}); p.inKelp = hid;
  const h = p.held.length ? DIRS[p.held[p.held.length - 1]] : null;
  if (h) p.face = h;
  // puff right away, even between cells; coral waits for the next cell so it grows from where the fish stands
  if (p.bufPuff) { p.bufPuff = false; if (p.puffCd <= 0) { startPuff(p); return; } sfx('bonk', {x:p.fx, p:p.id}); }
  // turning back mid-tile reverses at once instead of finishing the tile first
  if (p.moving && h && h.x === -(p.tx - p.x) && h.y === -(p.ty - p.y)) { p.tx = p.x; p.ty = p.y; }
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!p.moving) {
      if (p.bufAct) { p.bufAct = false; coralAction(p); }
      p.drift = false;
      if (h) { const nx = p.x + h.x, ny = p.y + h.y; if (inb(nx, ny) && S.grid[ny][nx] === '.') { p.tx = nx; p.ty = ny; p.moving = true; } }
      else { const cur = CUR[S.floor[p.y][p.x]]; if (cur) { const nx = p.x + cur.x, ny = p.y + cur.y; if (inb(nx, ny) && S.grid[ny][nx] === '.') { p.tx = nx; p.ty = ny; p.moving = true; p.drift = true; } } } // a current carries an idle fish
      if (!p.moving) break;
    }
    const left = advance(p, p.drift ? PSPEED * .45 : PSPEED, rem);
    if (left < 0) break;
    rem = left;
  }
}

function startPuff(p) {
  p.puff = PUFF_T; p.puffCd = PUFF_CD + PUFF_T;
  sfx('puff', {x:p.fx, p:p.id});
  for (const e of S.enemies) if (Math.hypot(e.fx - p.fx, e.fy - p.fy) < 1.7) stunEnemy(e);
  ring(p.fx + .5, p.fy + .5, 'rgba(255,250,220,0.9)');
}
// Hot vents erupt together every few seconds: a bright warning glow, then a burst of steam that stuns any creature
// standing on one (the fish are too light to mind). Lead a crab across a vent and time it.
const VENT_PERIOD = 4.5, VENT_WARN = .8;
function updateVents(dt) {
  if (!S.vents.length) return;
  S.ventT += dt;
  if (S.ventT < VENT_PERIOD) return;
  S.ventT = 0;
  let any = false;
  for (const v of S.vents) {
    if (S.grid[v.y][v.x] === '.') { steam(v.x, v.y, 0, true); any = true; }
    for (const e of S.enemies) if (!FLY[e.kind] && e.kind !== 'K' && Math.abs(e.fx - v.x) < .55 && Math.abs(e.fy - v.y) < .55) stunEnemy(e, STUN_T * .8);
  }
  if (any) sfx('vent', {x:7});
}
function stunEnemy(e, t) { if (e.kind === 'K') return; e.stun = t || STUN_T; e.chew = 0; e.chewT = null; e.punch = 0; e.windup = 0; e.charge = false; if (e.kind === 'F') { e.ph = 'calm'; e.ft = 3.2; } }
const harmless = e => (e.kind === 'Y' && e.state !== 'hunt') || (e.kind === 'K' && (e.crash > 0 || S.boss.dead));

function coralAction(p) {
  let dir = p.face, x = p.x + dir.x, y = p.y + dir.y, i = 0, g = 0;
  if (isBlock(x, y)) {
    while (isBlock(x, y) && g++ < 80) { breakBlock(x, y, i * 0.03); i++; const f = S.floor[y][x]; if (CUR[f]) { dir = CUR[f]; ring(x + .5, y + .5, 'rgba(190,250,255,0.8)'); } x += dir.x; y += dir.y; }
    sfx('break', {x:p.fx, p:p.id, n:i});
  } else if (canPlace(x, y)) {
    while (canPlace(x, y) && g++ < 80) { S.grid[y][x] = 'c'; S.born[y][x] = time + i * 0.03; i++; const f = S.floor[y][x]; if (CUR[f]) { dir = CUR[f]; ring(x + .5, y + .5, 'rgba(190,250,255,0.8)'); } x += dir.x; y += dir.y; }
    sfx('grow', {x:p.fx, p:p.id, n:i});
    if (inb(x, y) && S.floor[y][x] === 'h' && S.grid[y][x] === '.') { steam(x, y, i * 0.03, true); sfx('vent', {x, p:p.id}); }
  } else {
    if (inb(x, y) && S.floor[y][x] === 'h') { steam(x, y, 0, true); sfx('vent', {x, p:p.id}); }
    sfx('bonk', {x:p.fx, p:p.id});
  }
}

function breakBlock(x, y, delay) {
  S.grid[y][x] = '.';
  for (let k = 0; k < 7; k++) parts.push({x:x + .5, y:y + .4, vx:rand(-1.8, 1.8), vy:rand(-2.2, .4), life:.6, max:.6, size:rand(.05, .11), kind:'chip', delay, ph:0});
}

function updateUrchins(dt) {
  for (const u of S.urchins.values()) {
    if (S.grid[u.y][u.x] === 'c') { u.cov = true; u.armed = false; continue; }
    if (u.cov) { u.cov = false; u.rearm = 3; }
    if (u.rearm > 0) { u.rearm -= dt; if (u.rearm <= 0) { u.armed = true; u.rearm = 0; } }
  }
}

function snackFree(s, x, y) {
  return inb(x, y) && S.grid[y][x] === '.' && S.floor[y][x] !== 'x' && !occupied(x, y, null) && !snackAt(x, y, s);
}
function randomOpenTile() {
  const ap = alive();
  for (let k = 0; k < 80; k++) {
    const x = 1 + ((Math.random() * (COLS - 2)) | 0), y = 1 + ((Math.random() * (ROWS - 2)) | 0);
    if (!snackFree(null, x, y)) continue;
    if (ap.some(p => Math.abs(p.fx - x) + Math.abs(p.fy - y) < 2)) continue;
    return {x, y};
  }
  return null;
}

function updateSnacks(dt) {
  const ap = alive();
  const distTo = (x, y) => ap.length ? Math.min(...ap.map(p => Math.abs(p.fx - x) + Math.abs(p.fy - y))) : 99;
  for (const s of S.snacks) {
    s.anim += dt;
    if (time < s.born) continue;
    const enc = S.grid[Math.round(s.fy)][Math.round(s.fx)] === 'c';
    if (s.type === 'shrimp') {
      if (s.moving) { advance(s, 2.7, dt); continue; }
      if (enc) continue;
      if (s.wait > 0) { s.wait -= dt; continue; }
      const opts = DLIST.filter(d => snackFree(s, s.x + d.x, s.y + d.y));
      if (!opts.length) { s.wait = .3; continue; }
      const here = distTo(s.x, s.y);
      let d = null;
      if (here > 5) { if (Math.random() < .5) { s.wait = rand(.3, .9); continue; } d = pick(opts); }
      else {
        let best = -1;
        for (const o of opts) { const v = distTo(s.x + o.x, s.y + o.y) + Math.random() * .01; if (v > best) { best = v; d = o; } }
        if (best <= here) { s.wait = .2; continue; }
      }
      s.dir = d; s.tx = s.x + d.x; s.ty = s.y + d.y; s.moving = true; s.wait = rand(.03, .15);
    } else if (s.type === 'clam') {
      s.ct -= dt;
      if (s.ct <= 0) { s.open = !s.open; s.ct = s.open ? 2.2 : 1.6; }
      s.lid += ((s.open ? 1 : 0) - s.lid) * Math.min(1, dt * 10);
    } else if (s.type === 'moon') {
      s.t -= dt;
      if (s.t <= 0) {
        s.t = rand(3.5, 5.5);
        if (enc) continue;
        const spot = randomOpenTile();
        if (spot) {
          sparkle(s.fx + .5, s.fy + .5, '#cfe3ff');
          s.x = s.tx = s.fx = spot.x; s.y = s.ty = s.fy = spot.y; s.born = time;
          sfx('blink', {x:spot.x});
        }
      }
    }
  }
}

function updateEnemy(e, dt) {
  e.anim += dt;
  if (e.kind === 'K') {
    if (S.boss.dead) return;
    if (e.crash > 0) { e.crash -= dt; return; }
    if (e.ccd > 0) e.ccd -= dt;
  }
  if (e.punchFx > 0) e.punchFx -= dt;
  if (e.stun > 0) { e.stun -= dt; return; }
  if (e.windup > 0) { e.windup -= dt; return; }
  if (e.daze > 0) { e.daze -= dt; return; }
  if (e.chew > 0) {
    e.chew -= dt;
    if (e.chew <= 0 && e.chewT) { if (isBlock(e.chewT.x, e.chewT.y)) { breakBlock(e.chewT.x, e.chewT.y, 0); sfx('break', {x:e.fx}); } e.chewT = null; }
    return;
  }
  if (e.punch > 0) { e.punch -= dt; if (e.punch <= 0) punchLine(e); return; }
  if (e.kind === 'Y') {
    if (e.state === 'buried') {
      e.t -= dt;
      if (e.t <= 0 && visibleTo(e).some(p => Math.hypot(p.fx - e.fx, p.fy - e.fy) < 2.3)) {
        e.state = 'rising'; e.t = .55; sfx('rise', {x:e.fx});
        for (let i = 0; i < 10; i++) parts.push({x:e.fx + .5 + rand(-.3, .3), y:e.fy + .7, vx:rand(-1.2, 1.2), vy:-rand(.5, 1.6), life:.6, max:.6, size:rand(.04, .08), kind:'sand', delay:0, ph:0});
      }
      return;
    }
    if (e.state === 'rising') { e.t -= dt; if (e.t <= 0) { e.state = 'hunt'; e.t = 5; } return; }
    if (e.state === 'burrow') { e.t -= dt; if (e.t <= 0) { e.state = 'buried'; e.t = 3; } return; }
    e.t -= dt;
    if (e.t <= 0 && !e.moving) { e.state = 'burrow'; e.t = .6; return; }
  }
  if (e.kind === 'F') {
    e.ft -= dt;
    if (e.ft <= 0) {
      if (e.ph === 'calm') { e.ph = 'warn'; e.ft = .6; }
      else if (e.ph === 'warn') { e.ph = 'flare'; e.ft = 1.2; sfx('flare', {x:e.fx}); }
      else { e.ph = 'calm'; e.ft = 3.2; }
    }
    if (e.ph !== 'calm' && !e.moving) return;
  }
  const speed = e.kind === 'S' && e.charge ? 8.5 : e.kind === 'K' ? (e.charge ? 9.5 : e.speed * (1 + (S.boss.max - S.boss.hp) * .12)) : e.speed;
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!e.moving) { decide(e); if (!e.moving) break; }
    const left = advance(e, speed, rem);
    if (left < 0) break;
    rem = left;
  }
  if (e.kind === 'E') {
    const last = e.trail[0];
    if (Math.hypot(e.fx - last.x, e.fy - last.y) > 0.14) { e.trail.unshift({x:e.fx, y:e.fy}); if (e.trail.length > 9) e.trail.pop(); }
  }
}

function punchLine(e) {
  let x = e.x + e.dir.x, y = e.y + e.dir.y, i = 0;
  while (isBlock(x, y) && i < 20) { breakBlock(x, y, i * 0.025); x += e.dir.x; y += e.dir.y; i++; }
  e.punchFx = .3;
  sfx('punch', {x:e.fx, n:i}); addShake(.2);
  ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(255,240,200,0.9)');
}

function sharkSight(e) {
  const ap = visibleTo(e);
  for (const d of DLIST) {
    let x = e.x, y = e.y;
    for (let k = 0; k < 13; k++) {
      x += d.x; y += d.y;
      if (!inb(x, y) || S.grid[y][x] === '#') break;
      if (ap.some(p => Math.round(p.fx) === x && Math.round(p.fy) === y)) return d;
    }
  }
  return null;
}

function lineOfSight(e, max) {
  const ap = visibleTo(e);
  for (const d of DLIST) {
    let x = e.x, y = e.y;
    for (let k = 0; k < max; k++) {
      x += d.x; y += d.y;
      if (!inb(x, y) || S.grid[y][x] !== '.') break;
      if (ap.some(p => Math.round(p.fx) === x && Math.round(p.fy) === y)) return d;
    }
  }
  return null;
}

function decide(e) {
  const free = d => {
    const x = e.x + d.x, y = e.y + d.y;
    if (!inb(x, y)) return false;
    const t = S.grid[y][x];
    if (t === '#') return false;
    if (!FLY[e.kind] && (t === 'c' || snackAt(x, y, null))) return false;
    return !occupied(x, y, e);
  };
  // a current carries any walking or swimming creature along; flyers and Bruiser are too big or too high for it
  const cur = CUR[S.floor[e.y][e.x]];
  if (cur && !FLY[e.kind] && e.kind !== 'K' && free(cur)) { e.dir = cur; e.tx = e.x + cur.x; e.ty = e.y + cur.y; e.moving = true; return; }
  let d = null;
  if (e.kind === 'K') {
    if (e.charge) {
      const nx = e.x + e.dir.x, ny = e.y + e.dir.y;
      if (!inb(nx, ny) || S.grid[ny][nx] === '#') {
        e.charge = false; e.daze = .5; e.ccd = 1.4; sfx('thud', {x:e.fx}); addShake(.2);
        ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(220,240,255,0.8)'); return;
      }
      if (S.grid[ny][nx] === 'c') {
        breakBlock(nx, ny, 0); e.charge = false; e.crash = 2.6; e.ccd = 1.6;
        sfx('crash', {x:e.fx}); addShake(.4); ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(255,240,200,0.95)'); return;
      }
      d = e.dir;
    } else if (e.ccd <= 0) {
      const los = sharkSight(e);
      if (los) { e.dir = los; e.charge = true; e.windup = Math.max(.35, .75 - (S.boss.max - S.boss.hp) * .1); e.ccd = 99; sfx('roar', {x:e.fx}); return; }
    }
  }
  if (e.kind === 'A') {
    if (free(e.dir)) d = e.dir;
    else {
      const side = DLIST.filter(o => o.x !== e.dir.x && o.y !== e.dir.y && o.x !== -e.dir.x && o.y !== -e.dir.y && free(o));
      const back = {x:-e.dir.x, y:-e.dir.y};
      d = side.length ? pick(side) : (free(back) ? DLIST.find(o => o.x === back.x && o.y === back.y) : null);
      if (!d) return;
    }
  }
  if (e.kind === 'S') {
    if (e.charge) {
      if (free(e.dir)) d = e.dir;
      else { e.charge = false; e.daze = .7; sfx('thud', {x:e.fx}); addShake(.15); ring(e.fx + .5 + e.dir.x * .5, e.fy + .5 + e.dir.y * .5, 'rgba(220,240,255,0.8)'); return; }
    } else {
      const los = lineOfSight(e, 8);
      if (los) { e.dir = los; e.charge = true; e.windup = .45; sfx('charge', {x:e.fx}); return; }
    }
  }
  if (!d && (e.kind === 'E' || e.kind === 'O' || e.kind === 'M' || e.kind === 'Y' || e.kind === 'K') && Math.random() > 0.1) {
    const s = bfsStep(e, e.kind === 'O' || e.kind === 'M');
    if (s) {
      const nx = e.x + s.x, ny = e.y + s.y;
      if (e.kind !== 'E' && isBlock(nx, ny)) {
        e.dir = s;
        if (e.kind === 'O') { e.chew = .8; e.chewT = {x:nx, y:ny}; } else e.punch = .55;
        return;
      }
      if (free(s)) d = s;
    }
  }
  if (!d) {
    const opts = DLIST.filter(free);
    if (!opts.length) return;
    const keep = e.kind === 'J' ? .72 : .9;
    if (free(e.dir) && Math.random() < keep) d = e.dir;
    else { const nr = opts.filter(o => !(o.x === -e.dir.x && o.y === -e.dir.y)); d = pick(nr.length ? nr : opts); }
  }
  e.dir = d; e.tx = e.x + d.x; e.ty = e.y + d.y; e.moving = true;
}

function bfsStep(e, throughBlocks, targets) {
  const goals = new Set((targets || visibleTo(e)).map(p => Math.round(p.fy) * COLS + Math.round(p.fx)));
  const start = e.y * COLS + e.x;
  if (!goals.size || goals.has(start)) return null;
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  prev[start] = start;
  const q = [start];
  let found = -1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (goals.has(c)) { found = c; break; }
    const cx = c % COLS, cy = (c / COLS) | 0;
    for (const d of DLIST) {
      const nx = cx + d.x, ny = cy + d.y;
      if (!inb(nx, ny)) continue;
      const t = S.grid[ny][nx];
      if (t === '#' || (t === 'c' && !throughBlocks)) continue;
      const ni = ny * COLS + nx;
      if (prev[ni] !== -1) continue;
      prev[ni] = c; q.push(ni);
    }
  }
  if (found < 0) return null;
  let c = found;
  while (prev[c] !== start) c = prev[c];
  return dirOf(c % COLS - e.x, ((c / COLS) | 0) - e.y);
}

function collide() {
  for (const p of S.players) {
    if (p.dead) continue;
    for (const e of S.enemies) {
      const d = Math.hypot(e.fx - p.fx, e.fy - p.fy);
      if (e.kind === 'K') {
        if (S.boss.dead) continue;
        if (e.crash > 0) { if (p.puff > 0 && d < 1.7) bossHit(p); continue; }
        if (p.puff > 0 || p.inv > 0) continue;
        if (d < .8) { hurt(p, e); break; }
        continue;
      }
      if (harmless(e)) continue;
      if (p.puff > 0) { if (d < 1.3 && e.stun <= 0) { stunEnemy(e); sfx('stun', {x:e.fx}); } continue; }
      if (p.inv > 0 || e.stun > 0) continue;
      if (d < (e.kind === 'F' && e.ph === 'flare' ? 1.3 : .62)) { hurt(p, e); break; }
    }
  }
}

function setupBoss(L) {
  if (L.boss === 'shark') {
    const e = S.enemies.find(o => o.kind === 'K');
    e.crash = 0; e.ccd = 2;
    S.boss = {kind:'shark', name:'Bruiser', hp:4, max:4, e, hurtT:0, hitCd:0, dying:0, dead:false};
  } else {
    S.boss = {kind:'queen', name:'Kraken Queen', hp:6, max:6, tents:[], spawnT:2.4, hurtT:0, hitCd:0, dying:0, dead:false, cx:7.5, cy:1.6};
  }
}

function award(p, pts, x, y, hot) {
  p.points += pts;
  S.popups.push({x, y, text:`+${pts}`, col:hot ? '#ffd166' : p.fish.tag, t:0, big:pts >= 100});
  hudCache.flash = time;
}

function bossHit(p) {
  const B = S.boss;
  if (!B || B.dead || B.hitCd > 0) return;
  B.hp--; B.hurtT = .5; B.hitCd = .6;
  if (p) award(p, BOSS_HIT_PTS + (B.hp <= 0 ? BOSS_WIN_PTS : 0), p.fx + .5, p.fy - .2, true);
  sfx('bosshit'); addShake(.4);
  for (const p of S.players) if (p.dead) revive(p);
  if (B.kind === 'shark') {
    const e = B.e; e.crash = 0; e.daze = .9; e.ccd = 1.2; e.charge = false;
    ring(e.fx + .5, e.fy + .45, 'rgba(255,240,200,0.95)'); sparkle(e.fx + .5, e.fy + .45, '#fff3b0');
  }
  if (B.hp <= 0) { B.dead = true; B.dying = 2.2; sfx('bossdown'); for (const t of B.tents || []) t.state = 'back'; }
}

function updateBoss(dt) {
  const B = S.boss;
  if (!B) return;
  if (B.hurtT > 0) B.hurtT -= dt;
  if (B.hitCd > 0) B.hitCd -= dt;
  if (B.kind === 'queen') updateTents(dt);
  if (B.dead) { B.dying -= dt; if (B.dying <= 0 && mode === 'play') levelWon(); return; }
  if (B.kind === 'queen') {
    B.spawnT -= dt;
    const active = B.tents.filter(t => t.state !== 'back').length;
    if (B.spawnT <= 0 && active < (B.hp <= 3 ? 2 : 1)) { spawnTent(); B.spawnT = B.hp <= 3 ? 1.7 : 2.6; }
  }
}

function spawnTent() {
  const B = S.boss, ap = alive();
  if (!ap.length) return;
  const p = pick(ap), px = Math.round(p.fx), py = Math.round(p.fy);
  const used = new Set(B.tents.map(t => t.key));
  const lane = type => {
    let sx, sy, d;
    if (type === 'row') { if (p.fx >= 7) { sx = 1; d = RIGHT; } else { sx = COLS - 2; d = LEFT; } sy = py; }
    else { sx = px; sy = ROWS - 2; d = UP; }
    const key = type + (type === 'row' ? sy : sx);
    if (used.has(key) || !inb(sx, sy) || S.grid[sy][sx] === '#') return null;
    const cells = [];
    let x = sx, y = sy;
    while (inb(x, y) && S.grid[y][x] !== '#') { cells.push({x, y}); x += d.x; y += d.y; }
    if (cells.length < 3) return null;
    return {key, d, cells, len:0, state:'warn', t:.9, stuckAt:-1, wig:Math.random() * 6};
  };
  const first = Math.random() < .5 ? 'row' : 'col';
  const t = lane(first) || lane(first === 'row' ? 'col' : 'row');
  if (t) { B.tents.push(t); sfx('warn', {x:t.cells[0].x}); }
}

function updateTents(dt) {
  const B = S.boss;
  for (const t of B.tents) {
    t.wig += dt;
    if (t.state === 'warn') { t.t -= dt; if (t.t <= 0) { t.state = 'out'; sfx('lash', {x:t.cells[0].x}); } }
    else if (t.state === 'out') {
      const from = Math.floor(t.len);
      t.len = Math.min(t.cells.length, t.len + dt * 13);
      for (let i = from; i < Math.ceil(t.len); i++) {
        const c = t.cells[i];
        if (S.grid[c.y][c.x] === 'c') { t.len = i; t.stuckAt = i; t.state = 'stuck'; t.t = 2.6; sfx('stuck', {x:c.x}); addShake(.15); break; }
      }
      if (t.state === 'out' && t.len >= t.cells.length) { t.state = 'hold'; t.t = .35; }
    } else if (t.state === 'hold') { t.t -= dt; if (t.t <= 0) t.state = 'back'; }
    else if (t.state === 'stuck') {
      t.t -= dt;
      if (t.t <= 0) { const c = t.cells[t.stuckAt]; if (isBlock(c.x, c.y)) { breakBlock(c.x, c.y, 0); sfx('break', {x:c.x}); } t.state = 'back'; }
    } else if (t.state === 'back') t.len -= dt * 10;
  }
  B.tents = B.tents.filter(t => !(t.state === 'back' && t.len <= 0));
}

function tentEnds(t) {
  const bx = t.cells[0].x + .5 - t.d.x * .5, by = t.cells[0].y + .5 - t.d.y * .5;
  return {bx, by, tx:bx + t.d.x * t.len, ty:by + t.d.y * t.len};
}

function tentCollide() {
  const B = S.boss;
  if (!B || B.kind !== 'queen' || B.dead) return;
  for (const t of B.tents) {
    if (t.state === 'warn' || t.state === 'back') continue;
    const {bx, by, tx, ty} = tentEnds(t);
    for (const p of S.players) {
      if (p.dead) continue;
      const cx = p.fx + .5, cy = p.fy + .5;
      if (t.state === 'stuck') {
        if (p.puff > 0 && Math.hypot(cx - tx, cy - ty) < 1.6) { bossHit(p); t.state = 'back'; return; }
        continue;
      }
      if (p.puff > 0 || p.inv > 0) continue;
      const along = (cx - bx) * t.d.x + (cy - by) * t.d.y, perp = Math.abs((cx - bx) * t.d.y - (cy - by) * t.d.x);
      if (along > -.2 && along < t.len + .1 && perp < .5) hurt(p, null);
    }
  }
}

function hurt(p, e) {
  if (p.shield) {
    p.shield = false; p.inv = 1.2;
    if (e) stunEnemy(e, 2);
    sfx('pop', {x:p.fx, p:p.id}); ring(p.fx + .5, p.fy + .45, 'rgba(200,240,255,0.95)'); addShake(.12);
    for (let i = 0; i < 10; i++) parts.push({x:p.fx + .5, y:p.fy + .45, vx:rand(-2, 2), vy:rand(-2, 1), life:.5, max:.5, size:rand(.04, .08), kind:'bub', delay:0, ph:Math.random() * 6});
    return;
  }
  killPlayer(p);
}

function updateFriend(n, dt) {
  n.anim += dt;
  if (n.shieldCd > 0) n.shieldCd -= dt;
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!n.moving) {
      if (n.wait > 0) { n.wait -= dt; break; }
      const free = d => { const x = n.x + d.x, y = n.y + d.y; return inb(x, y) && S.grid[y][x] === '.'; };
      const ap = alive();
      const far = ap.length && Math.min(...ap.map(p => Math.abs(p.fx - n.fx) + Math.abs(p.fy - n.fy))) > 3;
      let d = null;
      if (far && Math.random() < .7) { const s = bfsStep(n, false, ap); if (s && free(s)) d = s; }
      if (!d) {
        const opts = DLIST.filter(free);
        if (!opts.length) { n.wait = .4; break; }
        if (free(n.dir) && Math.random() < .8) d = n.dir;
        else { const nr = opts.filter(o => !(o.x === -n.dir.x && o.y === -n.dir.y)); d = pick(nr.length ? nr : opts); }
        if (!far && Math.random() < .15) { n.wait = rand(.4, 1.2); n.dir = d; break; }
      }
      n.dir = d; n.tx = n.x + d.x; n.ty = n.y + d.y; n.moving = true;
    }
    const left = advance(n, n.speed, rem);
    if (left < 0) break;
    rem = left;
  }
}

function friendCheck() {
  for (const n of S.friends) {
    for (const e of S.enemies) {
      if (e.kind === 'K' || harmless(e) || e.stun > 0) continue;
      if (Math.hypot(e.fx - n.fx, e.fy - n.fy) < .8) {
        stunEnemy(e, 1.8); sfx('boop', {x:n.fx}); ring(e.fx + .5, e.fy + .45, 'rgba(255,255,255,0.8)'); n.happy = .6;
      }
    }

    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(.13, -.08); ctx.lineTo(.13, .08); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d63e6c'; circ(0, 0, .035); ctx.fill();
  } else if (acc === 'flower') {
    ctx.translate(r * .05, -r * .94); ctx.scale(k, k);
    ctx.fillStyle = '#fff3f7';
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; circ(Math.cos(a) * .055, Math.sin(a) * .055, .045); ctx.fill(); }
    ctx.fillStyle = '#ffcf4a'; circ(0, 0, .035); ctx.fill();
  } else if (acc === 'cap') {
    // a sailor's cap: white crown, navy band with a gold stripe, short dark visor, red pompom
    ctx.translate(-r * .02, -r * .9); ctx.rotate(-.15); ctx.scale(k, k);
    ctx.fillStyle = '#1e2d4d'; ctx.beginPath(); ctx.ellipse(.1, .035, .17, .045, .12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-.21, .025); ctx.quadraticCurveTo(-.2, -.17, 0, -.19); ctx.quadraticCurveTo(.2, -.17, .21, .025); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9fb2cc'; ctx.lineWidth = .012; ctx.stroke();
    ctx.fillStyle = '#2f55a8'; ctx.fillRect(-.21, -.03, .42, .055);
    ctx.fillStyle = '#f6c445'; ctx.fillRect(-.21, -.012, .42, .012);
    ctx.fillStyle = '#e8463a'; circ(0, -.2, .032); ctx.fill();
  } else if (acc === 'star') {
    ctx.translate(-r * .3, -r * .9); ctx.rotate(.3); ctx.scale(k * 1.35, k * 1.35);
    ctx.fillStyle = '#ffb347'; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? .04 : .095; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.9)'; circ(0, 0, .015); ctx.fill();
  } else if (acc === 'fin') {
    // a dorsal fin on a headband, swept back like Bruiser's, with a pale front face
    ctx.translate(-r * .1, -r * .9); ctx.rotate(-.1); ctx.scale(k, k);
    ctx.fillStyle = '#7b94a3'; ctx.beginPath(); ctx.moveTo(-.17, .02); ctx.quadraticCurveTo(-.1, -.2, .06, -.32); ctx.quadraticCurveTo(.07, -.13, .18, .02); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3c4f5a'; ctx.lineWidth = .012; ctx.stroke();
    ctx.fillStyle = '#d3dee4'; ctx.beginPath(); ctx.moveTo(-.09, .02); ctx.quadraticCurveTo(-.03, -.14, .05, -.25); ctx.quadraticCurveTo(.03, -.1, .08, .02); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4d6472'; rr(-.22, .0, .44, .055, .02); ctx.fill();
    ctx.fillStyle = '#9fb3c0'; ctx.fillRect(-.22, .02, .44, .012);
  } else if (acc === 'crown') {
    ctx.translate(-r * .06, -r * .93); ctx.rotate(-.12); ctx.scale(k, k);
    ctx.fillStyle = '#f6c445';
    ctx.beginPath(); ctx.moveTo(-.13, .03);
    for (const [x, y] of [[-.12, -.11], [-.06, -.03], [0, -.15], [.06, -.03], [.12, -.11], [.13, .03]]) ctx.lineTo(x, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8463a'; circ(0, -.05, .022); ctx.fill();
    ctx.fillStyle = '#7cc4f0'; circ(-.08, -.01, .016); ctx.fill(); circ(.08, -.01, .016); ctx.fill();
  } else if (acc === 'pearls') {
    // a string of larger pearls under the chin, alternating warm and cool tints, on a thin cord
    // a shallow arc under the chin, from about 4 o'clock round to 8, sitting on the body's outline
    const pts = []; for (let i = 0; i < 9; i++) { const a = .2 * Math.PI + i * (.6 * Math.PI / 8); pts.push([Math.cos(a) * r * .82, Math.sin(a) * r * .82]); }

      ctx.fillStyle = 'rgba(0,25,35,0.25)'; circ(x + .01 * k, y + .012 * k, .042 * k); ctx.fill();
      const g = ctx.createRadialGradient(x - .013 * k, y - .013 * k, 0, x, y, .045 * k);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.55, i % 2 ? '#f6e8ff' : '#e6f4ff'); g.addColorStop(1, '#b4a6c4');

  ctx.restore();
}

// small animated fish previews inside menu cards
function drawPreviews() {
  const cvs = card.querySelectorAll('canvas[data-who]');
  if (!cvs.length) return;
  const keep = ctx;
  for (const pc of cvs) {
    const w = pc.clientWidth || +pc.getAttribute('width') || 120, d = Math.min(window.devicePixelRatio || 1, 2.5);
    if (pc.width !== Math.round(w * d)) { pc.width = Math.round(w * d); pc.height = Math.round(w * d); }
    const c = pc.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pc.width, pc.height);
    const u = pc.width / 1.5;
    c.setTransform(u, 0, 0, u, 0, 0);
    ctx = c;
    const who = pc.dataset.who, big = pc.dataset.big === '1';
    const cyc = (time + (who === 'milli' ? 1.3 : 0)) % 4;
    try {
      drawPuffer({id:who === 'milli' ? 1 : 0, fish:getFish(who), fx:.28, fy:.36, face:who === 'milli' && !big ? LEFT : RIGHT, puff:big && cyc > 3 ? .65 : 0, dead:false, inv:0});
    } finally { ctx = keep; }
  }
}

function drawTags() {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `800 ${Math.max(10, Math.round(T * .3))}px Grandstander, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round'; // miter joins put spikes on the M and N of the outlined names
  for (const n of S.friends) {
    const x = (n.fx + .5) * T, y = (n.fy - .02) * T;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,26,36,0.75)'; ctx.strokeText('Niko', x, y);
    ctx.fillStyle = '#ffd6e0'; ctx.fillText('Niko', x, y);
  }
  for (const q of S.popups) {
    const k = q.t, x = q.x * T, y = (q.y - k * .9) * T;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.font = `800 ${Math.max(11, Math.round(T * (q.big ? .5 : .36)))}px Grandstander, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(2,26,36,0.8)'; ctx.strokeText(q.text, x, y);
    ctx.fillStyle = q.col; ctx.fillText(q.text, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.font = `800 ${Math.max(10, Math.round(T * .3))}px Grandstander, system-ui, sans-serif`;
  if (!twoP && mode !== 'style') { ctx.restore(); return; }
  for (const p of S.players) {
    if (p.dead) continue;
    const x = (p.fx + .5) * T, y = (p.fy - .02) * T - (p.puff > 0 ? T * .14 : 0);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,26,36,0.75)'; ctx.strokeText(p.fish.name, x, y);
    ctx.fillStyle = p.fish.tag; ctx.fillText(p.fish.name, x, y);
  }
  ctx.restore();
}

function drawStun(e) {
  if (e.stun <= 0) return;
  ctx.fillStyle = '#fff4a3';
  for (let i = 0; i < 3; i++) { const a = time * 5 + i * 2.09; circ(e.fx + .5 + Math.cos(a) * .22, e.fy + .02 + Math.sin(a) * .07, .045); ctx.fill(); }
}

function drawEnemy(e) {
  if (e.kind === 'Y' && e.state === 'buried') { drawRay(e); return; }
  shadow(e.fx + .5, e.fy + (FLY[e.kind] ? .97 : .88), e.kind === 'J' ? .2 : e.kind === 'A' ? .32 : e.kind === 'K' ? .5 : .3);
  ctx.save();
  if (e.stun > 0) ctx.globalAlpha = .75;
  ({C:drawCrab, J:drawJelly, E:drawEel, O:drawOcto, S:drawSword, M:drawMantis, A:drawManta, Y:drawRay, F:drawLion, K:drawShark})[e.kind](e);
  ctx.restore();
  drawStun(e);
}

function drawCrab(e) {
  const w = Math.sin(e.anim * 16) * (e.moving && e.stun <= 0 ? 1 : .15);
  ctx.translate(e.fx + .5, e.fy + .5);
  ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .045; ctx.lineCap = 'round';
  for (let s = -1; s <= 1; s += 2) for (let i = 0; i < 3; i++) {
    const yy = -.02 + i * .07;
    ctx.beginPath(); ctx.moveTo(s * .2, yy); ctx.lineTo(s * .35, yy + .04 + (i % 2 ? w : -w) * .03); ctx.lineTo(s * .4, yy + .15); ctx.stroke();
  }
  for (let s = -1; s <= 1; s += 2) {
    ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .05;
    ctx.beginPath(); ctx.moveTo(s * .16, -.08); ctx.lineTo(s * .28, -.22); ctx.stroke();
    ctx.fillStyle = '#f0604a'; circ(s * .31, -.28, .095); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; circ(s * .29, -.31, .03); ctx.fill();
    ctx.strokeStyle = '#7a1f14'; ctx.lineWidth = .028;
    ctx.beginPath(); ctx.moveTo(s * .31, -.28); ctx.lineTo(s * .38, -.36 - w * .02); ctx.stroke();
  }
  const g = ctx.createLinearGradient(0, -.2, 0, .2);
  g.addColorStop(0, '#ff7a5c'); g.addColorStop(1, '#d6453a');
  ctx.fillStyle = g; ell(0, 0, .28, .2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ell(0, -.08, .15, .05); ctx.fill();
  for (let s = -1; s <= 1; s += 2) {
    ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .03;
    ctx.beginPath(); ctx.moveTo(s * .07, -.13); ctx.lineTo(s * .09, -.24); ctx.stroke();
    ctx.fillStyle = '#fff'; circ(s * .09, -.26, .05); ctx.fill();
    ctx.fillStyle = '#111'; circ(s * .09 + e.dir.x * .015, -.26 + e.dir.y * .015, .025); ctx.fill();
  }
}

function drawJelly(e) {
  // cut from three cards: a dark bell, a mid bell and a pale cap, with four paper strips. Every piece casts a small
  // shadow on the one beneath it, which is what makes it read as layered paper.
  const pulse = Math.sin(e.anim * 4) * .035;
  ctx.translate(e.fx + .5, e.fy + .3);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const piece = (path, col) => { ctx.save(); ctx.translate(.022, .036); ctx.fillStyle = 'rgba(8,10,40,0.32)'; ctx.beginPath(); path(); ctx.fill(); ctx.restore(); ctx.fillStyle = col; ctx.beginPath(); path(); ctx.fill(); };
  const strip = (x0, w, ph) => { const path = () => { ctx.moveTo(x0, .05); for (let k = 1; k <= 4; k++) ctx.lineTo(x0 + Math.sin(e.anim * 5 + ph + k * .9) * .04, .05 + k * .09); };
    ctx.save(); ctx.translate(.022, .036); ctx.strokeStyle = 'rgba(8,10,40,0.32)'; ctx.lineWidth = w; ctx.beginPath(); path(); ctx.stroke(); ctx.restore(); ctx.strokeStyle = '#c9a6ec'; ctx.lineWidth = w; ctx.beginPath(); path(); ctx.stroke(); };
  const dome = (r, ry, y, scallops) => () => { ctx.ellipse(0, y, r, ry, 0, Math.PI, 0); if (scallops) { for (let i = 0; i <= scallops; i++) ctx.lineTo(r - i * (2 * r) / scallops, y + (i % 2 ? .05 : 0)); } ctx.closePath(); };
  const rx = .29 + pulse, ry = .27 - pulse;
  strip(-.15, .05, 0); strip(-.05, .04, 1); strip(.05, .05, 2); strip(.15, .04, 3);
  piece(dome(rx, ry, .04, 6), '#8e55c8');
  piece(dome(rx * .8, ry * .8, .02, 0), '#b483e6');
  piece(dome(rx * .5, ry * .5, -.02, 0), '#d9bdf7');
  ctx.fillStyle = '#3b1d52'; circ(-.07, -.01, .026); ctx.fill(); circ(.07, -.01, .026); ctx.fill();
}

function drawEel(e) {
  const pts = [{x:e.fx, y:e.fy}, ...e.trail], n = pts.length, off = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = a.x - b.x, dy = a.y - b.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const w = i === 0 ? 0 : Math.sin(e.anim * 8 + i * .9) * .06 * Math.min(1, i / 3);
    off.push({x:pts[i].x + .5 - dy * w, y:pts[i].y + .45 + dx * w, nx: -dy, ny: dx});
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (silMode()) {
    ctx.lineWidth = .24;
    ctx.beginPath(); ctx.moveTo(off[0].x, off[0].y); for (let i = 1; i < n; i++) ctx.lineTo(off[i].x, off[i].y); ctx.stroke();
    ell(e.fx + .5, e.fy + .45, .2, .2); ctx.fill();
    return;
  }
  const body = (cols, ws) => { for (let pass = 0; pass < cols.length; pass++) { ctx.strokeStyle = cols[pass];
    for (let i = n - 1; i >= 1; i--) { ctx.lineWidth = ws[pass] * (1 - (i / n) * .7); ctx.beginPath(); ctx.moveTo(off[i].x, off[i].y); ctx.lineTo(off[i - 1].x, off[i - 1].y); ctx.stroke(); } } };
  const hx = e.fx + .5, hy = e.fy + .45, d = e.dir, px = -d.y, py = d.x;
  const P = (f, s) => [hx + d.x * f + px * s, hy + d.y * f + py * s];
  {
    // moray: a fin ridge along the back, wide head with an open toothy mouth, eyes on top
    ctx.strokeStyle = 'rgba(200,224,120,0.55)';
    for (let i = n - 1; i >= 1; i--) { ctx.lineWidth = .4 * (1 - (i / n) * .6); ctx.beginPath(); ctx.moveTo(off[i].x, off[i].y - .04); ctx.lineTo(off[i - 1].x, off[i - 1].y - .04); ctx.stroke(); }
    body(['#3e6a1e', '#6f9a32', '#c8e07a'], [.3, .22, .06]);
    // jowly head: wide cheeks at the back narrowing to a snout
    ctx.fillStyle = '#5c8a2e'; ctx.beginPath(); ctx.moveTo(...P(.3, .03)); ctx.quadraticCurveTo(...P(.16, -.22), ...P(-.08, -.21)); ctx.quadraticCurveTo(...P(-.28, -.1), ...P(-.22, .04)); ctx.quadraticCurveTo(...P(-.2, .22), ...P(-.02, .21)); ctx.quadraticCurveTo(...P(.18, .22), ...P(.3, .03)); ctx.fill();
    // open jaw: a dark wedge from inside the head to the snout, teeth along both jaw edges
    const A = [.06, .03], U = [.28, -.03], Lo = [.28, .09];
    ctx.fillStyle = '#2d4a14'; ctx.beginPath(); ctx.moveTo(...P(...A)); ctx.lineTo(...P(...U)); ctx.lineTo(...P(...Lo)); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for (const [E, dir] of [[U, 1], [Lo, -1]]) for (const t of [.5, .72, .92]) {
      const f = A[0] + (E[0] - A[0]) * t, s = A[1] + (E[1] - A[1]) * t;
      ctx.beginPath(); ctx.moveTo(...P(f - .02, s)); ctx.lineTo(...P(f + .02, s)); ctx.lineTo(...P(f, s + dir * .04)); ctx.closePath(); ctx.fill();
    }
    // one eye on the side above the jaw, with a frown
    ctx.fillStyle = '#fff6b0'; circ(...P(.1, -.09), .055); ctx.fill();
    ctx.fillStyle = '#111'; circ(...P(.13, -.09), .028); ctx.fill();
    ctx.strokeStyle = '#2d4a14'; ctx.lineWidth = .025;
    ctx.beginPath(); ctx.moveTo(...P(.2, -.14)); ctx.lineTo(...P(.06, -.18)); ctx.stroke();
  }
}

function drawOcto(e) {
  const shake = e.chew > 0 ? Math.sin(time * 70) * .03 : 0;
  ctx.translate(e.fx + .5 + shake, e.fy + .42);
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const x0 = -.2 + i * .08, ex = x0 * 1.7 + Math.sin(e.anim * 4 + i * 1.3) * .06;
    ctx.strokeStyle = '#7b3fc4'; ctx.lineWidth = .07;
    ctx.beginPath(); ctx.moveTo(x0, .06); ctx.quadraticCurveTo(x0 + Math.sin(e.anim * 5 + i) * .1, .24, ex, .4); ctx.stroke();
    ctx.fillStyle = 'rgba(255,210,240,0.6)'; circ((x0 + ex) / 2, .26, .016); ctx.fill();
  }
  const g = ctx.createRadialGradient(-.08, -.18, .03, 0, -.08, .3);
  g.addColorStop(0, '#c08bff'); g.addColorStop(1, '#7d3fd0');
  ctx.fillStyle = g; ell(0, -.1, .27, .26); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  circ(-.1, -.22, .045); ctx.fill(); circ(.06, -.26, .03); ctx.fill(); circ(.13, -.14, .035); ctx.fill();
  for (let s = -1; s <= 1; s += 2) {
    ctx.fillStyle = '#fff'; circ(s * .09, -.05, .065); ctx.fill();
    ctx.fillStyle = '#1a0b2e'; circ(s * .09 + e.dir.x * .025, -.05 + e.dir.y * .025, .032); ctx.fill();
  }
  if (e.chew > 0) {
    ctx.strokeStyle = '#3d1670'; ctx.lineWidth = .03;
    ctx.beginPath(); ctx.moveTo(-.16, -.16); ctx.lineTo(-.03, -.11); ctx.moveTo(.16, -.16); ctx.lineTo(.03, -.11); ctx.stroke();
  }
}

function drawSword(e) {
  const d = e.dir, shake = e.windup > 0 ? Math.sin(time * 80) * .03 : 0;
  ctx.translate(e.fx + .5 + shake, e.fy + .45);
  if (d.x < 0) ctx.scale(-1, 1);
  else if (d.y !== 0) ctx.rotate(d.y > 0 ? Math.PI / 2 : -Math.PI / 2);
  if (e.charge && e.windup <= 0 && e.stun <= 0) {
    ctx.strokeStyle = 'rgba(220,250,255,0.55)'; ctx.lineWidth = .03; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-.5 - i * .08, -.12 + i * .12); ctx.lineTo(-.85 - i * .08, -.12 + i * .12); ctx.stroke(); }
  }
  const sw = Math.sin(e.anim * 10) * .04;
  ctx.fillStyle = '#25528c';
  ctx.beginPath(); ctx.moveTo(-.26, 0); ctx.lineTo(-.46, -.17 + sw); ctx.lineTo(-.38, 0); ctx.lineTo(-.46, .17 + sw); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-.12, -.1); ctx.quadraticCurveTo(-.04, -.38, .1, -.1); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, -.14, 0, .14);
  g.addColorStop(0, '#4f86d4'); g.addColorStop(.55, '#a9cbee'); g.addColorStop(1, '#e8f2fb');
  ctx.fillStyle = g; ell(0, 0, .31, .14); ctx.fill();
  ctx.fillStyle = '#9fb7cc'; ctx.beginPath(); ctx.moveTo(.26, -.035); ctx.lineTo(.6, 0); ctx.lineTo(.26, .035); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; circ(.17, -.035, .045); ctx.fill();
  ctx.fillStyle = e.windup > 0 || (e.charge && e.stun <= 0) ? '#e8332e' : '#111'; circ(.18, -.035, .024); ctx.fill();
  ctx.strokeStyle = '#1d3f6e'; ctx.lineWidth = .025;
  ctx.beginPath(); ctx.moveTo(.11, -.1); ctx.lineTo(.22, -.08); ctx.stroke();
}

function drawMantis(e) {
  const d = e.dir;
  const wind = e.punch > 0 ? 1 : 0, hit = e.punchFx > 0 ? 1 : 0;
  ctx.translate(e.fx + .5, e.fy + .5);
  if (d.x < 0) ctx.scale(-1, 1);
  else if (d.y !== 0) ctx.rotate(d.y > 0 ? Math.PI / 2 : -Math.PI / 2);
  const segs = [['#2fbf71', .14], ['#2aa3c9', .13], ['#3d8fe0', .115], ['#f28b30', .1], ['#e2453c', .085]];
  ctx.fillStyle = '#e2453c';
  ctx.beginPath(); ctx.moveTo(-.34, 0); ctx.lineTo(-.46, -.12); ctx.lineTo(-.46, .12); ctx.closePath(); ctx.fill();
  for (let i = segs.length - 1; i >= 0; i--) {
    const x = .12 - i * .1, y = Math.sin(e.anim * 8 + i) * .01;
    ctx.fillStyle = segs[i][0]; ell(x, y, segs[i][1], segs[i][1] * .85); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.2)'; ell(.05, -.07, .14, .04); ctx.fill();
  const cx = hit ? .44 : wind ? .08 : .2;
  ctx.strokeStyle = '#f28b30'; ctx.lineWidth = .05; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(.16, .06); ctx.lineTo(cx, .1); ctx.stroke();
  ctx.fillStyle = '#ff5a3c'; circ(cx + .03, .1, .065); ctx.fill();
  ctx.strokeStyle = '#2fbf71'; ctx.lineWidth = .03;
  for (let s = -1; s <= 1; s += 2) { ctx.beginPath(); ctx.moveTo(.2, -.06); ctx.lineTo(.26, -.14 + s * .04); ctx.stroke(); }
  for (let s = -1; s <= 1; s += 2) {
    ctx.fillStyle = '#ffdc5c'; ell(.27, -.15 + s * .04, .045, .035); ctx.fill();
    ctx.fillStyle = '#2b1a00'; ctx.fillRect(.25, -.152 + s * .04, .04, .012);
  }
}

function drawManta(e) {
  const d = e.dir, flap = Math.sin(e.anim * 6) * .12;
  ctx.translate(e.fx + .5, e.fy + .32);
  ctx.rotate(Math.atan2(d.y, d.x) + Math.PI / 2);
  ctx.strokeStyle = '#1d3448'; ctx.lineWidth = .03; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, .18); ctx.quadraticCurveTo(Math.sin(e.anim * 4) * .08, .38, 0, .52); ctx.stroke();
  const g = ctx.createLinearGradient(0, -.25, 0, .2);
  g.addColorStop(0, '#3d5d7a'); g.addColorStop(1, '#22394f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, -.24);
  ctx.quadraticCurveTo(.2, -.16, .46, .02 + flap); ctx.quadraticCurveTo(.2, .06, 0, .2);

function drawShark(e, sc) {

    for (let i = 0; i < 4; i++) { const a = time * 5 + i * 1.57; circ(e.fx + .5 + Math.cos(a) * .4, e.fy - .15 + Math.sin(a) * .1, .06); ctx.fill(); }
  }
  let lift = 0, spin = 0;
  if (B && B.kind === 'shark' && B.dead) { const k = 1 - Math.max(0, B.dying) / 2.2; ctx.globalAlpha *= Math.max(0, 1 - k); lift = -k * 1.5; spin = k * Math.PI; }
  if (B && B.hurtT > 0 && Math.floor(time * 20) % 2) ctx.globalAlpha *= .4;

  }

  ctx.fillStyle = '#58717f';
  ctx.beginPath(); ctx.moveTo(-.3, 0); ctx.lineTo(-.52, -.22 + sw); ctx.lineTo(-.43, 0); ctx.lineTo(-.5, .15 + sw); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-.1, -.12); ctx.lineTo(.0, -.36); ctx.lineTo(.12, -.12); ctx.closePath(); ctx.fill();
  const g = ctx.createLinearGradient(0, -.18, 0, .18);
  g.addColorStop(0, '#7f99a8'); g.addColorStop(.55, '#a9bcc6'); g.addColorStop(1, '#eef3f6');
  ctx.fillStyle = g; ell(0, 0, .37, .17); ctx.fill();
  ctx.fillStyle = '#58717f'; ctx.beginPath(); ctx.moveTo(-.02, .07); ctx.lineTo(-.12, .24); ctx.lineTo(.09, .09); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(60,80,90,0.5)'; ctx.lineWidth = .015;
