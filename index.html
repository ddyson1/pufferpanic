<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Killi and Milli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800;900&display=swap" rel="stylesheet">
<meta name="description" content="A co-op arcade maze game about two pufferfish gathering snacks for the reef's Moonlight Feast. Grow coral, puff up, bring a friend.">
<meta name="theme-color" content="#2f7f92">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Killi and Milli">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<!-- Ad portals: load the portal's SDK here when submitting (see the Ads adapter below). Nothing is loaded otherwise. -->
<style>
:root{
  --bg:#dcefee; --fg:#05303d; --muted:#45707a; --chip:#c5e2e0; --line:#a9d0cd;
  --accent:#0d7a8a; --gold:#f6c445; --milli:#7cc4f0; --coral:#ff6f73;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#03141c;--fg:#d5eef0;--muted:#82a7b0;--chip:#0c2a35;--line:#163c49;--accent:#3bc2cf;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#03141c;--fg:#d5eef0;--muted:#82a7b0;--chip:#0c2a35;--line:#163c49;--accent:#3bc2cf;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:12px 12px 24px}
@media (min-width:1000px){
  .wrap:has(.style:not([hidden])){display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:16px;align-items:start;max-width:1200px}
  .wrap:has(.style:not([hidden])) #optTrack{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wrap:has(.style:not([hidden]))>*{grid-column:1}
  .wrap .style:not([hidden]){grid-column:2;grid-row:1/span 5;margin:0;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;max-width:none !important}
}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 auto 8px;font-size:.88rem;font-variant-numeric:tabular-nums}
.hud .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.lvl{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:1.05rem;margin-right:4px}
.pips{display:inline-flex;gap:4px}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.pips i.done{background:var(--muted)}
.pips i.boss{background:#e8463a}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.k{background:var(--gold)}.dot.m{background:var(--milli)}
.meter{display:inline-block;width:40px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--gold)}
.pchip.m .meter i{background:var(--milli)}
.pchip.out{opacity:.45}
.chip[hidden]{display:none}
.chip.sb{gap:6px;background:var(--fg);color:var(--bg)}
.chip.sb small{font-size:.72rem;opacity:.75;text-transform:none}
.chip.sb b{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:1rem;min-width:3.2ch;text-align:right}
.chip.sb.flash b{color:var(--gold)}
.pchip .pts{font-weight:700;min-width:2.5ch;text-align:right}
.stage{position:relative;margin:0 auto;border-radius:18px;overflow:hidden;background:#0b4a5c;box-shadow:0 18px 40px rgba(2,40,52,.3),inset 0 0 0 1px rgba(255,255,255,.05)}
canvas{display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse at center,rgba(2,30,42,.55),rgba(2,20,30,.82));color:#e6f6f5;text-align:center}
.overlay[hidden],.banner[hidden]{display:none}
.card{width:100%;max-width:520px;max-height:100%;overflow:auto;padding:4px}
.card h2{margin:0;font-family:"Grandstander",system-ui,sans-serif;font-weight:900;font-size:clamp(1.9rem,6vw,3rem);line-height:.95;color:var(--gold);letter-spacing:-.01em;text-shadow:0 3px 0 #a5640f,0 6px 18px rgba(0,0,0,.35)}
.card h3{margin:0 0 4px;font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);color:var(--gold)}
.card p{margin:8px auto;color:#bfe0e2;line-height:1.45;max-width:40ch;font-size:.95rem}
.tag{margin-top:8px;color:#9fd0d4;font-size:.95rem}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;margin:14px 0 4px}
.seg button{border:0;background:transparent;color:#cfe9ea;padding:8px 14px;border-radius:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:#e6f6f5;color:#05303d}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0 2px}
button{font:inherit;cursor:pointer}
.lv{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);color:#e6f6f5;border:0;border-radius:11px;padding:7px 9px;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.lv:hover:not(:disabled){background:rgba(255,255,255,.14)}
.lv b{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;color:var(--gold);min-width:1.4em;font-size:1.05rem}
.lv span{display:block;font-weight:600;font-size:.88rem;line-height:1.15}
.lv small{display:block;color:#93c0c4;font-size:.74rem}
.lv:disabled{opacity:.38;cursor:not-allowed}
.st{font-style:normal;color:var(--gold);letter-spacing:1px}.st em{font-style:normal;color:rgba(255,255,255,.25)}
.stars{font-size:1.9rem;color:var(--gold);letter-spacing:4px;margin:2px 0 4px;text-shadow:0 2px 0 #a5640f}.stars span{color:rgba(255,255,255,.2);text-shadow:none}
.btn{background:var(--gold);color:#3a2700;border:0;border-radius:12px;padding:10px 16px;font-weight:800}
.btn.ghost{background:transparent;color:#e6f6f5;box-shadow:inset 0 0 0 1.5px rgba(230,246,245,.45)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(2,26,36,.82);color:#e6f6f5;padding:8px 16px;border-radius:14px;text-align:center;pointer-events:none;font-size:.9rem;width:max-content;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.banner b{display:block;font-family:"Grandstander",system-ui,sans-serif;font-size:1.15rem;color:var(--gold)}
.board{display:flex;gap:10px;justify-content:center;margin:10px 0 4px}
.board div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 16px;min-width:130px;display:flex;flex-direction:column;align-items:center}
.board small{color:#9fd0d4;font-size:.8rem}
.board b{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums}
.board em{font-style:normal;font-size:.8rem;color:var(--gold)}
.scores{display:flex;gap:10px;justify-content:center;margin-top:6px;font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:12px auto 0;color:var(--muted);font-size:.86rem;line-height:1.7}
kbd{font-family:inherit;background:var(--chip);color:var(--fg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools button{background:var(--chip);color:var(--fg);border:0;border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.touch{display:none;justify-content:space-between;align-items:center;margin:12px auto 0;gap:12px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){.touch{display:flex}.keys{display:none}}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pad button,.acts button{touch-action:none;border:0;background:var(--chip);color:var(--fg);font-weight:800;display:flex;align-items:center;justify-content:center}
.pad button{border-radius:14px}
.pad svg{width:20px;height:20px;fill:currentColor}
.acts{display:flex;gap:12px}
.acts button{width:78px;height:78px;border-radius:50%;font-size:.95rem}
.acts #tPuff{background:var(--gold);color:#3a2700}
.acts #tAct{background:var(--coral);color:#3d0608}
.pressed{filter:brightness(.82)}
.note{font-size:.78rem;color:#93c0c4;margin-top:4px}
.fishrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 2px;flex-wrap:wrap}
.fishmini{display:flex;flex-direction:column;align-items:center;font-size:.78rem;color:#cfe9ea}
.fishmini canvas{width:52px;height:52px}
.fishrow .btn{padding:8px 14px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pick{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:14px;padding:8px;background:rgba(255,255,255,.07);color:#e6f6f5;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.pick[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(255,255,255,.12)}
.pick canvas{width:64px;height:64px}
.pick span{font-family:"Grandstander",system-ui,sans-serif;font-weight:800;font-size:1.1rem}
.pick small{color:#93c0c4;font-size:.75rem}
.fishedit{display:flex;gap:14px;align-items:flex-start;text-align:left}
.bigprev{width:132px;height:132px;flex:none;background:rgba(255,255,255,.06);border-radius:16px}
.fcontrols{flex:1;min-width:0}
.flabel{font-size:.8rem;color:#9fd0d4;margin:4px 0 4px}
.fopts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.swatch{width:34px;height:34px;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold)}
.fopt{border:0;border-radius:999px;padding:6px 11px;min-height:34px;background:rgba(255,255,255,.08);color:#e6f6f5;font-size:.85rem}
.fopt[aria-pressed="true"]{background:#e6f6f5;color:#05303d;font-weight:700}
.fopt.locked{display:inline-flex;align-items:center;gap:5px;opacity:.6;cursor:not-allowed;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.fopt.locked small{color:#93c0c4;font-size:.72rem}
.swatch.locked{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#93c0c4;cursor:not-allowed}
.lock{width:13px;height:13px;fill:currentColor;flex:none}
.locknote{font-size:.75rem;color:#93c0c4;margin:-2px 0 6px}
.unlocked{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:rgba(246,196,69,.14);box-shadow:inset 0 0 0 1.5px rgba(246,196,69,.5);max-width:360px;color:#fff3c4}
.unlocked b{font-family:"Grandstander",system-ui,sans-serif;color:var(--gold)}
.unlocked .btn{padding:6px 12px}
@media (max-width:520px){.fishedit{flex-direction:column;align-items:center}.bigprev{width:110px;height:110px}.fcontrols{width:100%}}
.style{margin:14px auto 0;background:var(--chip);border-radius:16px;padding:14px 14px 4px;scrollbar-width:thin}
.style .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.style .head h3{margin:0;font-family:"Grandstander",system-ui,sans-serif;font-size:1.3rem}
.style .head .btn{padding:7px 16px}
.style details{margin-top:8px}.style summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px}
.style summary::before{content:'';width:0;height:0;border:5px solid transparent;border-left:7px solid var(--muted);transition:transform .15s}
.style details[open] summary::before{transform:rotate(90deg)}
.style[hidden]{display:none}
.story{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(to top,rgba(2,18,28,.97),rgba(2,18,28,.97) 30%,rgba(2,18,28,.8) 65%,rgba(2,18,28,0));color:#eaf7f6}
.story[hidden]{display:none}
.story p{margin:0 0 10px;font-size:clamp(.9rem,2.3vw,1.08rem);line-height:1.5;min-height:4.5em;max-width:62ch}
.storybar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sdots{display:flex;gap:5px}.sdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.sdots i.on{background:var(--gold)}
.sbtns{display:flex;gap:8px}.sbtns .btn{padding:8px 14px}
.style h4{margin:0 0 8px;font-family:"Grandstander",system-ui,sans-serif;font-size:1.1rem}
.style .lead{margin:-2px 0 12px;color:var(--muted);font-size:.88rem}
.srow{margin-bottom:18px}
.srow h4 span{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#optTrack{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){#optTrack{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;border:0;border-radius:12px;padding:10px 11px;background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.opt b{font-weight:700;font-size:.95rem}
.opt small{color:var(--muted);font-size:.8rem;line-height:1.3}
.sw{display:flex;gap:3px}.sw i{width:20px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.previews button{border:0;border-radius:999px;padding:6px 11px;background:var(--bg);color:var(--fg);font-size:.85rem;box-shadow:inset 0 0 0 1px var(--line)}
.previews button.all{background:var(--accent);color:var(--bg);font-weight:700}
</style>
</head>
<body>
<main class="wrap">
  <div class="hud" id="hud">
    <div class="grp">
      <span class="lvl" id="hLevel">Killi and Milli</span>
      <span class="chip"><span id="hWave">Wave</span><span class="pips" id="hPips"></span></span>
      <span class="chip" id="hLeft">Choose a reef</span>
    </div>
    <div class="grp"><span class="chip sb" id="hTimeChip"><small>Time</small><b id="hTime">0:00.0</b></span><span class="chip sb" id="hScoreChip"><small>Score</small><b id="hScore">0</b></span><span class="grp" id="hPlayers"></span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="Game board"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
    <div class="story" id="story" hidden>
      <p id="storyText"></p>
      <div class="storybar"><span class="sdots" id="storyDots"></span><span class="sbtns"><button class="btn ghost" id="storySkip">Skip</button><button class="btn" id="storyNext">Next</button></span></div>
    </div>
  </div>

  <div class="touch" id="touch">
    <div class="pad">
      <span></span><button data-dir="up" aria-label="Swim up"><svg viewBox="0 0 10 10"><polygon points="5,1 9,8 1,8"/></svg></button><span></span>
      <button data-dir="left" aria-label="Swim left"><svg viewBox="0 0 10 10"><polygon points="1,5 8,1 8,9"/></svg></button><span></span><button data-dir="right" aria-label="Swim right"><svg viewBox="0 0 10 10"><polygon points="9,5 2,1 2,9"/></svg></button>
      <span></span><button data-dir="down" aria-label="Swim down"><svg viewBox="0 0 10 10"><polygon points="5,9 9,2 1,2"/></svg></button><span></span>
    </div>
    <div class="acts"><button id="tPuff">Puff</button><button id="tAct">Coral</button></div>
  </div>

  <div class="foot">
    <span class="keys" id="keys"></span>
    <span class="tools"><button id="bSound">Sound on</button><button id="bMusic">Music on</button><button id="bPause">Pause</button><button id="bStyle">Look and sound</button><button id="bMenu">Levels</button></span>
  </div>

  <section class="style" id="stylePanel" hidden aria-label="Look and sound">
    <div class="head"><h3>Look and sound</h3><button class="btn" id="styleDone">Done</button></div>
    <p class="lead">The reef is a live demo. Swim around with the arrow keys; every choice applies right away and is saved.</p>
    <div class="srow"><h4>Look</h4><div class="opts" id="optTheme"></div></div>
    <div class="srow"><h4>Sound effects</h4><div class="opts" id="optPack"></div><details><summary>Preview every effect</summary><div class="previews" id="previews"></div></details></div>
    <div class="srow"><h4>Music</h4><div class="opts" id="optTrack"></div></div>
  </section>
</main>

<script>
(() => {
'use strict';

// ================= config =================
const TITLE = 'Killi and Milli';
const COLS = 15, ROWS = 13;
const PIXEL_BUDGET = 2.2e6;
const PSPEED = 5.2, PUFF_T = 1.3, PUFF_CD = 4.5, STUN_T = 2.6, INV_T = 1.8;
const UP = {x:0,y:-1}, DOWN = {x:0,y:1}, LEFT = {x:-1,y:0}, RIGHT = {x:1,y:0};
const DIRS = {up:UP, down:DOWN, left:LEFT, right:RIGHT};
const DLIST = [UP, RIGHT, DOWN, LEFT];
const CUR = {U:UP, D:DOWN, L:LEFT, R:RIGHT};
const ESPEED = {C:2.7, J:1.5, E:3.0, O:2.3, S:2.0, M:2.4, A:4.2, Y:2.6, F:1.2, K:2.4};
const FLY = {J:1, A:1};
const SNACK_PTS = {krill:10, grape:15, pearl:20, star:25, clam:30, shrimp:40, moon:50};
const STREAK_PTS = 5, STREAK_MAX = 10, STREAK_WINDOW = 1.2, BOSS_HIT_PTS = 200, BOSS_WIN_PTS = 1000;
const SNACK_NAMES = {krill:'krill', pearl:'pearls', grape:'sea grapes', star:'starfish', shrimp:'shrimp', moon:'moon pearls', clam:'clams'};
const PALETTES = {
  sunny:     {name:'Sunny',     c1:'#ffe58a', c2:'#f2b632', belly:'#fff4cc', spot:'#a8740f', fin:'#e9a92a', spike:'#c48f16', tag:'#f6c445'},
  sky:       {name:'Sky',       c1:'#f2fbff', c2:'#9fd3f2', belly:'#ffffff', spot:'#2f6fb4', fin:'#7cbbe6', spike:'#4c88bf', tag:'#7cc4f0'},
  coral:     {name:'Coral',     c1:'#ffe0e5', c2:'#ff8fa3', belly:'#fff4f6', spot:'#c2415f', fin:'#ff7a90', spike:'#d0566e', tag:'#ff9fb2'},
  mint:      {name:'Mint',      c1:'#e6fff3', c2:'#7fdcb0', belly:'#f6fffa', spot:'#2f8f63', fin:'#5cc796', spike:'#3f9f73', tag:'#8fe6bf'},
  lavender:  {name:'Lavender',  c1:'#f3ebff', c2:'#bba3f0', belly:'#fbf8ff', spot:'#6b4fb8', fin:'#a58be6', spike:'#7d62c8', tag:'#c7b4f5'},
  tangerine: {name:'Tangerine', c1:'#ffe3c7', c2:'#ff9f4a', belly:'#fff6ec', spot:'#b8561a', fin:'#f28a36', spike:'#c96a24', tag:'#ffb066'},
  midnight:  {name:'Midnight',  c1:'#a9b9e2', c2:'#3e4f86', belly:'#dfe5f7', spot:'#e8ecff', fin:'#33447a', spike:'#2a3866', tag:'#a9b8e8'},
  gold:      {name:'Gold',      c1:'#fff6c4', c2:'#e3b21c', belly:'#fffbe8', spot:'#a87508', fin:'#f2c43a', spike:'#9c6f06', tag:'#ffd54a'},
};
const PATTERNS = {spots:'Spots', plain:'Plain', stripes:'Stripes', freckles:'Freckles', hearts:'Hearts'};
const ACCESSORIES = {none:'None', bow:'Bow', flower:'Flower', glasses:'Glasses', cap:'Sailor cap', star:'Starfish clip', fin:'Shark fin hat', crown:'Royal crown', pearls:'Pearl necklace'};
// How each locked piece is earned. lv is a level index (0-based); anything not listed is available from the start.
const UNLOCKS = {
  color:   {lavender:{lv:2}, tangerine:{lv:7}, midnight:{lv:15}, gold:{special:'allstars', text:'Earn 3 stars on every level'}},
  pattern: {stripes:{lv:4}, freckles:{lv:11}, hearts:{lv:17, text:'Beat the Kraken Queen'}},
  acc:     {glasses:{lv:5}, cap:{lv:9}, star:{lv:13}, fin:{lv:16, text:'Defeat Bruiser'}, crown:{lv:17, text:'Beat the Kraken Queen'}, pearls:{special:'snacks', n:500, text:'Eat 500 snacks in total'}},
};
const ITEM_NAMES = {color:PALETTES, pattern:PATTERNS, acc:ACCESSORIES};

let adMute = false;
const Ads = (() => {
  const poki = () => window.PokiSDK, cg = () => (window.CrazyGames && window.CrazyGames.SDK) || null;
  let ready = false, playing = false;
  const quiet = on => { adMute = on; if (typeof master !== 'undefined' && master && ac) master.gain.setTargetAtTime(on || muted ? 0 : .9, ac.currentTime, .05); };
  return {
    init() {
      try {
        if (poki()) poki().init().then(() => { ready = true; poki().gameLoadingFinished(); }).catch(() => {});
        else if (cg()) Promise.resolve(cg().init()).then(() => { ready = true; }).catch(() => {});
      } catch (e) {}
    },
    get ready() { return ready; },
    play() { if (playing) return; playing = true; try { if (poki()) poki().gameplayStart(); else if (cg()) cg().game.gameplayStart(); } catch (e) {} },
    stop() { if (!playing) return; playing = false; try { if (poki()) poki().gameplayStop(); else if (cg()) cg().game.gameplayStop(); } catch (e) {} },
    // an interstitial at a natural pause; the SDKs decide how often one actually shows
    break(done) {
      try {
        if (poki() && ready) { this.stop(); poki().commercialBreak(() => quiet(true)).then(() => { quiet(false); done(); }).catch(() => { quiet(false); done(); }); return; }
        if (cg() && ready) { this.stop(); cg().ad.requestAd('midgame', {adStarted: () => quiet(true), adFinished: () => { quiet(false); done(); }, adError: () => { quiet(false); done(); }}); return; }
      } catch (e) {}
      done();
    },
    canReward() { return ready && !!(poki() || cg()); },
    reward(done, fail) {
      try {
        if (poki() && ready) { this.stop(); poki().rewardedBreak(() => quiet(true)).then(ok => { quiet(false); ok ? done() : fail(); }).catch(() => { quiet(false); fail(); }); return; }
        if (cg() && ready) { this.stop(); cg().ad.requestAd('rewarded', {adStarted: () => quiet(true), adFinished: () => { quiet(false); done(); }, adError: () => { quiet(false); fail(); }}); return; }
      } catch (e) {}
      fail();
    },
  };
})();

function advance(a, speed, dt) {

function loadLevel(i, retry) {
  persist();
  hideStyle();
  levelIdx = i;
  if (autoTrack) track = trackForLevel(i);
  const L = LEVELS[i];
  const grid = [], floor = [], born = [], wavePos = [[], [], [], []], enemies = [], urchins = new Map(), friends = [], bossTiles = new Set();
  const starts = [null, null];
  for (let y = 0; y < ROWS; y++) {
    grid.push([]); floor.push([]); born.push([]);
    for (let x = 0; x < COLS; x++) {
      const ch = (L.map[y] || '')[x] || '#';
      let g = '.', f = '';
      if (ch === '#') g = '#';
      else if (ch === 'c') { g = 'c'; born[y][x] = -9; }
      else if (ch >= '1' && ch <= '4') wavePos[ch.charCodeAt(0) - 49].push({x, y});
      else if (ch === 'P') starts[0] = {x, y};
      else if (ch === 'Q') starts[1] = {x, y};
      else if (ch === 'h' || ch === 'k' || 'UDLR'.includes(ch)) f = ch;
      else if (ch === 'N') friends.push(makeFriend(x, y));
      else if (ch === 'B') { if (L.boss === 'queen') { g = '#'; bossTiles.add(y * COLS + x); } else enemies.push(makeEnemy('K', x, y)); }
      else if (ch === 'x') { f = 'x'; urchins.set(y * COLS + x, {x, y, armed:true, cov:false, rearm:0}); }
      else if (ESPEED[ch]) enemies.push(makeEnemy(ch, x, y));
      grid[y].push(g); floor[y].push(f);
    }
  }
  const players = [];
  const count = twoP ? 2 : 1;
  for (let k = 0; k < count; k++) {
    const st = starts[k] || starts[0];
    const p = makeActor(st.x, st.y);
    const who = twoP ? (k ? 'milli' : 'killi') : (save.pick === 'milli' ? 'milli' : 'killi');
    Object.assign(p, {id:who === 'milli' ? 1 : 0, fish:getFish(who), sx:st.x, sy:st.y, face:DOWN, puff:0, puffCd:0, dead:false, deathT:0, inv:0, score:0, points:0, streak:0, lastGet:-9, held:[], bufAct:false, bufPuff:false});
    players.push(p);
  }

}

function makeFriend(x, y) {

  return n;
}
function makeEnemy(k, x, y) {
  const e = makeActor(x, y);
  Object.assign(e, {kind:k, speed:ESPEED[k], stun:0, chew:0, chewT:null, punch:0, punchFx:0, windup:0, daze:0, charge:false, dir:pick(DLIST), trail:[],
    state:'buried', t:1 + Math.random(), ph:'calm', ft:1.5 + Math.random() * 2});

}

function nextWave(silent) {
  S.wave++;
  if (S.wave >= S.waves.length) { levelWon(); return; }
  const type = S.waves[S.wave];
  S.wavePos[S.wave].forEach((p, i) => {
    const s = makeActor(p.x, p.y);
    Object.assign(s, {type, born: time + i * 0.05 + (silent ? 0 : 0.25), wait:rand(0, .5), t:rand(2.5, 5), open:Math.random() < .5, ct:rand(.3, 2), lid:0});
    S.snacks.push(s);
  });
  if (!silent) {
    sfx('wave');
    for (const p of S.players) if (p.dead) revive(p);
  }
}

function revive(p) {
  if (isBlock(p.sx, p.sy)) breakBlock(p.sx, p.sy, 0);
  Object.assign(p, {x:p.sx, y:p.sy, fx:p.sx, fy:p.sy, tx:p.sx, ty:p.sy, moving:false, dead:false, deathT:0, inv:INV_T, puff:0, shield:false});
  sfx('revive', {x:p.sx});

}

function levelWon() {

  const stars = S.catches === 0 ? 3 : S.catches <= 2 ? 2 : 1;
  const total = S.players.reduce((a, p) => a + p.points, 0), prevScore = save.scores[key] || 0, bestScore = total > prevScore;
  if (bestScore) save.scores[key] = total;
  save.stars[key] = Math.max(save.stars[key] || 0, stars);

  const fresh = unlockedSet().filter(id => !before.has(id));

  }
}

// ================= simulation =================
function update(dt) {
  updateParts(dt);
  if (mode === 'story' && story) { story.chars += dt * 48; return; }
  if (mode === 'style' && S) {
    for (const p of S.players) updatePlayer(p, dt);
    updateUrchins(dt); updateSnacks(dt);
    for (const e of S.enemies) updateEnemy(e, dt);
    for (const n of S.friends) updateFriend(n, dt);
    friendCheck();
    return;
  }
  if (mode !== 'play' || !S) return;
  if (S.readyT > 0) { S.readyT -= dt; if (S.readyT <= 0) { hideBanner(); Ads.play(); } return; }
  if (S.failT > 0) {
    S.failT -= dt;
    for (const p of S.players) if (p.deathT > 0) p.deathT -= dt;
    if (S.failT <= 0) {
      if (Ads.canReward() && !S.offeredContinue) offerContinue();
      else loadLevel(levelIdx, true);
    }
    return;
  }
  S.elapsed += dt;
  for (const q of S.popups) q.t += dt;
  S.popups = S.popups.filter(q => q.t < 1);
  for (const p of S.players) updatePlayer(p, dt);
  updateUrchins(dt);
  updateSnacks(dt);
  const calm = S.boss && S.boss.dead;
  for (const e of S.enemies) if (!calm || e.kind === 'K') updateEnemy(e, dt);
  for (const n of S.friends) updateFriend(n, dt);
  updateBoss(dt);
  if (mode !== 'play' || (S.boss && S.boss.dead)) return;
  collide();
  tentCollide();
  friendCheck();
  hazardCheck();
  collectCheck();
  if (mode === 'play' && S.failT <= 0 && S.players.every(p => p.dead)) S.failT = 1.6;
}

function updatePlayer(p, dt) {
  p.anim += dt;
  if (p.dead) { if (p.deathT > 0) p.deathT -= dt; return; }
  if (p.inv > 0) p.inv -= dt;
  if (p.puffCd > 0) p.puffCd = Math.max(0, p.puffCd - dt);
  if (p.puff > 0) { p.puff = Math.max(0, p.puff - dt); return; }
  const h = p.held.length ? DIRS[p.held[p.held.length - 1]] : null;
  if (h) p.face = h;
  // puff right away, even between cells; coral waits for the next cell so it grows from where the fish stands
  if (p.bufPuff) { p.bufPuff = false; if (p.puffCd <= 0) { startPuff(p); return; } sfx('bonk', {x:p.fx, p:p.id}); }
  // turning back mid-tile reverses at once instead of finishing the tile first
  if (p.moving && h && h.x === -(p.tx - p.x) && h.y === -(p.ty - p.y)) { p.tx = p.x; p.ty = p.y; }
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!p.moving) {
      if (p.bufAct) { p.bufAct = false; coralAction(p); }
      if (h) { const nx = p.x + h.x, ny = p.y + h.y; if (inb(nx, ny) && S.grid[ny][nx] === '.') { p.tx = nx; p.ty = ny; p.moving = true; } }
      if (!p.moving) break;
    }
    const left = advance(p, PSPEED, rem);
    if (left < 0) break;
    rem = left;
  }
}

function startPuff(p) {
  p.puff = PUFF_T; p.puffCd = PUFF_CD + PUFF_T;
  sfx('puff', {x:p.fx, p:p.id});
  for (const e of S.enemies) if (Math.hypot(e.fx - p.fx, e.fy - p.fy) < 1.7) stunEnemy(e);
  ring(p.fx + .5, p.fy + .5, 'rgba(255,250,220,0.9)');
}
function stunEnemy(e, t) { if (e.kind === 'K') return; e.stun = t || STUN_T; e.chew = 0; e.chewT = null; e.punch = 0; e.windup = 0; e.charge = false; if (e.kind === 'F') { e.ph = 'calm'; e.ft = 3.2; } }
const harmless = e => (e.kind === 'Y' && e.state !== 'hunt') || (e.kind === 'K' && (e.crash > 0 || S.boss.dead));

function coralAction(p) {
  let dir = p.face, x = p.x + dir.x, y = p.y + dir.y, i = 0, g = 0;
  if (isBlock(x, y)) {
    while (isBlock(x, y) && g++ < 80) { breakBlock(x, y, i * 0.03); i++; const f = S.floor[y][x]; if (CUR[f]) dir = CUR[f]; x += dir.x; y += dir.y; }
    sfx('break', {x:p.fx, p:p.id, n:i});
  } else if (canPlace(x, y)) {
    while (canPlace(x, y) && g++ < 80) { S.grid[y][x] = 'c'; S.born[y][x] = time + i * 0.03; i++; const f = S.floor[y][x]; if (CUR[f]) dir = CUR[f]; x += dir.x; y += dir.y; }
    sfx('grow', {x:p.fx, p:p.id, n:i});
    if (inb(x, y) && S.floor[y][x] === 'h' && S.grid[y][x] === '.') steam(x, y, i * 0.03);
  } else {
    if (inb(x, y) && S.floor[y][x] === 'h') steam(x, y, 0);
    sfx('bonk', {x:p.fx, p:p.id});
  }
}

function breakBlock(x, y, delay) {
  S.grid[y][x] = '.';
  for (let k = 0; k < 7; k++) parts.push({x:x + .5, y:y + .4, vx:rand(-1.8, 1.8), vy:rand(-2.2, .4), life:.6, max:.6, size:rand(.05, .11), kind:'chip', delay, ph:0});
}

function updateUrchins(dt) {
  for (const u of S.urchins.values()) {
    if (S.grid[u.y][u.x] === 'c') { u.cov = true; u.armed = false; continue; }
    if (u.cov) { u.cov = false; u.rearm = 3; }
    if (u.rearm > 0) { u.rearm -= dt; if (u.rearm <= 0) { u.armed = true; u.rearm = 0; } }
  }
}

function snackFree(s, x, y) {
  return inb(x, y) && S.grid[y][x] === '.' && S.floor[y][x] !== 'x' && !occupied(x, y, null) && !snackAt(x, y, s);
}
function randomOpenTile() {
  const ap = alive();
  for (let k = 0; k < 80; k++) {
    const x = 1 + ((Math.random() * (COLS - 2)) | 0), y = 1 + ((Math.random() * (ROWS - 2)) | 0);
    if (!snackFree(null, x, y)) continue;
    if (ap.some(p => Math.abs(p.fx - x) + Math.abs(p.fy - y) < 2)) continue;
    return {x, y};
  }
  return null;
}

function updateSnacks(dt) {
  const ap = alive();
  const distTo = (x, y) => ap.length ? Math.min(...ap.map(p => Math.abs(p.fx - x) + Math.abs(p.fy - y))) : 99;
  for (const s of S.snacks) {
    s.anim += dt;
    if (time < s.born) continue;
    const enc = S.grid[Math.round(s.fy)][Math.round(s.fx)] === 'c';
    if (s.type === 'shrimp') {
      if (s.moving) { advance(s, 2.7, dt); continue; }
      if (enc) continue;
      if (s.wait > 0) { s.wait -= dt; continue; }
      const opts = DLIST.filter(d => snackFree(s, s.x + d.x, s.y + d.y));
      if (!opts.length) { s.wait = .3; continue; }
      const here = distTo(s.x, s.y);
      let d = null;
      if (here > 5) { if (Math.random() < .5) { s.wait = rand(.3, .9); continue; } d = pick(opts); }
      else {
        let best = -1;
        for (const o of opts) { const v = distTo(s.x + o.x, s.y + o.y) + Math.random() * .01; if (v > best) { best = v; d = o; } }
        if (best <= here) { s.wait = .2; continue; }
      }
      s.dir = d; s.tx = s.x + d.x; s.ty = s.y + d.y; s.moving = true; s.wait = rand(.03, .15);
    } else if (s.type === 'clam') {
      s.ct -= dt;
      if (s.ct <= 0) { s.open = !s.open; s.ct = s.open ? 2.2 : 1.6; }
      s.lid += ((s.open ? 1 : 0) - s.lid) * Math.min(1, dt * 10);
    } else if (s.type === 'moon') {
      s.t -= dt;
      if (s.t <= 0) {
        s.t = rand(3.5, 5.5);
        if (enc) continue;
        const spot = randomOpenTile();
        if (spot) {
          sparkle(s.fx + .5, s.fy + .5, '#cfe3ff');
          s.x = s.tx = s.fx = spot.x; s.y = s.ty = s.fy = spot.y; s.born = time;
          sfx('blink', {x:spot.x});
        }
      }
    }
  }
}

function updateEnemy(e, dt) {
  e.anim += dt;
  if (e.kind === 'K') {
    if (S.boss.dead) return;
    if (e.crash > 0) { e.crash -= dt; return; }
    if (e.ccd > 0) e.ccd -= dt;
  }
  if (e.punchFx > 0) e.punchFx -= dt;
  if (e.stun > 0) { e.stun -= dt; return; }
  if (e.windup > 0) { e.windup -= dt; return; }
  if (e.daze > 0) { e.daze -= dt; return; }
  if (e.chew > 0) {
    e.chew -= dt;
    if (e.chew <= 0 && e.chewT) { if (isBlock(e.chewT.x, e.chewT.y)) { breakBlock(e.chewT.x, e.chewT.y, 0); sfx('break', {x:e.fx}); } e.chewT = null; }
    return;
  }
  if (e.punch > 0) { e.punch -= dt; if (e.punch <= 0) punchLine(e); return; }
  if (e.kind === 'Y') {
    if (e.state === 'buried') {
      e.t -= dt;
      if (e.t <= 0 && visibleTo(e).some(p => Math.hypot(p.fx - e.fx, p.fy - e.fy) < 2.3)) {
        e.state = 'rising'; e.t = .55; sfx('rise', {x:e.fx});
        for (let i = 0; i < 10; i++) parts.push({x:e.fx + .5 + rand(-.3, .3), y:e.fy + .7, vx:rand(-1.2, 1.2), vy:-rand(.5, 1.6), life:.6, max:.6, size:rand(.04, .08), kind:'sand', delay:0, ph:0});
      }
      return;
    }
    if (e.state === 'rising') { e.t -= dt; if (e.t <= 0) { e.state = 'hunt'; e.t = 5; } return; }
    if (e.state === 'burrow') { e.t -= dt; if (e.t <= 0) { e.state = 'buried'; e.t = 3; } return; }
    e.t -= dt;
    if (e.t <= 0 && !e.moving) { e.state = 'burrow'; e.t = .6; return; }
  }
  if (e.kind === 'F') {
    e.ft -= dt;
    if (e.ft <= 0) {
      if (e.ph === 'calm') { e.ph = 'warn'; e.ft = .6; }
      else if (e.ph === 'warn') { e.ph = 'flare'; e.ft = 1.2; sfx('flare', {x:e.fx}); }
      else { e.ph = 'calm'; e.ft = 3.2; }
    }
    if (e.ph !== 'calm' && !e.moving) return;
  }
  const speed = e.kind === 'S' && e.charge ? 8.5 : e.kind === 'K' ? (e.charge ? 9.5 : e.speed * (1 + (S.boss.max - S.boss.hp) * .12)) : e.speed;
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!e.moving) { decide(e); if (!e.moving) break; }
    const left = advance(e, speed, rem);
    if (left < 0) break;
    rem = left;
  }
  if (e.kind === 'E') {
    const last = e.trail[0];
    if (Math.hypot(e.fx - last.x, e.fy - last.y) > 0.14) { e.trail.unshift({x:e.fx, y:e.fy}); if (e.trail.length > 9) e.trail.pop(); }
  }
}

function punchLine(e) {
  let x = e.x + e.dir.x, y = e.y + e.dir.y, i = 0;
  while (isBlock(x, y) && i < 20) { breakBlock(x, y, i * 0.025); x += e.dir.x; y += e.dir.y; i++; }
  e.punchFx = .3;
  sfx('punch', {x:e.fx, n:i}); addShake(.2);
  ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(255,240,200,0.9)');
}

function sharkSight(e) {
  const ap = visibleTo(e);
  for (const d of DLIST) {
    let x = e.x, y = e.y;
    for (let k = 0; k < 13; k++) {
      x += d.x; y += d.y;
      if (!inb(x, y) || S.grid[y][x] === '#') break;
      if (ap.some(p => Math.round(p.fx) === x && Math.round(p.fy) === y)) return d;
    }
  }
  return null;
}

function lineOfSight(e, max) {
  const ap = visibleTo(e);
  for (const d of DLIST) {
    let x = e.x, y = e.y;
    for (let k = 0; k < max; k++) {
      x += d.x; y += d.y;
      if (!inb(x, y) || S.grid[y][x] !== '.') break;
      if (ap.some(p => Math.round(p.fx) === x && Math.round(p.fy) === y)) return d;
    }
  }
  return null;
}

function decide(e) {
  const free = d => {
    const x = e.x + d.x, y = e.y + d.y;
    if (!inb(x, y)) return false;
    const t = S.grid[y][x];
    if (t === '#') return false;
    if (!FLY[e.kind] && (t === 'c' || snackAt(x, y, null))) return false;
    return !occupied(x, y, e);
  };
  let d = null;
  if (e.kind === 'K') {
    if (e.charge) {
      const nx = e.x + e.dir.x, ny = e.y + e.dir.y;
      if (!inb(nx, ny) || S.grid[ny][nx] === '#') {
        e.charge = false; e.daze = .5; e.ccd = 1.4; sfx('thud', {x:e.fx}); addShake(.2);
        ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(220,240,255,0.8)'); return;
      }
      if (S.grid[ny][nx] === 'c') {
        breakBlock(nx, ny, 0); e.charge = false; e.crash = 2.6; e.ccd = 1.6;
        sfx('crash', {x:e.fx}); addShake(.4); ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(255,240,200,0.95)'); return;
      }
      d = e.dir;
    } else if (e.ccd <= 0) {
      const los = sharkSight(e);
      if (los) { e.dir = los; e.charge = true; e.windup = Math.max(.35, .75 - (S.boss.max - S.boss.hp) * .1); e.ccd = 99; sfx('roar', {x:e.fx}); return; }
    }
  }
  if (e.kind === 'A') {
    if (free(e.dir)) d = e.dir;
    else {
      const side = DLIST.filter(o => o.x !== e.dir.x && o.y !== e.dir.y && o.x !== -e.dir.x && o.y !== -e.dir.y && free(o));
      const back = {x:-e.dir.x, y:-e.dir.y};
      d = side.length ? pick(side) : (free(back) ? DLIST.find(o => o.x === back.x && o.y === back.y) : null);
      if (!d) return;
    }
  }
  if (e.kind === 'S') {
    if (e.charge) {
      if (free(e.dir)) d = e.dir;
      else { e.charge = false; e.daze = .7; sfx('thud', {x:e.fx}); addShake(.15); ring(e.fx + .5 + e.dir.x * .5, e.fy + .5 + e.dir.y * .5, 'rgba(220,240,255,0.8)'); return; }
    } else {
      const los = lineOfSight(e, 8);
      if (los) { e.dir = los; e.charge = true; e.windup = .45; sfx('charge', {x:e.fx}); return; }
    }
  }
  if (!d && (e.kind === 'E' || e.kind === 'O' || e.kind === 'M' || e.kind === 'Y' || e.kind === 'K') && Math.random() > 0.1) {
    const s = bfsStep(e, e.kind === 'O' || e.kind === 'M');
    if (s) {
      const nx = e.x + s.x, ny = e.y + s.y;
      if (e.kind !== 'E' && isBlock(nx, ny)) {
        e.dir = s;
        if (e.kind === 'O') { e.chew = .8; e.chewT = {x:nx, y:ny}; } else e.punch = .55;
        return;
      }
      if (free(s)) d = s;
    }
  }
  if (!d) {
    const opts = DLIST.filter(free);
    if (!opts.length) return;
    const keep = e.kind === 'J' ? .72 : .9;
    if (free(e.dir) && Math.random() < keep) d = e.dir;
    else { const nr = opts.filter(o => !(o.x === -e.dir.x && o.y === -e.dir.y)); d = pick(nr.length ? nr : opts); }
  }
  e.dir = d; e.tx = e.x + d.x; e.ty = e.y + d.y; e.moving = true;
}

function bfsStep(e, throughBlocks, targets) {
  const goals = new Set((targets || visibleTo(e)).map(p => Math.round(p.fy) * COLS + Math.round(p.fx)));
  const start = e.y * COLS + e.x;
  if (!goals.size || goals.has(start)) return null;
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  prev[start] = start;
  const q = [start];
  let found = -1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (goals.has(c)) { found = c; break; }
    const cx = c % COLS, cy = (c / COLS) | 0;
    for (const d of DLIST) {
      const nx = cx + d.x, ny = cy + d.y;
      if (!inb(nx, ny)) continue;
      const t = S.grid[ny][nx];
      if (t === '#' || (t === 'c' && !throughBlocks)) continue;
      const ni = ny * COLS + nx;
      if (prev[ni] !== -1) continue;
      prev[ni] = c; q.push(ni);
    }
  }
  if (found < 0) return null;
  let c = found;
  while (prev[c] !== start) c = prev[c];
  return dirOf(c % COLS - e.x, ((c / COLS) | 0) - e.y);
}

function collide() {
  for (const p of S.players) {
    if (p.dead) continue;
    for (const e of S.enemies) {
      const d = Math.hypot(e.fx - p.fx, e.fy - p.fy);
      if (e.kind === 'K') {
        if (S.boss.dead) continue;
        if (e.crash > 0) { if (p.puff > 0 && d < 1.7) bossHit(p); continue; }
        if (p.puff > 0 || p.inv > 0) continue;
        if (d < .8) { hurt(p, e); break; }
        continue;
      }
      if (harmless(e)) continue;
      if (p.puff > 0) { if (d < 1.3 && e.stun <= 0) { stunEnemy(e); sfx('stun', {x:e.fx}); } continue; }
      if (p.inv > 0 || e.stun > 0) continue;
      if (d < (e.kind === 'F' && e.ph === 'flare' ? 1.3 : .62)) { hurt(p, e); break; }
    }
  }
}

function setupBoss(L) {
  if (L.boss === 'shark') {
    const e = S.enemies.find(o => o.kind === 'K');
    e.crash = 0; e.ccd = 2;
    S.boss = {kind:'shark', name:'Bruiser', hp:4, max:4, e, hurtT:0, hitCd:0, dying:0, dead:false};
  } else {
    S.boss = {kind:'queen', name:'Kraken Queen', hp:6, max:6, tents:[], spawnT:2.4, hurtT:0, hitCd:0, dying:0, dead:false, cx:7.5, cy:1.6};
  }
}

function award(p, pts, x, y, hot) {
  p.points += pts;
  S.popups.push({x, y, text:`+${pts}`, col:hot ? '#ffd166' : p.fish.tag, t:0, big:pts >= 100});
  hudCache.flash = time;
}

function bossHit(p) {
  const B = S.boss;
  if (!B || B.dead || B.hitCd > 0) return;
  B.hp--; B.hurtT = .5; B.hitCd = .6;
  if (p) award(p, BOSS_HIT_PTS + (B.hp <= 0 ? BOSS_WIN_PTS : 0), p.fx + .5, p.fy - .2, true);
  sfx('bosshit'); addShake(.4);
  for (const p of S.players) if (p.dead) revive(p);
  if (B.kind === 'shark') {
    const e = B.e; e.crash = 0; e.daze = .9; e.ccd = 1.2; e.charge = false;
    ring(e.fx + .5, e.fy + .45, 'rgba(255,240,200,0.95)'); sparkle(e.fx + .5, e.fy + .45, '#fff3b0');
  }
  if (B.hp <= 0) { B.dead = true; B.dying = 2.2; sfx('bossdown'); for (const t of B.tents || []) t.state = 'back'; }
}

function updateBoss(dt) {
  const B = S.boss;
  if (!B) return;
  if (B.hurtT > 0) B.hurtT -= dt;
  if (B.hitCd > 0) B.hitCd -= dt;
  if (B.kind === 'queen') updateTents(dt);
  if (B.dead) { B.dying -= dt; if (B.dying <= 0 && mode === 'play') levelWon(); return; }
  if (B.kind === 'queen') {
    B.spawnT -= dt;
    const active = B.tents.filter(t => t.state !== 'back').length;
    if (B.spawnT <= 0 && active < (B.hp <= 3 ? 2 : 1)) { spawnTent(); B.spawnT = B.hp <= 3 ? 1.7 : 2.6; }
  }
}

function spawnTent() {
  const B = S.boss, ap = alive();
  if (!ap.length) return;
  const p = pick(ap), px = Math.round(p.fx), py = Math.round(p.fy);
  const used = new Set(B.tents.map(t => t.key));
  const lane = type => {
    let sx, sy, d;
    if (type === 'row') { if (p.fx >= 7) { sx = 1; d = RIGHT; } else { sx = COLS - 2; d = LEFT; } sy = py; }
    else { sx = px; sy = ROWS - 2; d = UP; }
    const key = type + (type === 'row' ? sy : sx);
    if (used.has(key) || !inb(sx, sy) || S.grid[sy][sx] === '#') return null;
    const cells = [];
    let x = sx, y = sy;
    while (inb(x, y) && S.grid[y][x] !== '#') { cells.push({x, y}); x += d.x; y += d.y; }
    if (cells.length < 3) return null;
    return {key, d, cells, len:0, state:'warn', t:.9, stuckAt:-1, wig:Math.random() * 6};
  };
  const first = Math.random() < .5 ? 'row' : 'col';
  const t = lane(first) || lane(first === 'row' ? 'col' : 'row');
  if (t) { B.tents.push(t); sfx('warn', {x:t.cells[0].x}); }
}

function updateTents(dt) {
  const B = S.boss;
  for (const t of B.tents) {
    t.wig += dt;
    if (t.state === 'warn') { t.t -= dt; if (t.t <= 0) { t.state = 'out'; sfx('lash', {x:t.cells[0].x}); } }
    else if (t.state === 'out') {
      const from = Math.floor(t.len);
      t.len = Math.min(t.cells.length, t.len + dt * 13);
      for (let i = from; i < Math.ceil(t.len); i++) {
        const c = t.cells[i];
        if (S.grid[c.y][c.x] === 'c') { t.len = i; t.stuckAt = i; t.state = 'stuck'; t.t = 2.6; sfx('stuck', {x:c.x}); addShake(.15); break; }
      }
      if (t.state === 'out' && t.len >= t.cells.length) { t.state = 'hold'; t.t = .35; }
    } else if (t.state === 'hold') { t.t -= dt; if (t.t <= 0) t.state = 'back'; }
    else if (t.state === 'stuck') {
      t.t -= dt;
      if (t.t <= 0) { const c = t.cells[t.stuckAt]; if (isBlock(c.x, c.y)) { breakBlock(c.x, c.y, 0); sfx('break', {x:c.x}); } t.state = 'back'; }
    } else if (t.state === 'back') t.len -= dt * 10;
  }
  B.tents = B.tents.filter(t => !(t.state === 'back' && t.len <= 0));
}

function tentEnds(t) {
  const bx = t.cells[0].x + .5 - t.d.x * .5, by = t.cells[0].y + .5 - t.d.y * .5;
  return {bx, by, tx:bx + t.d.x * t.len, ty:by + t.d.y * t.len};
}

function tentCollide() {
  const B = S.boss;
  if (!B || B.kind !== 'queen' || B.dead) return;
  for (const t of B.tents) {
    if (t.state === 'warn' || t.state === 'back') continue;
    const {bx, by, tx, ty} = tentEnds(t);
    for (const p of S.players) {
      if (p.dead) continue;
      const cx = p.fx + .5, cy = p.fy + .5;
      if (t.state === 'stuck') {
        if (p.puff > 0 && Math.hypot(cx - tx, cy - ty) < 1.6) { bossHit(p); t.state = 'back'; return; }
        continue;
      }
      if (p.puff > 0 || p.inv > 0) continue;
      const along = (cx - bx) * t.d.x + (cy - by) * t.d.y, perp = Math.abs((cx - bx) * t.d.y - (cy - by) * t.d.x);
      if (along > -.2 && along < t.len + .1 && perp < .5) hurt(p, null);
    }
  }
}

function hurt(p, e) {
  if (p.shield) {
    p.shield = false; p.inv = 1.2;
    if (e) stunEnemy(e, 2);
    sfx('pop', {x:p.fx, p:p.id}); ring(p.fx + .5, p.fy + .45, 'rgba(200,240,255,0.95)'); addShake(.12);
    for (let i = 0; i < 10; i++) parts.push({x:p.fx + .5, y:p.fy + .45, vx:rand(-2, 2), vy:rand(-2, 1), life:.5, max:.5, size:rand(.04, .08), kind:'bub', delay:0, ph:Math.random() * 6});
    return;
  }
  killPlayer(p);
}

function updateFriend(n, dt) {
  n.anim += dt;
  if (n.shieldCd > 0) n.shieldCd -= dt;
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!n.moving) {
      if (n.wait > 0) { n.wait -= dt; break; }
      const free = d => { const x = n.x + d.x, y = n.y + d.y; return inb(x, y) && S.grid[y][x] === '.'; };
      const ap = alive();
      const far = ap.length && Math.min(...ap.map(p => Math.abs(p.fx - n.fx) + Math.abs(p.fy - n.fy))) > 3;
      let d = null;
      if (far && Math.random() < .7) { const s = bfsStep(n, false, ap); if (s && free(s)) d = s; }
      if (!d) {
        const opts = DLIST.filter(free);
        if (!opts.length) { n.wait = .4; break; }
        if (free(n.dir) && Math.random() < .8) d = n.dir;
        else { const nr = opts.filter(o => !(o.x === -n.dir.x && o.y === -n.dir.y)); d = pick(nr.length ? nr : opts); }
        if (!far && Math.random() < .15) { n.wait = rand(.4, 1.2); n.dir = d; break; }
      }
      n.dir = d; n.tx = n.x + d.x; n.ty = n.y + d.y; n.moving = true;
    }
    const left = advance(n, n.speed, rem);
    if (left < 0) break;
    rem = left;
  }
}

function friendCheck() {
  for (const n of S.friends) {
    for (const e of S.enemies) {
      if (e.kind === 'K' || harmless(e) || e.stun > 0) continue;
      if (Math.hypot(e.fx - n.fx, e.fy - n.fy) < .8) {
        stunEnemy(e, 1.8); sfx('boop', {x:n.fx}); ring(e.fx + .5, e.fy + .45, 'rgba(255,255,255,0.8)'); n.happy = .6;
      }
    }
    if (mode !== 'play' && mode !== 'style') continue;
    for (const p of S.players) {
      if (p.dead || p.shield || n.shieldCd > 0) continue;
      if (Math.hypot(p.fx - n.fx, p.fy - n.fy) < .75) {
        p.shield = true; n.shieldCd = 7; n.happy = .8;
        sfx('shield', {x:p.fx, p:p.id}); ring(p.fx + .5, p.fy + .45, 'rgba(190,240,255,0.95)');
      }
    }
    if (n.happy > 0) n.happy -= 1 / 60;
  }
}

function hazardCheck() {
  for (const p of S.players) {
    if (p.dead || p.inv > 0) continue;
    const x = Math.round(p.fx), y = Math.round(p.fy);
    const u = S.urchins.get(y * COLS + x);
    if (u && u.armed && Math.hypot(p.fx - x, p.fy - y) < .4) hurt(p, null);
  }
}

function killPlayer(p) {
  p.dead = true; p.deathT = 1.4; p.moving = false; p.shield = false;
  S.catches++; addShake(.3);
  sfx('die', {x:p.fx, p:p.id});
  for (let i = 0; i < 12; i++) parts.push({x:p.fx + .5, y:p.fy + .5, vx:rand(-1, 1), vy:rand(-2, -.5), life:1, max:1, size:rand(.04, .09), kind:'bub', delay:0, ph:Math.random() * 6});
}

function collectCheck() {
  if (mode !== 'play') return;
  for (const p of S.players) {
    if (p.dead) continue;
    for (let i = S.snacks.length - 1; i >= 0; i--) {
      const s = S.snacks[i];
      if (time < s.born) continue;
      if (S.grid[Math.round(s.fy)][Math.round(s.fx)] === 'c') continue;
      if (s.type === 'clam' && s.lid < .6) continue;
      if (Math.hypot(s.fx - p.fx, s.fy - p.fy) < .62) {
        S.snacks.splice(i, 1); p.score++; save.stats.snacks = (save.stats.snacks || 0) + 1;
        p.streak = time - p.lastGet < STREAK_WINDOW ? p.streak + 1 : 0; p.lastGet = time;
        award(p, (SNACK_PTS[s.type] || 10) + Math.min(p.streak, STREAK_MAX) * STREAK_PTS, s.fx + .5, s.fy + .1, p.streak >= 2);
        sfx('get', {x:s.fx, p:p.id});
        sparkle(s.fx + .5, s.fy + .5, '#fff3b0');
      }
    }
  }
  if (!S.boss && S.snacks.length === 0 && S.failT <= 0 && S.players.some(p => !p.dead)) nextWave(false);
}

// ================= particles =================
function sparkle(x, y, col) { for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; parts.push({x, y, vx:Math.cos(a) * 1.6, vy:Math.sin(a) * 1.6, life:.45, max:.45, size:.05, kind:'spark', col, delay:0, ph:0}); } }
function ring(x, y, col) { parts.push({x, y, vx:0, vy:0, life:.4, max:.4, size:.2, kind:'ring', col, delay:0, ph:0}); }
function steam(x, y, delay) { for (let i = 0; i < 6; i++) parts.push({x:x + rand(.25, .75), y:y + .6, vx:rand(-.3, .3), vy:-rand(.8, 1.6), life:.7, max:.7, size:rand(.05, .1), kind:'steam', delay, ph:0}); }
function updateParts(dt) {
  if (Math.random() < dt * 2.2) parts.push({x:Math.random() * COLS, y:ROWS + .2, vx:0, vy:-rand(.5, 1.1), life:14, max:14, size:rand(.03, .08), kind:'amb', delay:0, ph:Math.random() * 6});
  if (S) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (S.floor[y][x] === 'h' && Math.random() < dt * 1.2)
    parts.push({x:x + rand(.3, .7), y:y + .5, vx:0, vy:-rand(.6, 1), life:1.6, max:1.6, size:rand(.03, .06), kind:'vent', delay:0, ph:Math.random() * 6});
  for (const q of parts) {
    if (q.delay > 0) { q.delay -= dt; continue; }
    q.life -= dt;
    const wob = (q.kind === 'amb' || q.kind === 'bub' || q.kind === 'vent') ? Math.sin(time * 2 + q.ph) * .15 * dt : 0;
    q.x += q.vx * dt + wob; q.y += q.vy * dt;

  for (const n of S.friends) buckets[rowOf(n)].ents.push({t:'f', o:n});
  for (const p of S.players) if (!p.dead || p.deathT > 0) buckets[rowOf(p)].ents.push({t:'p', o:p});
  for (let y = 0; y < ROWS; y++) {
    for (const it of buckets[y].enc) drawSnack(it.o);
    for (let x = 0; x < COLS; x++) {
      const g = S.grid[y][x];
      if (g === '#') {
        if (S.bossTiles.has(y * COLS + x)) continue;
        const front = !(y + 1 < ROWS && S.grid[y + 1][x] === '#');
        ctx.drawImage(rockSpr[hashi(x, y) % 3][front ? 1 : 0], x, y - .2, 1, 1.2);
      } else if (g === 'c') drawCoral(x, y);
    }
    buckets[y].ents.sort((a, b) => a.o.fx - b.o.fx);
    paperShadow(true);
    for (const it of buckets[y].ents) {
      if (it.t === 's') drawSnack(it.o);
      else if (it.t === 'e') drawEnemy(it.o);
      else if (it.t === 'f') drawSeal(it.o);
      else { drawPuffer(it.o); drawShield(it.o); }
    }
    paperShadow(false); // the kelp sprites carry their own shadow
    for (let x = 0; x < COLS; x++) if (S.floor[y][x] === 'k') drawKelp(x, y);
  }
}

function drawCoral(x, y) {
  const b = S.born[y][x];
  let s = 1;
  if (b > -1) { const t = (time - b) / .18; if (t < 0) return; s = t >= 1 ? 1 : easeOutBack(t); }
  const enc = S.snacks.some(o => Math.round(o.fx) === x && Math.round(o.fy) === y);
  ctx.save();
  if (theme.glow) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (.7 + .3 * Math.sin(time * 2 + x * .7 + y)) * Math.min(1, s);
    ctx.drawImage(glowCv, x - .4, y - .45, 1.8, 1.8);
    ctx.restore();
  }
  if (enc) ctx.globalAlpha = .8;
  ctx.translate(x + .5, y + 1); ctx.scale(s, s);
  ctx.drawImage(coralSpr[hashi(x, y) % 4], -.5, -1.2, 1, 1.2);
  ctx.restore();
}

function drawSnack(s) {
  const t = (time - s.born) / .25;
  const sc = t >= 1 ? 1 : Math.max(0.01, easeOutBack(Math.max(0, t)));
  const bob = Math.sin(time * 3 + s.x + s.y) * .04;
  shadow(s.fx + .5, s.fy + .85, .17 * sc);
  ctx.save();
  ctx.translate(s.fx + .5, s.fy + .48 + bob); ctx.scale(sc, sc);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, .42);
  g.addColorStop(0, 'rgba(255,250,210,0.26)'); g.addColorStop(1, 'rgba(255,250,210,0)');
  ctx.fillStyle = g; circ(0, 0, .42); ctx.fill();
  switch (s.type) {
    case 'krill':
      ctx.rotate(Math.sin(time * 2 + s.x) * .3);
      ctx.strokeStyle = '#ff8c42'; ctx.lineWidth = .12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, .08, .18, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.strokeStyle = '#ffc49a'; ctx.lineWidth = .025;
      ctx.beginPath(); ctx.moveTo(.17, .03); ctx.lineTo(.3, -.08); ctx.moveTo(.16, .05); ctx.lineTo(.3, .02); ctx.stroke();
      ctx.fillStyle = '#2a1408'; circ(.13, 0, .025); ctx.fill();
      break;
    case 'pearl': {
      ctx.fillStyle = '#d87aa8'; ctx.beginPath(); ctx.ellipse(0, .1, .22, .1, 0, 0, Math.PI); ctx.fill();
      const pg = ctx.createRadialGradient(-.05, -.05, .02, 0, 0, .16);
      pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#bfcfe4');
      ctx.fillStyle = pg; circ(0, 0, .15); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; circ(-.05, -.05, .035); ctx.fill();
      break;
    }
    case 'grape':
      ctx.strokeStyle = '#3f8f57'; ctx.lineWidth = .03;
      ctx.beginPath(); ctx.moveTo(0, -.12); ctx.lineTo(.04, -.24); ctx.stroke();
      for (const [gx, gy] of [[0, -.1], [-.1, -.01], [.1, -.01], [0, .07], [-.06, .15], [.06, .15]]) {
        ctx.fillStyle = '#6fd08c'; circ(gx, gy, .075); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; circ(gx - .025, gy - .025, .022); ctx.fill();
      }
      break;
    case 'star':
      ctx.rotate(time * .6 + s.x);
      ctx.fillStyle = '#ffb347'; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? .09 : .21; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,200,0.8)'; circ(0, 0, .03); ctx.fill();
      break;
    case 'shrimp': {
      if (s.dir && s.dir.x < 0) ctx.scale(-1, 1);
      const w = Math.sin(s.anim * 14) * .05;
      ctx.fillStyle = '#ffd0c4';
      ctx.beginPath(); ctx.moveTo(-.2, .02); ctx.lineTo(-.32, -.06 + w); ctx.lineTo(-.32, .1 + w); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff7f8e'; ctx.lineWidth = .11; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-.2, .03); ctx.quadraticCurveTo(0, -.12, .16, .02); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = .02;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-.12 + i * .08, -.06); ctx.lineTo(-.1 + i * .08, .04); ctx.stroke(); }
      ctx.strokeStyle = '#ffb3bd'; ctx.lineWidth = .018;
      ctx.beginPath(); ctx.moveTo(.16, 0); ctx.quadraticCurveTo(.32, -.1, .38, -.22); ctx.stroke();
      ctx.fillStyle = '#1b1b1b'; circ(.13, -.03, .022); ctx.fill();
      break;
    }
    case 'clam': {
      const open = s.lid;
      ctx.fillStyle = '#b48ad6'; ctx.beginPath(); ctx.ellipse(0, .06, .22, .12, 0, 0, Math.PI); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = .02;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * .07, .06); ctx.lineTo(i * .09, .16); ctx.stroke(); }
      if (open > .05) {
        const pg = ctx.createRadialGradient(-.03, -.01, .01, 0, .02, .09);
        pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#f2c6e8');
        ctx.fillStyle = pg; ctx.globalAlpha *= open; circ(0, .02, .08); ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.save(); ctx.translate(-.21, .06); ctx.rotate(-open * .9);
      ctx.fillStyle = '#c9a3ea'; ctx.beginPath(); ctx.ellipse(.21, 0, .22, .12, 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(.21 + i * .07, 0); ctx.lineTo(.21 + i * .09, -.1); ctx.stroke(); }
      ctx.restore();
      break;
    }
    case 'moon': {
      const flick = s.t < .6 ? (Math.floor(time * 16) % 2 ? .35 : 1) : 1;
      ctx.globalAlpha = flick;
      const mg = ctx.createRadialGradient(0, 0, 0, 0, 0, .34);
      mg.addColorStop(0, 'rgba(180,210,255,0.5)'); mg.addColorStop(1, 'rgba(180,210,255,0)');
      ctx.fillStyle = mg; circ(0, 0, .34); ctx.fill();
      const pg = ctx.createRadialGradient(-.05, -.05, .02, 0, 0, .16);
      pg.addColorStop(0, '#ffffff'); pg.addColorStop(1, '#9fb8f0');
      ctx.fillStyle = pg; circ(0, 0, .15); ctx.fill();
      ctx.fillStyle = '#fff'; const a = time * 3;
      circ(Math.cos(a) * .24, Math.sin(a) * .1, .025); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawPuffer(p, alphaMul) {
  const F = p.fish;
  let puffAmt = 0;
  if (p.puff > 0) puffAmt = Math.min(1, (PUFF_T - p.puff) / .12, p.puff / .18);
  const r = .32 + .15 * puffAmt;
  const bob = p.dead ? 0 : Math.sin(time * 4 + p.id) * .03;
  let lift = 0, alpha = alphaMul || 1;
  if (p.dead) { const k = 1 - p.deathT / 1.4; lift = -k * .8; alpha *= Math.max(0, 1 - k * .9); }
  if (!p.dead && p.inv > 0 && Math.floor(time * 12) % 2) alpha *= .4;
  if (!p.dead) shadow(p.fx + .5, p.fy + .88, r * .9);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.fx + .5, p.fy + .45 + bob + lift);
  const f = p.face;
  if (f.x < 0) ctx.scale(-1, 1);
  else if (f.y !== 0) ctx.rotate(Math.atan2(f.y, f.x) * .55);
  if (p.dead) ctx.scale(1, -1);
  if (puffAmt > 0) {
    ctx.strokeStyle = F.spike; ctx.lineWidth = .035; ctx.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .92, Math.sin(a) * r * .92); ctx.lineTo(Math.cos(a) * (r + .1 * puffAmt), Math.sin(a) * (r + .1 * puffAmt)); ctx.stroke();
    }
  }
  const wag = Math.sin(time * 9 + p.id) * .04;
  ctx.fillStyle = F.fin;
  ctx.beginPath(); ctx.moveTo(-r * .8, 0); ctx.lineTo(-r - .17, -.13 + wag); ctx.lineTo(-r - .12, 0); ctx.lineTo(-r - .17, .13 + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-r * .2, -r * .92); ctx.quadraticCurveTo(-r * .45, -r * 1.25 - wag, -r * .6, -r * .78); ctx.closePath(); ctx.fill();
  const bg = ctx.createRadialGradient(-r * .3, -r * .4, r * .1, 0, 0, r);
  bg.addColorStop(0, F.c1); bg.addColorStop(1, F.c2);
  ctx.fillStyle = bg; circ(0, 0, r); ctx.fill();
  if (F.pattern === 'stripes') {
    ctx.save(); circ(0, 0, r); ctx.clip();
    ctx.strokeStyle = F.spot; ctx.lineWidth = r * .14; ctx.lineCap = 'round';
    for (const sx of [-.55, -.18, .2]) { ctx.beginPath(); ctx.moveTo(sx * r + r * .08, -r * 1.05); ctx.quadraticCurveTo(sx * r - r * .2, -r * .4, sx * r, r * .15); ctx.stroke(); }
    ctx.restore();
  }
  ctx.fillStyle = F.belly; ctx.globalAlpha = alpha * .92; ell(r * .05, r * .42, r * .72, r * .42); ctx.fill(); ctx.globalAlpha = alpha;
  ctx.fillStyle = F.spot;
  if (F.pattern === 'spots' || !F.pattern) for (const [sx, sy, sr] of [[-.45, -.35, .09], [-.1, -.6, .07], [-.6, .05, .07], [.15, -.25, .05], [-.3, -.05, .045]]) { circ(sx * r, sy * r, sr * r * 1.6); ctx.fill(); }
  if (F.pattern === 'hearts') for (const [sx, sy, sz] of [[-.46, -.38, 1], [-.08, -.66, .85], [-.66, .04, .8], [.16, -.3, .7], [-.24, -.06, .65]]) {
    const hs = r * .2 * sz;
    ctx.save(); ctx.translate(sx * r, sy * r); ctx.beginPath();
    ctx.moveTo(0, hs * .35); ctx.bezierCurveTo(-hs * 1.2, -hs * .35, -hs * .45, -hs * 1.15, 0, -hs * .45); ctx.bezierCurveTo(hs * .45, -hs * 1.15, hs * 1.2, -hs * .35, 0, hs * .35);
    ctx.fill(); ctx.restore();
  }
  if (F.pattern === 'freckles') for (const [sx, sy] of [[-.62, -.2], [-.48, -.48], [-.3, -.68], [-.08, -.78], [.12, -.62], [-.34, -.3], [-.12, -.42], [-.56, .1], [.05, -.3], [-.28, -.08], [.22, -.4], [-.7, -.02]]) { circ(sx * r, sy * r, r * .045); ctx.fill(); }
  if (puffAmt === 0) for (let i = 0; i < 6; i++) { const a = -2.6 + i * .45; circ(Math.cos(a) * r * .95, Math.sin(a) * r * .95, .018); ctx.fill(); }
  ctx.fillStyle = F.fin; ctx.save(); ctx.translate(-r * .05, r * .15); ctx.rotate(Math.sin(time * 10 + p.id) * .3); ell(0, 0, .08, .045); ctx.fill(); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ell(-r * .35, -r * .55, r * .22, r * .1); ctx.fill();
  const ex = r * .42, ey = -r * .22;
  ctx.fillStyle = '#fff'; circ(ex, ey, r * .3); ctx.fill();
  if (p.dead) {
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = .03;
    ctx.beginPath(); ctx.moveTo(ex - .05, ey - .05); ctx.lineTo(ex + .05, ey + .05); ctx.moveTo(ex + .05, ey - .05); ctx.lineTo(ex - .05, ey + .05); ctx.stroke();
  } else {
    ctx.fillStyle = '#16232b'; circ(ex + r * .08, ey + r * .02, r * .16); ctx.fill();
    ctx.fillStyle = '#fff'; circ(ex + r * .12, ey - r * .05, r * .055); ctx.fill();
  }
  ctx.fillStyle = '#7a3d12';
  ell(r * .93, r * .12, .035 + puffAmt * .02, .03 + puffAmt * .03); ctx.fill();
  if (F.acc && F.acc !== 'none') drawAccessory(F.acc, r, ex, ey);
  ctx.restore();
}

function drawAccessory(acc, r, ex, ey) {
  const k = r / .32;
  ctx.save();
  if (acc === 'glasses') {
    const er = r * .34;
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = .028 * k; ctx.lineCap = 'round';
    circ(ex, ey, er); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex - er, ey - er * .1); ctx.lineTo(ex - er * 2.1, ey - er * .35); ctx.stroke();
    ctx.fillStyle = 'rgba(200,240,255,0.25)'; circ(ex, ey, er); ctx.fill();
  } else if (acc === 'bow') {
    ctx.translate(-r * .12, -r * .95); ctx.rotate(-.25); ctx.scale(k, k);
    ctx.fillStyle = '#ff5c8a';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-.13, -.08); ctx.lineTo(-.13, .08); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(.13, -.08); ctx.lineTo(.13, .08); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d63e6c'; circ(0, 0, .035); ctx.fill();
  } else if (acc === 'flower') {
    ctx.translate(r * .05, -r * .94); ctx.scale(k, k);
    ctx.fillStyle = '#fff3f7';
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; circ(Math.cos(a) * .055, Math.sin(a) * .055, .045); ctx.fill(); }
    ctx.fillStyle = '#ffcf4a'; circ(0, 0, .035); ctx.fill();
  } else if (acc === 'cap') {
    ctx.translate(-r * .05, -r * .86); ctx.rotate(-.18); ctx.scale(k, k);
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(0, 0, .17, .12, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3f6fd8'; ctx.fillRect(-.17, -.035, .34, .04);
    ctx.fillStyle = '#e6eefc'; ell(.02, .012, .19, .03); ctx.fill();
    ctx.fillStyle = '#3f6fd8'; circ(0, -.12, .025); ctx.fill();
  } else if (acc === 'star') {
    ctx.translate(-r * .3, -r * .9); ctx.rotate(.3); ctx.scale(k * 1.35, k * 1.35);
    ctx.fillStyle = '#ffb347'; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? .04 : .095; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.9)'; circ(0, 0, .015); ctx.fill();
  } else if (acc === 'fin') {
    ctx.translate(-r * .12, -r * .9); ctx.rotate(-.12); ctx.scale(k, k);
    ctx.fillStyle = '#7f99a8';
    ctx.beginPath(); ctx.moveTo(-.12, .03); ctx.lineTo(.03, -.22); ctx.quadraticCurveTo(.07, -.06, .13, .03); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9d6dd'; ctx.beginPath(); ctx.moveTo(-.07, .03); ctx.lineTo(.02, -.13); ctx.lineTo(.0, .03); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#58717f'; ctx.fillRect(-.14, .02, .29, .035);
  } else if (acc === 'crown') {
    ctx.translate(-r * .06, -r * .93); ctx.rotate(-.12); ctx.scale(k, k);
    ctx.fillStyle = '#f6c445';
    ctx.beginPath(); ctx.moveTo(-.13, .03);
    for (const [x, y] of [[-.12, -.11], [-.06, -.03], [0, -.15], [.06, -.03], [.12, -.11], [.13, .03]]) ctx.lineTo(x, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8463a'; circ(0, -.05, .022); ctx.fill();
    ctx.fillStyle = '#7cc4f0'; circ(-.08, -.01, .016); ctx.fill(); circ(.08, -.01, .016); ctx.fill();
  } else if (acc === 'pearls') {
    for (let i = 0; i < 9; i++) {
      const a = -.05 * Math.PI + i * (.62 * Math.PI / 8), x = Math.cos(a) * r * .84, y = Math.sin(a) * r * .84;
      ctx.fillStyle = '#f7f4ff'; circ(x, y, .03 * k); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)'; circ(x - .01 * k, y - .01 * k, .01 * k); ctx.fill();
    }
  }
  ctx.restore();
}

// small animated fish previews inside menu cards
function drawPreviews() {
  const cvs = card.querySelectorAll('canvas[data-who]');
  if (!cvs.length) return;
  const keep = ctx;
  for (const pc of cvs) {
    const w = pc.clientWidth || +pc.getAttribute('width') || 120, d = Math.min(window.devicePixelRatio || 1, 2.5);
    if (pc.width !== Math.round(w * d)) { pc.width = Math.round(w * d); pc.height = Math.round(w * d); }
    const c = pc.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pc.width, pc.height);
    const u = pc.width / 1.5;
    c.setTransform(u, 0, 0, u, 0, 0);
    ctx = c;
    const who = pc.dataset.who, big = pc.dataset.big === '1';
    const cyc = (time + (who === 'milli' ? 1.3 : 0)) % 4;
    try {
      drawPuffer({id:who === 'milli' ? 1 : 0, fish:getFish(who), fx:.28, fy:.36, face:who === 'milli' && !big ? LEFT : RIGHT, puff:big && cyc > 3 ? .65 : 0, dead:false, inv:0});
    } finally { ctx = keep; }
  }
}

function drawTags() {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `800 ${Math.max(10, Math.round(T * .3))}px Grandstander, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round'; // miter joins put spikes on the M and N of the outlined names
  for (const n of S.friends) {
    const x = (n.fx + .5) * T, y = (n.fy - .02) * T;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,26,36,0.75)'; ctx.strokeText('Nori', x, y);
    ctx.fillStyle = '#ffd6e0'; ctx.fillText('Nori', x, y);
  }
  for (const q of S.popups) {
    const k = q.t, x = q.x * T, y = (q.y - k * .9) * T;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.font = `800 ${Math.max(11, Math.round(T * (q.big ? .5 : .36)))}px Grandstander, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(2,26,36,0.8)'; ctx.strokeText(q.text, x, y);
    ctx.fillStyle = q.col; ctx.fillText(q.text, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.font = `800 ${Math.max(10, Math.round(T * .3))}px Grandstander, system-ui, sans-serif`;
  if (!twoP && mode !== 'style') { ctx.restore(); return; }
  for (const p of S.players) {
    if (p.dead) continue;
    const x = (p.fx + .5) * T, y = (p.fy - .02) * T - (p.puff > 0 ? T * .14 : 0);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,26,36,0.75)'; ctx.strokeText(p.fish.name, x, y);
    ctx.fillStyle = p.fish.tag; ctx.fillText(p.fish.name, x, y);
  }
  ctx.restore();
}

function drawStun(e) {
  if (e.stun <= 0) return;
  ctx.fillStyle = '#fff4a3';
  for (let i = 0; i < 3; i++) { const a = time * 5 + i * 2.09; circ(e.fx + .5 + Math.cos(a) * .22, e.fy + .02 + Math.sin(a) * .07, .045); ctx.fill(); }
}

function drawEnemy(e) {
  if (e.kind === 'Y' && e.state === 'buried') { drawRay(e); return; }
  shadow(e.fx + .5, e.fy + (FLY[e.kind] ? .97 : .88), e.kind === 'J' ? .2 : e.kind === 'A' ? .32 : e.kind === 'K' ? .5 : .3);
  ctx.save();
  if (e.stun > 0) ctx.globalAlpha = .75;
  ({C:drawCrab, J:drawJelly, E:drawEel, O:drawOcto, S:drawSword, M:drawMantis, A:drawManta, Y:drawRay, F:drawLion, K:drawShark})[e.kind](e);
  ctx.restore();
  drawStun(e);
}

function drawCrab(e) {
  const w = Math.sin(e.anim * 16) * (e.moving && e.stun <= 0 ? 1 : .15);
  ctx.translate(e.fx + .5, e.fy + .5);
  ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .045; ctx.lineCap = 'round';
  for (let s = -1; s <= 1; s += 2) for (let i = 0; i < 3; i++) {
    const yy = -.02 + i * .07;
    ctx.beginPath(); ctx.moveTo(s * .2, yy); ctx.lineTo(s * .35, yy + .04 + (i % 2 ? w : -w) * .03); ctx.lineTo(s * .4, yy + .15); ctx.stroke();
  }
  for (let s = -1; s <= 1; s += 2) {
    ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .05;

    ctx.fillStyle = '#f0604a'; circ(s * .31, -.28, .095); ctx.fill();

    ctx.fillStyle = e.windup > 0 || e.charge ? '#e8332e' : '#111'; circ(.24, -.05, .018); ctx.fill();
    ctx.strokeStyle = '#2f3f48'; ctx.lineWidth = .02; ctx.beginPath(); ctx.moveTo(.17, -.11); ctx.lineTo(.28, -.08); ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3b4a52'; ctx.lineWidth = .012;
  ctx.beginPath(); ctx.moveTo(.16, .05);
  for (let i = 0; i < 5; i++) { ctx.lineTo(.16 + i * .035 + .017, .085); ctx.lineTo(.16 + (i + 1) * .035, .05); }
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawTentPath(pts, w0, w1) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = pts.length;
  // one blurred stroke for the paper shadow, then the tapered passes without it; a blur per segment was most of the Queen's frame cost
  if (ctx.shadowBlur > 0) {
    ctx.strokeStyle = '#6e2463'; ctx.lineWidth = (w0 + w1) / 2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0;
  }
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? '#c25a9e' : '#6e2463';
    for (let i = 1; i < n; i++) {
      ctx.lineWidth = (w0 + (w1 - w0) * (i / (n - 1))) * (pass ? .7 : 1);
      ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,215,235,0.75)';
  for (let i = 1; i < n - 1; i += 2) { const w = w0 + (w1 - w0) * (i / (n - 1)); circ(pts[i].x, pts[i].y + w * .15, w * .16); ctx.fill(); }
  ctx.restore();
}

function drawQueenBody(cx, cy, sc, mood, alpha, flash, lookX) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy); ctx.scale(sc, sc);
  const shadowed = ctx.shadowBlur > 0;
  for (let i = 0; i < 6; i++) {
    const side = i < 3 ? -1 : 1, k = i % 3, pts = [];
    for (let j = 0; j <= 10; j++) { const s = j / 10; pts.push({x:side * (.55 + k * .3 + s * (1.1 + k * .25)), y:.55 + s * (1.3 - k * .25) + Math.sin(time * 2 + s * 4 + i) * .15 * s}); }
    drawTentPath(pts, .34, .1);
  }
  // same trick for the body: one blurred fill under everything, then the details without blur
  if (shadowed) { ctx.fillStyle = '#7b2a6e'; ell(0, 0, 1.45, 1.12); ctx.fill(); ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; }
  const g = ctx.createRadialGradient(-.4, -.5, .1, 0, 0, 1.6);
  g.addColorStop(0, '#ec93c4'); g.addColorStop(1, '#7b2a6e');
  ctx.fillStyle = g; ell(0, 0, 1.45, 1.12); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,240,0.25)';
  for (const [x, y, r] of [[-.75, -.4, .12], [.5, -.62, .09], [.92, -.1, .1], [-.3, -.78, .07], [.2, .55, .08]]) { circ(x, y, r); ctx.fill(); }
  ctx.fillStyle = '#f6c445';
  ctx.beginPath(); ctx.moveTo(-.55, -.98);
  for (const [x, y] of [[-.48, -1.45], [-.26, -1.12], [0, -1.58], [.26, -1.12], [.48, -1.45], [.55, -.98]]) ctx.lineTo(x, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8463a'; circ(0, -1.25, .07); ctx.fill();
  ctx.fillStyle = '#7cc4f0'; circ(-.36, -1.12, .05); ctx.fill(); circ(.36, -1.12, .05); ctx.fill();
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fff'; ell(s * .5, .15, .3, .36); ctx.fill();
    ctx.fillStyle = '#1b0d1f'; ell(s * .5 + (lookX || 0) * .1, .2, mood === 'calm' ? .13 : .08, mood === 'calm' ? .16 : .26); ctx.fill();
    ctx.fillStyle = '#fff'; circ(s * .5 + .07, .06, .05); ctx.fill();
  }
  if (mood === 'angry') {
    ctx.strokeStyle = '#4a1240'; ctx.lineWidth = .08; ctx.lineCap = 'round';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * .82, -.3); ctx.lineTo(s * .25, -.12); ctx.stroke(); }
    ctx.lineWidth = .05; ctx.beginPath(); ctx.moveTo(-.22, .72); ctx.quadraticCurveTo(0, .6, .22, .72); ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,150,190,0.5)'; for (const s of [-1, 1]) { ell(s * .88, .52, .18, .09); ctx.fill(); }
    ctx.strokeStyle = '#4a1240'; ctx.lineWidth = .05; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-.2, .66); ctx.quadraticCurveTo(0, .8, .2, .66); ctx.stroke();
  }
  if (flash) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ell(0, 0, 1.45, 1.12); ctx.fill(); }
  ctx.restore();
}

function drawTent(t) {
  if (t.len <= .05) return;
  const d = t.d, {bx, by} = tentEnds(t), px = -d.y, py = d.x, n = Math.max(3, Math.ceil(t.len * 3));
  const tremble = t.state === 'stuck' ? Math.sin(time * 40) * .05 : 0, pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n * t.len, w = Math.sin(t.wig * 4 + s * 1.6) * .1 * Math.min(1, s) + (i === n ? tremble : 0);
    pts.push({x:bx + d.x * s + px * w, y:by + d.y * s + py * w});
  }
  drawTentPath(pts, .62, .3);
  if (t.state === 'stuck') {
    const tip = pts[n];
    ctx.strokeStyle = `rgba(255,220,90,${.55 + .4 * Math.sin(time * 10)})`; ctx.lineWidth = .06;
    circ(tip.x, tip.y, .48); ctx.stroke();
    ctx.fillStyle = '#fff4a3';
    for (let i = 0; i < 3; i++) { const a = time * 6 + i * 2.09; circ(tip.x + Math.cos(a) * .3, tip.y - .35 + Math.sin(a) * .08, .045); ctx.fill(); }
  }
}

function drawWarnings() {
  for (const t of S.boss.tents) {
    if (t.state !== 'warn') continue;
    ctx.fillStyle = `rgba(255,70,110,${.18 + .14 * Math.sin(time * 18)})`;
    for (const c of t.cells) { if (S.grid[c.y][c.x] === 'c') break; rr(c.x + .06, c.y + .06, .88, .88, .14); ctx.fill(); }
    const c0 = t.cells[0];
    if (Math.random() < .35) parts.push({x:c0.x + .5 - t.d.x * .4 + rand(-.3, .3), y:c0.y + .5 - t.d.y * .4, vx:0, vy:-rand(.5, 1), life:.8, max:.8, size:rand(.04, .08), kind:'bub', delay:0, ph:0});
  }
}

function drawBoss() {
  const B = S.boss;
  if (B.kind !== 'queen') return;
  const k = B.dead ? Math.max(0, B.dying / 2.2) : 1;
  const tgt = alive()[0], lookX = tgt ? Math.max(-1, Math.min(1, (tgt.fx + .5 - B.cx) / 4)) : 0;
  drawQueenBody(B.cx, B.cy + (1 - k) * 1.2, 1, B.dead ? 'calm' : 'angry', k, B.hurtT > 0 && Math.floor(time * 20) % 2, lookX);
  for (const t of B.tents) drawTent(t);
}

let story = null;
function playStory(id, done) {
  mode = 'story'; S = null;
  overlay.hidden = true; hideBanner(); hideStyle();
  story = {id, i:0, done, t0:time, chars:0};
  storyEl.hidden = false;
  showPanel();
}
function showPanel() {
  const list = STORY[story.id];

  storyDots.innerHTML = list.length > 1 ? list.map((_, i) => `<i class="${i === story.i ? 'on' : ''}"></i>`).join('') : '';

}

  if (!story) return;
  const P = STORY[story.id][story.i];
  if (story.chars < P.text.length) { story.chars = P.text.length; return; }
  sfx('click');

}

}

  const snack = (type, fx, fy) => drawSnack({type, x:Math.round(fx), y:Math.round(fy), fx, fy, born:-9, anim:time, t:9, lid:1, open:true, dir:RIGHT});
  const bob = k => Math.sin(time * 2 + k) * .15;
  const decor = () => { [[2, 3], [3, 3], [11, 3], [12, 3], [2, 9], [12, 9], [11, 9]].forEach(([x, y]) => coral(x, y)); [[1, 10], [13, 10], [5, 11], [9, 11]].forEach(([x, y]) => drawKelp(x, y)); };
  const glow = (x, y, r, col) => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); };
  const dark = a => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.fillStyle = `rgba(4,8,30,${a})`; ctx.fillRect(0, 0, COLS, ROWS); ctx.restore(); };
  const ring6 = (cx, cy, rx, ry, types) => types.forEach((ty, i) => { const a = i / types.length * Math.PI * 2 + time * .25; snack(ty, cx - .5 + Math.cos(a) * rx, cy - .5 + Math.sin(a) * ry); });
  rockRow(0); rockRow(ROWS - 1);
  paperShadow(true);
  switch (P.scene) {

      break;
    case 'feast':

      ring6(7.5, 6.6, 3.6, 2.7, ['krill', 'pearl', 'grape', 'star', 'clam', 'moon', 'shrimp', 'krill', 'pearl', 'grape']);
      fish(0, 6, 6 + bob(0), RIGHT, false); fish(1, 8, 6 + bob(1), LEFT, false);

      drawEnemy(mk('J', 3, 9 - ((t * .6) % 9), UP)); drawEnemy(mk('C', 16 - ((t * 1.8) % 19), 8.3, LEFT));
      fish(0, 6, 6, RIGHT, true); fish(1, 8, 6.2, LEFT, true);
      dark(.5);
      const open = Math.min(1, t * .8) * (Math.sin(time * .9) > .97 ? .1 : 1);
      glow(7.5, 11.7, 2.4, 'rgba(255,170,60,0.3)');
      ctx.fillStyle = 'rgba(255,196,70,0.95)'; ell(7.5, 11.7, 1.4, .55 * open); ctx.fill();
      ctx.fillStyle = '#140a02'; ell(7.5 + Math.sin(time * .7) * .45, 11.7, .13, .5 * open); ctx.fill();
      break;
    }
    case 'plan': {

      for (let i = 0; i < n; i++) coral(6 + i, 6);
      fish(0, 5, 6 + bob(0) * .3, RIGHT, false);
      drawEnemy(mk('C', 12 + Math.sin(t * 1.6) * .6, 6, LEFT));
      fish(1, 5 + (t % 5) * .9, 9.5, RIGHT, (t % 5) > 4.3);

      drawSeal({fx:14 - Math.min(t * 2.2, 5.4), fy:6.5 + bob(2) * .5, dir:LEFT, anim:time, shieldCd:0, happy:t > 2.5 ? 1 : 0});
      const pts = [];
      for (let k = 0; k <= 14; k++) { const s = k / 14; pts.push({x:-.2 + s * 2.4 + Math.sin(time * 1.5 + s * 4) * .25 * s, y:13.2 - s * 4}); }
      dark(.18); drawTentPath(pts, .8, .2);
      break;
    }
    case 'bruiser': {
      for (let x = 3; x <= 11; x++) if (x !== 7) coral(x, 8);
      drawEnemy(Object.assign(mk('K', 7 + Math.sin(t * .7) * 3.5, 4.4, Math.cos(t * .7) >= 0 ? RIGHT : LEFT), {sc:2.6}));

      for (const side of [-1, 1]) {
        const pts = [];
        for (let k = 0; k <= 14; k++) { const s = k / 14; pts.push({x:7.5 + side * (8 - s * 4.5), y:8.5 + Math.sin(time * 1.8 + s * 5 + side) * .5 * s}); }
        drawTentPath(pts, .7, .25);

      fish(0, 6.5, 7.3 + bob(0), RIGHT, false); fish(1, 8.5, 7.3 + bob(1), LEFT, false);
      drawSeal({fx:10.8, fy:9.3 + bob(2) * .5, dir:LEFT, anim:time, shieldCd:1, happy:1});
      drawEnemy(mk('K', 3.3, 9.6, RIGHT)); drawEnemy(mk('C', 12, 10.6, LEFT)); drawEnemy(mk('J', 2.3, 5, UP));
      if (Math.random() < .35) parts.push({x:Math.random() * COLS, y:-.2, vx:rand(-.3, .3), vy:rand(.8, 1.6), life:7, max:7, size:rand(.05, .09), kind:'spark', col:pick(['#f6c445', '#ff8fa3', '#7cc4f0', '#8fe0a0', '#ffffff']), delay:0, ph:0});

}

function drawParts() {
  for (const q of parts) {
    if (q.delay > 0) continue;
    const a = Math.min(1, q.life / q.max * 1.5);
    if (q.kind === 'amb' || q.kind === 'bub' || q.kind === 'vent') {
      const col = q.kind === 'vent' ? '255,215,170' : '220,250,255';
      ctx.strokeStyle = `rgba(${col},${(q.kind === 'amb' ? .35 : .7) * a})`; ctx.lineWidth = .018;
      circ(q.x, q.y, q.size); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${.5 * a})`; circ(q.x - q.size * .35, q.y - q.size * .35, q.size * .25); ctx.fill();
    } else if (q.kind === 'chip') {
      ctx.fillStyle = `rgba(255,150,145,${a})`; circ(q.x, q.y, q.size); ctx.fill();
    } else if (q.kind === 'ring') {
      ctx.strokeStyle = q.col; ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.lineWidth = .05; circ(q.x, q.y, q.size); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (q.kind === 'sand') {
      ctx.fillStyle = `rgba(230,210,160,${.8 * a})`; circ(q.x, q.y, q.size); ctx.fill();
    } else if (q.kind === 'steam') {
      ctx.fillStyle = `rgba(230,240,240,${.35 * q.life / q.max})`; circ(q.x, q.y, q.size); ctx.fill();
    } else {
      ctx.fillStyle = q.col || '#fff7c2'; ctx.globalAlpha = a; circ(q.x, q.y, q.size); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
}
