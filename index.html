}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}

.style{margin:14px auto 0;background:var(--chip);border-radius:16px;padding:14px 14px 4px;scrollbar-width:thin}

.style details[open] summary::before{transform:rotate(90deg)}
.style[hidden]{display:none}
.story{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(to top,rgba(2,18,28,.97),rgba(2,18,28,.97) 30%,rgba(2,18,28,.8) 65%,rgba(2,18,28,0));color:#eaf7f6}
.story[hidden]{display:none}
.story p{margin:0 0 10px;font-size:clamp(.9rem,2.3vw,1.08rem);line-height:1.5;min-height:4.5em;max-width:62ch}

/* One layout, scaled as a whole: the strip, the board and (on wide windows) the icon buttons are laid out once at the
   reference size (840 x 728 board under a 46 px strip) inside .scaled, which resize() scales to fit the window. The
   cards, the banner and the lab stay unscaled over it. */
.scaled{position:relative;width:840px;height:774px;transform-origin:0 0;overflow:hidden}
.scaled>canvas{display:block}
.scaled>.hud{position:relative;z-index:5;margin:0;height:46px;box-sizing:border-box;flex-wrap:nowrap;overflow:hidden;gap:6px;padding:0 10px;color:#e6f6f5;background:rgba(2,26,36,.85);font-size:.88rem}

.scaled>.hud .grp{flex-wrap:nowrap;min-width:0}.scaled>.hud .lvl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:1.05rem;color:var(--gold)}

.scaled>.hud .pips i{background:rgba(255,255,255,.3)}.scaled>.hud .pips i.on{background:var(--accent)}.scaled>.hud .pips i.done{background:rgba(255,255,255,.6)}.scaled>.hud .pips i.boss{background:#e8463a}

.stage.small .scaled>.hud .chip.sb{display:none}.stage.small .scaled>.hud .pips{gap:7px}.stage.small .scaled>.hud .pips i{width:13px;height:13px}

// ================= ad portal adapter =================
// Works with the Poki SDK or the CrazyGames SDK when one is loaded on the page, and does nothing otherwise.
let adMute = false;
const Ads = (() => {
  const poki = () => window.PokiSDK, cg = () => (window.CrazyGames && window.CrazyGames.SDK) || null;
  let ready = false, playing = false;
  const quiet = on => { adMute = on; if (typeof master !== 'undefined' && master && ac) master.gain.setTargetAtTime(on || muted ? 0 : .9, ac.currentTime, .05); };
  return {
    init() {
      try {
        if (poki()) poki().init().then(() => { ready = true; poki().gameLoadingFinished(); }).catch(() => {});
        else if (cg()) Promise.resolve(cg().init()).then(() => { ready = true; }).catch(() => {});
      } catch (e) {}
    },
    get ready() { return ready; },
    play() { if (playing) return; playing = true; try { if (poki()) poki().gameplayStart(); else if (cg()) cg().game.gameplayStart(); } catch (e) {} },
    stop() { if (!playing) return; playing = false; try { if (poki()) poki().gameplayStop(); else if (cg()) cg().game.gameplayStop(); } catch (e) {} },
    // an interstitial at a natural pause; the SDKs decide how often one actually shows
    break(done) {
      try {
        if (poki() && ready) { this.stop(); poki().commercialBreak(() => quiet(true)).then(() => { quiet(false); done(); }).catch(() => { quiet(false); done(); }); return; }
        if (cg() && ready) { this.stop(); cg().ad.requestAd('midgame', {adStarted: () => quiet(true), adFinished: () => { quiet(false); done(); }, adError: () => { quiet(false); done(); }}); return; }
      } catch (e) {}
      done();
    },
    canReward() { return ready && !!(poki() || cg()); },
    reward(done, fail) {
      try {
        if (poki() && ready) { this.stop(); poki().rewardedBreak(() => quiet(true)).then(ok => { quiet(false); ok ? done() : fail(); }).catch(() => { quiet(false); fail(); }); return; }
        if (cg() && ready) { this.stop(); cg().ad.requestAd('rewarded', {adStarted: () => quiet(true), adFinished: () => { quiet(false); done(); }, adError: () => { quiet(false); fail(); }}); return; }
      } catch (e) {}
      fail();
    },
  };
})();

const inb = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const hashi = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0);
const easeOutBack = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
const isBlock = (x, y) => inb(x, y) && S.grid[y][x] === 'c';
const dirOf = (dx, dy) => DLIST.find(d => d.x === dx && d.y === dy) || null;
const alive = () => S.players.filter(p => !p.dead);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const occupied = (x, y, except) => S.enemies.some(o => o !== except && ((o.x === x && o.y === y) || (o.tx === x && o.ty === y)));
const snackAt = (x, y, except) => S.snacks.some(s => s !== except && ((s.x === x && s.y === y) || (s.tx === x && s.ty === y)));
const playerAt = (x, y) => S.players.some(p => !p.dead && ((p.x === x && p.y === y) || (p.tx === x && p.ty === y)));
const tentAt = (x, y) => !!(S.boss && S.boss.tents && S.boss.tents.some(t => t.state !== 'warn' && t.cells.some((c, i) => c.x === x && c.y === y && i < Math.ceil(t.len))));
const friendAt = (x, y) => S.friends.some(n => (n.x === x && n.y === y) || (n.tx === x && n.ty === y));
const canPlace = (x, y) => inb(x, y) && S.grid[y][x] === '.' && S.floor[y][x] !== 'h' && !occupied(x, y, null) && !playerAt(x, y) && !friendAt(x, y) && !tentAt(x, y);
const hiddenP = p => S.floor[Math.round(p.fy)][Math.round(p.fx)] === 'k';
const visibleTo = e => alive().filter(p => !hiddenP(p) || Math.abs(p.fx - e.fx) + Math.abs(p.fy - e.fy) <= 1.1); // only a hunter on the next tile sees into the kelp

function makeActor(x, y) { return {x, y, fx:x, fy:y, tx:x, ty:y, moving:false, dir:DOWN, anim:Math.random() * 10}; }
function advance(a, speed, dt) {
  const dx = a.tx - a.fx, dy = a.ty - a.fy, d = Math.abs(dx) + Math.abs(dy), s = speed * dt;
  if (s >= d) { a.fx = a.tx; a.fy = a.ty; a.x = a.tx; a.y = a.ty; a.moving = false; return dt - d / speed; }
  a.fx += Math.sign(dx) * s; a.fy += Math.sign(dy) * s; return -1;
}

// ================= level flow =================
function loadLevel(i, retry) {
  persist();
  hideStyle();
  levelIdx = i;
  if (autoTrack) setTrack(trackForLevel(i));
  const L = LEVELS[i];
  const grid = [], floor = [], born = [], wavePos = [[], [], [], []], enemies = [], urchins = new Map(), friends = [], bossTiles = new Set();
  const starts = [null, null];
  for (let y = 0; y < ROWS; y++) {
    grid.push([]); floor.push([]); born.push([]);
    for (let x = 0; x < COLS; x++) {
      const ch = (L.map[y] || '')[x] || '#';
      let g = '.', f = '';
      if (ch === '#') g = '#';
      else if (ch === 'c') { g = 'c'; born[y][x] = -9; }
      else if (ch >= '1' && ch <= '4') wavePos[ch.charCodeAt(0) - 49].push({x, y});
      else if (ch === 'P') starts[0] = {x, y};
      else if (ch === 'Q') starts[1] = {x, y};
      else if (ch === 'h' || ch === 'k' || 'UDLR'.includes(ch)) f = ch;
      else if (ch === 'N') friends.push(makeFriend(x, y));
      else if (ch === 'B') { if (L.boss === 'queen') { g = '#'; bossTiles.add(y * COLS + x); } else enemies.push(makeEnemy('K', x, y)); }
      else if (ch === 'x') { f = 'x'; urchins.set(y * COLS + x, {x, y, armed:true, cov:false, rearm:0}); }
      else if (ESPEED[ch]) enemies.push(makeEnemy(ch, x, y));
      grid[y].push(g); floor[y].push(f);
    }
  }
  const players = [];
  const count = twoP ? 2 : 1;
  for (let k = 0; k < count; k++) {
    const st = starts[k] || starts[0];
    const p = makeActor(st.x, st.y);
    const who = twoP ? (k ? 'milli' : 'killi') : (save.pick === 'milli' ? 'milli' : 'killi');
    Object.assign(p, {id:who === 'milli' ? 1 : 0, fish:getFish(who), sx:st.x, sy:st.y, face:DOWN, puff:0, puffCd:0, dead:false, deathT:0, inv:0, score:0, points:0, streak:0, lastGet:-9, held:[], bufAct:false, bufPuff:false});
    players.push(p);
  }
  S = {grid, floor, born, urchins, enemies, friends, bossTiles, boss:null, catches:0, players, snacks:[], popups:[], wavePos, waves:L.waves.slice(0, wavePos.filter(w => w.length).length),
       wave:-1, readyT: retry ? 1.0 : 1.9, failT:0, elapsed:0, vents:[], ventT:0};
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (floor[y][x] === 'h') S.vents.push({x, y});
  S.unlocksAtStart = new Set(unlockedSet());
  if (L.boss) setupBoss(L); else nextWave(true);
  mode = 'play';
  overlay.hidden = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  buildHudPlayers();
  showBanner(retry ? 'Try again' : `${i + 1}. ${L.name}`, retry ? L.name : L.hint);
  stage.classList.remove('fresh'); void stage.offsetWidth; stage.classList.add('fresh'); // restart the fade-in
}

function makeFriend(x, y) {
  const n = makeActor(x, y);
  Object.assign(n, {kind:'N', name:'Niko', speed:3.4, shieldCd:0, dir:pick(DLIST), wait:0});
  return n;
}
function makeEnemy(k, x, y) {
  const e = makeActor(x, y);
  Object.assign(e, {kind:k, speed:ESPEED[k], stun:0, chew:0, chewT:null, punch:0, punchFx:0, windup:0, daze:0, charge:false, dir:pick(DLIST), trail:[],
    state:'buried', t:1 + Math.random(), ph:'calm', ft:1.5 + Math.random() * 2});
  for (let i = 0; i < 9; i++) e.trail.push({x:x - e.dir.x * i * .14, y:y - e.dir.y * i * .14});
  return e;
}

function nextWave(silent) {
  S.wave++;
  if (S.wave >= S.waves.length) { levelWon(); return; }
  const type = S.waves[S.wave];
  S.wavePos[S.wave].forEach((p, i) => {
    const s = makeActor(p.x, p.y);
    Object.assign(s, {type, born: time + i * 0.05 + (silent ? 0 : 0.25), wait:rand(0, .5), t:rand(2.5, 5), open:Math.random() < .5, ct:rand(.3, 2), lid:0});
    S.snacks.push(s);
  });
  if (!silent) {
    sfx('wave');
    for (const p of S.players) if (p.dead) revive(p);
  }
}

function revive(p) {
  if (isBlock(p.sx, p.sy)) breakBlock(p.sx, p.sy, 0);
  Object.assign(p, {x:p.sx, y:p.sy, fx:p.sx, fy:p.sy, tx:p.sx, ty:p.sy, moving:false, dead:false, deathT:0, inv:INV_T, puff:0, shield:false});
  sfx('revive', {x:p.sx});
  ring(p.sx + .5, p.sy + .5, '#fff4b8');
}

function levelWon() {
  mode = 'won'; Ads.stop();
  sfx('win');
  const before = S.unlocksAtStart || new Set(unlockedSet());
  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, levelIdx + 2));
  const key = `${twoP ? 2 : 1}-${levelIdx}`, secs = +S.elapsed.toFixed(1);
  const prev = save.best[key];
  const isBest = !prev || secs < prev;
  if (isBest) save.best[key] = secs;
  const stars = S.catches === 0 ? 3 : S.catches <= 2 ? 2 : 1;
  const total = S.players.reduce((a, p) => a + p.points, 0), prevScore = save.scores[key] || 0, bestScore = total > prevScore;
  if (bestScore) save.scores[key] = total;
  save.stars[key] = Math.max(save.stars[key] || 0, stars);
  persist();
  const fresh = unlockedSet().filter(id => !before.has(id));
  const unlockRow = fresh.length ? `<div class="unlocked"><b>New for your fish</b>${fresh.map(itemName).join(', ')}<button class="btn ghost" data-act="fish">Try it on</button></div>` : '';

  card.innerHTML = `<h3>${last ? 'The whole reef is clear' : 'Reef cleared'}</h3>${starRow}
    ${board}${scores}
    <p>${S.catches === 0 ? 'Nobody got caught.' : `Caught ${S.catches} ${S.catches === 1 ? 'time' : 'times'}.`}</p>${unlockRow}

  }

      <button class="btn ghost" data-act="fish">${twoP ? 'Customize your fish' : 'Choose your fish'}</button>
    </div>
    <div class="levels">${LEVELS.map((L, i) => {
      const b = save.best[`${twoP ? 2 : 1}-${i}`];
      const locked = i >= save.unlocked;
      const st = save.stars[`${twoP ? 2 : 1}-${i}`] || 0, sc = save.scores[`${twoP ? 2 : 1}-${i}`];
      return `<button class="lv" data-lv="${i}" ${locked ? 'disabled' : ''}><b>${i + 1}</b><span>${L.boss ? 'Boss: ' : ''}${L.name}<small>${locked ? 'Locked' : b ? `<i class="st">${'★'.repeat(st)}<em>${'★'.repeat(3 - st)}</em></i> ${fmtTime(b)}${sc ? `, ${sc.toLocaleString()} pts` : ''}` : 'Not cleared yet'}</small></span></button>`;
    }).join('')}</div>
    <div class="row"><button class="btn ghost" data-act="story">Story</button><button class="btn ghost" data-act="style">Look and sound</button><button class="btn ghost" data-act="help">Controls</button></div>`;
  overlay.hidden = false;
  hideStyle();
  buildHudPlayers();
  updateKeysHelp();
}

function offerContinue() {
  S.offeredContinue = true; mode = 'fail'; Ads.stop();
  card.innerHTML = `<h3>Caught</h3><p>Keep going from here, with the snacks and score you have, or start the reef over.</p>
    <div class="row"><button class="btn" data-act="continue">Watch an ad to continue</button><button class="btn ghost" data-act="retry">Start over</button></div>`;
  overlay.hidden = false;
}
function continueLevel() {
  for (const p of S.players) if (p.dead) revive(p);
  S.failT = 0; mode = 'play'; overlay.hidden = true; Ads.play();
}
function pause() {
  if (mode !== 'play') return;
  mode = 'paused'; Ads.stop();
  card.innerHTML = `<h3>Paused</h3><p class="help">${keysEl.innerHTML}</p><div class="row"><button class="btn" data-act="resume">Resume</button><button class="btn ghost" data-act="retry">Restart</button><button class="btn ghost" data-act="menu">Levels</button></div>`;
  overlay.hidden = false;
}
function resume() { if (mode !== 'paused') return; mode = 'play'; overlay.hidden = true; for (const p of S.players) p.held.length = 0; if (S.readyT <= 0) Ads.play(); }
function showBanner(t, s) { banner.innerHTML = `<b>${t}</b>${s}`; banner.hidden = false; }
function hideBanner() { banner.hidden = true; }

card.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  unlockAudio(); sfx('click');
  if (b.dataset.mode) { twoP = b.dataset.mode === '2'; showMenu(); return; }
  if (b.dataset.lv) { startLevel(+b.dataset.lv); return; }
  const a = b.dataset.act;
  if (a === 'style') { openStyle(); return; }
  if (a === 'help') { showControls(); return; }
  if (a === 'fish') { fishEdit = twoP ? 'killi' : (save.pick === 'milli' ? 'milli' : 'killi'); showFish(); return; }
  if (a === 'fishdone') { showMenu(); return; }
  if (a === 'fishreset') { save.fish = save.fish || {}; delete save.fish[fishEdit]; persist(); showFish(); return; }
  if (b.dataset.pick) { save.pick = b.dataset.pick; fishEdit = b.dataset.pick; persist(); showFish(); return; }
  if (b.dataset.edit) { fishEdit = b.dataset.edit; showFish(); return; }
  if (b.dataset.fcolor || b.dataset.fpattern || b.dataset.facc) {
    save.fish = save.fish || {}; const cfg = {...fishCfg(fishEdit)};
    if (b.dataset.fcolor) cfg.color = b.dataset.fcolor;
    if (b.dataset.fpattern) cfg.pattern = b.dataset.fpattern;
    if (b.dataset.facc) cfg.acc = b.dataset.facc;
    save.fish[fishEdit] = cfg; persist(); showFish(); return;
  }
  if (a === 'story') { playStory('intro', showMenu); return; }
  if (a === 'next') startLevel(levelIdx + 1);
  else if (a === 'retry') Ads.break(() => loadLevel(levelIdx));
  else if (a === 'continue') Ads.reward(continueLevel, () => loadLevel(levelIdx, true));
  else if (a === 'menu') showMenu();
  else if (a === 'resume') resume();
});

// ================= simulation =================
function update(dt) {
  updateParts(dt);
  if (mode === 'story' && story) { story.chars += dt * 48; return; }
  if (mode === 'style' && S) {
    for (const p of S.players) updatePlayer(p, dt);
    updateUrchins(dt); updateSnacks(dt);
    for (const e of S.enemies) updateEnemy(e, dt);
    for (const n of S.friends) updateFriend(n, dt);
    friendCheck();
    return;
  }
  if (mode === 'won' && S && S.wonT > 0) { S.wonT -= dt; if (S.wonT <= 0) overlay.hidden = false; }
  if (mode !== 'play' || !S) return;
  if (S.readyT > 0) { S.readyT -= dt; if (S.readyT <= 0) { hideBanner(); Ads.play(); } return; }
  if (S.failT > 0) {
    S.failT -= dt;
    for (const p of S.players) if (p.deathT > 0) p.deathT -= dt;
    if (S.failT <= 0) {
      if (Ads.canReward() && !S.offeredContinue) offerContinue();
      else loadLevel(levelIdx, true);
    }
    return;
  }
  S.elapsed += dt;
  updateVents(dt);
  for (const q of S.popups) q.t += dt;
  S.popups = S.popups.filter(q => q.t < 1);
  for (const p of S.players) updatePlayer(p, dt);
  updateUrchins(dt);
  updateSnacks(dt);
  const calm = S.boss && S.boss.dead;
  for (const e of S.enemies) if (!calm || e.kind === 'K') updateEnemy(e, dt);
  for (const n of S.friends) updateFriend(n, dt);
  updateBoss(dt);
  if (mode !== 'play' || (S.boss && S.boss.dead)) return;
  collide();
  tentCollide();
  friendCheck();
  hazardCheck();
  collectCheck();
  if (mode === 'play' && S.failT <= 0 && S.players.every(p => p.dead)) S.failT = 1.6;
}

function updatePlayer(p, dt) {
  p.anim += dt;
  if (p.dead) { if (p.deathT > 0) p.deathT -= dt; return; }
  if (p.inv > 0) p.inv -= dt;
  if (p.puffCd > 0) p.puffCd = Math.max(0, p.puffCd - dt);
  if (p.puff > 0) { p.puff = Math.max(0, p.puff - dt); return; }
  const hid = hiddenP(p); if (hid && !p.inKelp) sfx('rustle', {x:p.fx, p:p.id}); p.inKelp = hid;
  const h = p.held.length ? DIRS[p.held[p.held.length - 1]] : null;
  if (h) p.face = h;
  // puff right away, even between cells; coral waits for the next cell so it grows from where the fish stands
  if (p.bufPuff) { p.bufPuff = false; if (p.puffCd <= 0) { startPuff(p); return; } sfx('bonk', {x:p.fx, p:p.id}); }
  // turning back mid-tile reverses at once instead of finishing the tile first
  if (p.moving && h && h.x === -(p.tx - p.x) && h.y === -(p.ty - p.y)) { p.tx = p.x; p.ty = p.y; }
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!p.moving) {
      if (p.bufAct) { p.bufAct = false; coralAction(p); }
      p.drift = false;
      if (h) { const nx = p.x + h.x, ny = p.y + h.y; if (inb(nx, ny) && S.grid[ny][nx] === '.') { p.tx = nx; p.ty = ny; p.moving = true; } }
      else { const cur = CUR[S.floor[p.y][p.x]]; if (cur) { const nx = p.x + cur.x, ny = p.y + cur.y; if (inb(nx, ny) && S.grid[ny][nx] === '.') { p.tx = nx; p.ty = ny; p.moving = true; p.drift = true; } } } // a current carries an idle fish
      if (!p.moving) break;
    }
    const left = advance(p, p.drift ? PSPEED * .45 : PSPEED, rem);
    if (left < 0) break;
    rem = left;
  }
}

function startPuff(p) {
  p.puff = PUFF_T; p.puffCd = PUFF_CD + PUFF_T;
  sfx('puff', {x:p.fx, p:p.id});
  for (const e of S.enemies) if (Math.hypot(e.fx - p.fx, e.fy - p.fy) < 1.7) stunEnemy(e);
  ring(p.fx + .5, p.fy + .5, 'rgba(255,250,220,0.9)');
}
// Hot vents erupt together every few seconds: a bright warning glow, then a burst of steam that stuns any creature
// standing on one (the fish are too light to mind). Lead a crab across a vent and time it.
const VENT_PERIOD = 4.5, VENT_WARN = .8;
function updateVents(dt) {
  if (!S.vents.length) return;
  S.ventT += dt;
  if (S.ventT < VENT_PERIOD) return;
  S.ventT = 0;
  let any = false;
  for (const v of S.vents) {
    if (S.grid[v.y][v.x] === '.') { steam(v.x, v.y, 0, true); any = true; }
    for (const e of S.enemies) if (!FLY[e.kind] && e.kind !== 'K' && Math.abs(e.fx - v.x) < .55 && Math.abs(e.fy - v.y) < .55) stunEnemy(e, STUN_T * .8);
  }
  if (any) sfx('vent', {x:7});
}
function stunEnemy(e, t) { if (e.kind === 'K') return; e.stun = t || STUN_T; e.chew = 0; e.chewT = null; e.punch = 0; e.windup = 0; e.charge = false; if (e.kind === 'F') { e.ph = 'calm'; e.ft = 3.2; } }
const harmless = e => (e.kind === 'Y' && e.state !== 'hunt') || (e.kind === 'K' && (e.crash > 0 || S.boss.dead));

function coralAction(p) {
  let dir = p.face, x = p.x + dir.x, y = p.y + dir.y, i = 0, g = 0;
  if (isBlock(x, y)) {
    while (isBlock(x, y) && g++ < 80) { breakBlock(x, y, i * 0.03); i++; const f = S.floor[y][x]; if (CUR[f]) { dir = CUR[f]; ring(x + .5, y + .5, 'rgba(190,250,255,0.8)'); } x += dir.x; y += dir.y; }
    sfx('break', {x:p.fx, p:p.id, n:i});
  } else if (canPlace(x, y)) {
    while (canPlace(x, y) && g++ < 80) { S.grid[y][x] = 'c'; S.born[y][x] = time + i * 0.03; i++; const f = S.floor[y][x]; if (CUR[f]) { dir = CUR[f]; ring(x + .5, y + .5, 'rgba(190,250,255,0.8)'); } x += dir.x; y += dir.y; }
    sfx('grow', {x:p.fx, p:p.id, n:i});
    if (inb(x, y) && S.floor[y][x] === 'h' && S.grid[y][x] === '.') { steam(x, y, i * 0.03, true); sfx('vent', {x, p:p.id}); }
  } else {
    if (inb(x, y) && S.floor[y][x] === 'h') { steam(x, y, 0, true); sfx('vent', {x, p:p.id}); }
    sfx('bonk', {x:p.fx, p:p.id});
  }
}

function breakBlock(x, y, delay) {
  S.grid[y][x] = '.';
  for (let k = 0; k < 7; k++) parts.push({x:x + .5, y:y + .4, vx:rand(-1.8, 1.8), vy:rand(-2.2, .4), life:.6, max:.6, size:rand(.05, .11), kind:'chip', delay, ph:0});
}

function updateUrchins(dt) {
  for (const u of S.urchins.values()) {
    if (S.grid[u.y][u.x] === 'c') { u.cov = true; u.armed = false; continue; }
    if (u.cov) { u.cov = false; u.rearm = 3; }
    if (u.rearm > 0) { u.rearm -= dt; if (u.rearm <= 0) { u.armed = true; u.rearm = 0; } }
  }
}

function snackFree(s, x, y) {
  return inb(x, y) && S.grid[y][x] === '.' && S.floor[y][x] !== 'x' && !occupied(x, y, null) && !snackAt(x, y, s);
}
function randomOpenTile() {
  const ap = alive();
  for (let k = 0; k < 80; k++) {
    const x = 1 + ((Math.random() * (COLS - 2)) | 0), y = 1 + ((Math.random() * (ROWS - 2)) | 0);
    if (!snackFree(null, x, y)) continue;
    if (ap.some(p => Math.abs(p.fx - x) + Math.abs(p.fy - y) < 2)) continue;
    return {x, y};
  }
  return null;
}

function updateSnacks(dt) {
  const ap = alive();
  const distTo = (x, y) => ap.length ? Math.min(...ap.map(p => Math.abs(p.fx - x) + Math.abs(p.fy - y))) : 99;
  for (const s of S.snacks) {
    s.anim += dt;
    if (time < s.born) continue;
    const enc = S.grid[Math.round(s.fy)][Math.round(s.fx)] === 'c';
    if (s.type === 'shrimp') {
      if (s.moving) { advance(s, 2.7, dt); continue; }
      if (enc) continue;
      if (s.wait > 0) { s.wait -= dt; continue; }
      const opts = DLIST.filter(d => snackFree(s, s.x + d.x, s.y + d.y));
      if (!opts.length) { s.wait = .3; continue; }
      const here = distTo(s.x, s.y);
      let d = null;
      if (here > 5) { if (Math.random() < .5) { s.wait = rand(.3, .9); continue; } d = pick(opts); }
      else {
        let best = -1;
        for (const o of opts) { const v = distTo(s.x + o.x, s.y + o.y) + Math.random() * .01; if (v > best) { best = v; d = o; } }
        if (best <= here) { s.wait = .2; continue; }
      }
      s.dir = d; s.tx = s.x + d.x; s.ty = s.y + d.y; s.moving = true; s.wait = rand(.03, .15);
    } else if (s.type === 'clam') {
      s.ct -= dt;
      if (s.ct <= 0) { s.open = !s.open; s.ct = s.open ? 2.2 : 1.6; }
      s.lid += ((s.open ? 1 : 0) - s.lid) * Math.min(1, dt * 10);
    } else if (s.type === 'moon') {
      s.t -= dt;
      if (s.t <= 0) {
        s.t = rand(3.5, 5.5);
        if (enc) continue;
        const spot = randomOpenTile();
        if (spot) {
          sparkle(s.fx + .5, s.fy + .5, '#cfe3ff');
          s.x = s.tx = s.fx = spot.x; s.y = s.ty = s.fy = spot.y; s.born = time;
          sfx('blink', {x:spot.x});
        }
      }
    }
  }
}

function updateEnemy(e, dt) {
  e.anim += dt;
  if (e.kind === 'K') {
    if (S.boss.dead) return;
    if (e.crash > 0) { e.crash -= dt; return; }
    if (e.ccd > 0) e.ccd -= dt;
  }
  if (e.punchFx > 0) e.punchFx -= dt;
  if (e.stun > 0) { e.stun -= dt; return; }
  if (e.windup > 0) { e.windup -= dt; return; }
  if (e.daze > 0) { e.daze -= dt; return; }
  if (e.chew > 0) {
    e.chew -= dt;
    if (e.chew <= 0 && e.chewT) { if (isBlock(e.chewT.x, e.chewT.y)) { breakBlock(e.chewT.x, e.chewT.y, 0); sfx('break', {x:e.fx}); } e.chewT = null; }
    return;
  }
  if (e.punch > 0) { e.punch -= dt; if (e.punch <= 0) punchLine(e); return; }
  if (e.kind === 'Y') {
    if (e.state === 'buried') {
      e.t -= dt;
      if (e.t <= 0 && visibleTo(e).some(p => Math.hypot(p.fx - e.fx, p.fy - e.fy) < 2.3)) {
        e.state = 'rising'; e.t = .55; sfx('rise', {x:e.fx});
        for (let i = 0; i < 10; i++) parts.push({x:e.fx + .5 + rand(-.3, .3), y:e.fy + .7, vx:rand(-1.2, 1.2), vy:-rand(.5, 1.6), life:.6, max:.6, size:rand(.04, .08), kind:'sand', delay:0, ph:0});
      }
      return;
    }
    if (e.state === 'rising') { e.t -= dt; if (e.t <= 0) { e.state = 'hunt'; e.t = 5; } return; }
    if (e.state === 'burrow') { e.t -= dt; if (e.t <= 0) { e.state = 'buried'; e.t = 3; } return; }
    e.t -= dt;
    if (e.t <= 0 && !e.moving) { e.state = 'burrow'; e.t = .6; return; }
  }
  if (e.kind === 'F') {
    e.ft -= dt;
    if (e.ft <= 0) {
      if (e.ph === 'calm') { e.ph = 'warn'; e.ft = .6; }
      else if (e.ph === 'warn') { e.ph = 'flare'; e.ft = 1.2; sfx('flare', {x:e.fx}); }
      else { e.ph = 'calm'; e.ft = 3.2; }
    }
    if (e.ph !== 'calm' && !e.moving) return;
  }
  const speed = e.kind === 'S' && e.charge ? 8.5 : e.kind === 'K' ? (e.charge ? 9.5 : e.speed * (1 + (S.boss.max - S.boss.hp) * .12)) : e.speed;
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!e.moving) { decide(e); if (!e.moving) break; }
    const left = advance(e, speed, rem);
    if (left < 0) break;
    rem = left;
  }
  if (e.kind === 'E') {
    const last = e.trail[0];
    if (Math.hypot(e.fx - last.x, e.fy - last.y) > 0.14) { e.trail.unshift({x:e.fx, y:e.fy}); if (e.trail.length > 9) e.trail.pop(); }
  }
}

function punchLine(e) {
  let x = e.x + e.dir.x, y = e.y + e.dir.y, i = 0;
  while (isBlock(x, y) && i < 20) { breakBlock(x, y, i * 0.025); x += e.dir.x; y += e.dir.y; i++; }
  e.punchFx = .3;
  sfx('punch', {x:e.fx, n:i}); addShake(.2);
  ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(255,240,200,0.9)');
}

function sharkSight(e) {
  const ap = visibleTo(e);
  for (const d of DLIST) {
    let x = e.x, y = e.y;
    for (let k = 0; k < 13; k++) {
      x += d.x; y += d.y;
      if (!inb(x, y) || S.grid[y][x] === '#') break;
      if (ap.some(p => Math.round(p.fx) === x && Math.round(p.fy) === y)) return d;
    }
  }
  return null;
}

function lineOfSight(e, max) {
  const ap = visibleTo(e);
  for (const d of DLIST) {
    let x = e.x, y = e.y;
    for (let k = 0; k < max; k++) {
      x += d.x; y += d.y;
      if (!inb(x, y) || S.grid[y][x] !== '.') break;
      if (ap.some(p => Math.round(p.fx) === x && Math.round(p.fy) === y)) return d;
    }
  }
  return null;
}

function decide(e) {
  const free = d => {
    const x = e.x + d.x, y = e.y + d.y;
    if (!inb(x, y)) return false;
    const t = S.grid[y][x];
    if (t === '#') return false;
    if (!FLY[e.kind] && (t === 'c' || snackAt(x, y, null))) return false;
    return !occupied(x, y, e);
  };
  // a current carries any walking or swimming creature along; flyers and Bruiser are too big or too high for it
  const cur = CUR[S.floor[e.y][e.x]];
  if (cur && !FLY[e.kind] && e.kind !== 'K' && free(cur)) { e.dir = cur; e.tx = e.x + cur.x; e.ty = e.y + cur.y; e.moving = true; return; }
  let d = null;
  if (e.kind === 'K') {
    if (e.charge) {
      const nx = e.x + e.dir.x, ny = e.y + e.dir.y;
      if (!inb(nx, ny) || S.grid[ny][nx] === '#') {
        e.charge = false; e.daze = .5; e.ccd = 1.4; sfx('thud', {x:e.fx}); addShake(.2);
        ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(220,240,255,0.8)'); return;
      }
      if (S.grid[ny][nx] === 'c') {
        breakBlock(nx, ny, 0); e.charge = false; e.crash = 2.6; e.ccd = 1.6;
        sfx('crash', {x:e.fx}); addShake(.4); ring(e.fx + .5 + e.dir.x * .6, e.fy + .5 + e.dir.y * .6, 'rgba(255,240,200,0.95)'); return;
      }
      d = e.dir;
    } else if (e.ccd <= 0) {
      const los = sharkSight(e);
      if (los) { e.dir = los; e.charge = true; e.windup = Math.max(.35, .75 - (S.boss.max - S.boss.hp) * .1); e.ccd = 99; sfx('roar', {x:e.fx}); return; }
    }
  }
  if (e.kind === 'A') {
    if (free(e.dir)) d = e.dir;
    else {
      const side = DLIST.filter(o => o.x !== e.dir.x && o.y !== e.dir.y && o.x !== -e.dir.x && o.y !== -e.dir.y && free(o));
      const back = {x:-e.dir.x, y:-e.dir.y};
      d = side.length ? pick(side) : (free(back) ? DLIST.find(o => o.x === back.x && o.y === back.y) : null);
      if (!d) return;
    }
  }
  if (e.kind === 'S') {
    if (e.charge) {
      if (free(e.dir)) d = e.dir;
      else { e.charge = false; e.daze = .7; sfx('thud', {x:e.fx}); addShake(.15); ring(e.fx + .5 + e.dir.x * .5, e.fy + .5 + e.dir.y * .5, 'rgba(220,240,255,0.8)'); return; }
    } else {
      const los = lineOfSight(e, 8);
      if (los) { e.dir = los; e.charge = true; e.windup = .45; sfx('charge', {x:e.fx}); return; }
    }
  }
  if (!d && (e.kind === 'E' || e.kind === 'O' || e.kind === 'M' || e.kind === 'Y' || e.kind === 'K') && Math.random() > 0.1) {
    const s = bfsStep(e, e.kind === 'O' || e.kind === 'M');
    if (s) {
      const nx = e.x + s.x, ny = e.y + s.y;
      if (e.kind !== 'E' && isBlock(nx, ny)) {
        e.dir = s;
        if (e.kind === 'O') { e.chew = .8; e.chewT = {x:nx, y:ny}; } else e.punch = .55;
        return;
      }
      if (free(s)) d = s;
    }
  }
  if (!d) {
    const opts = DLIST.filter(free);
    if (!opts.length) return;
    const keep = e.kind === 'J' ? .72 : .9;
    if (free(e.dir) && Math.random() < keep) d = e.dir;
    else { const nr = opts.filter(o => !(o.x === -e.dir.x && o.y === -e.dir.y)); d = pick(nr.length ? nr : opts); }
  }
  e.dir = d; e.tx = e.x + d.x; e.ty = e.y + d.y; e.moving = true;
}

function bfsStep(e, throughBlocks, targets) {
  const goals = new Set((targets || visibleTo(e)).map(p => Math.round(p.fy) * COLS + Math.round(p.fx)));
  const start = e.y * COLS + e.x;
  if (!goals.size || goals.has(start)) return null;
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  prev[start] = start;
  const q = [start];
  let found = -1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (goals.has(c)) { found = c; break; }
    const cx = c % COLS, cy = (c / COLS) | 0;
    for (const d of DLIST) {
      const nx = cx + d.x, ny = cy + d.y;
      if (!inb(nx, ny)) continue;
      const t = S.grid[ny][nx];
      if (t === '#' || (t === 'c' && !throughBlocks)) continue;
      const ni = ny * COLS + nx;
      if (prev[ni] !== -1) continue;
      prev[ni] = c; q.push(ni);
    }
  }
  if (found < 0) return null;
  let c = found;
  while (prev[c] !== start) c = prev[c];
  return dirOf(c % COLS - e.x, ((c / COLS) | 0) - e.y);
}

function collide() {
  for (const p of S.players) {
    if (p.dead) continue;
    for (const e of S.enemies) {
      const d = Math.hypot(e.fx - p.fx, e.fy - p.fy);
      if (e.kind === 'K') {
        if (S.boss.dead) continue;
        if (e.crash > 0) { if (p.puff > 0 && d < 1.7) bossHit(p); continue; }
        if (p.puff > 0 || p.inv > 0) continue;
        if (d < .8) { hurt(p, e); break; }
        continue;
      }
      if (harmless(e)) continue;
      if (p.puff > 0) { if (d < 1.3 && e.stun <= 0) { stunEnemy(e); sfx('stun', {x:e.fx}); } continue; }
      if (p.inv > 0 || e.stun > 0) continue;
      if (d < (e.kind === 'F' && e.ph === 'flare' ? 1.3 : .62)) { hurt(p, e); break; }
    }
  }
}

function setupBoss(L) {
  if (L.boss === 'shark') {
    const e = S.enemies.find(o => o.kind === 'K');
    e.crash = 0; e.ccd = 2;
    S.boss = {kind:'shark', name:'Bruiser', hp:4, max:4, e, hurtT:0, hitCd:0, dying:0, dead:false};
  } else {
    S.boss = {kind:'queen', name:'Kraken Queen', hp:6, max:6, tents:[], spawnT:2.4, hurtT:0, hitCd:0, dying:0, dead:false, cx:7.5, cy:1.6};
  }
}

function award(p, pts, x, y, hot) {
  p.points += pts;
  S.popups.push({x, y, text:`+${pts}`, col:hot ? '#ffd166' : p.fish.tag, t:0, big:pts >= 100});
  hudCache.flash = time;
}

function bossHit(p) {
  const B = S.boss;
  if (!B || B.dead || B.hitCd > 0) return;
  B.hp--; B.hurtT = .5; B.hitCd = .6;
  if (p) award(p, BOSS_HIT_PTS + (B.hp <= 0 ? BOSS_WIN_PTS : 0), p.fx + .5, p.fy - .2, true);
  sfx('bosshit'); addShake(.4);
  for (const p of S.players) if (p.dead) revive(p);
  if (B.kind === 'shark') {
    const e = B.e; e.crash = 0; e.daze = .9; e.ccd = 1.2; e.charge = false;
    ring(e.fx + .5, e.fy + .45, 'rgba(255,240,200,0.95)'); sparkle(e.fx + .5, e.fy + .45, '#fff3b0');
  }
  if (B.hp <= 0) { B.dead = true; B.dying = 2.2; sfx('bossdown'); for (const t of B.tents || []) t.state = 'back'; }
}

function updateBoss(dt) {
  const B = S.boss;
  if (!B) return;
  if (B.hurtT > 0) B.hurtT -= dt;
  if (B.hitCd > 0) B.hitCd -= dt;
  if (B.kind === 'queen') updateTents(dt);
  if (B.dead) { B.dying -= dt; if (B.dying <= 0 && mode === 'play') levelWon(); return; }
  if (B.kind === 'queen') {
    B.spawnT -= dt;
    const active = B.tents.filter(t => t.state !== 'back').length;
    if (B.spawnT <= 0 && active < (B.hp <= 3 ? 2 : 1)) { spawnTent(); B.spawnT = B.hp <= 3 ? 1.7 : 2.6; }
  }
}

function spawnTent() {
  const B = S.boss, ap = alive();
  if (!ap.length) return;
  const p = pick(ap), px = Math.round(p.fx), py = Math.round(p.fy);
  const used = new Set(B.tents.map(t => t.key));
  const lane = type => {
    let sx, sy, d;
    if (type === 'row') { if (p.fx >= 7) { sx = 1; d = RIGHT; } else { sx = COLS - 2; d = LEFT; } sy = py; }
    else { sx = px; sy = ROWS - 2; d = UP; }
    const key = type + (type === 'row' ? sy : sx);
    if (used.has(key) || !inb(sx, sy) || S.grid[sy][sx] === '#') return null;
    const cells = [];
    let x = sx, y = sy;
    while (inb(x, y) && S.grid[y][x] !== '#') { cells.push({x, y}); x += d.x; y += d.y; }
    if (cells.length < 3) return null;
    return {key, d, cells, len:0, state:'warn', t:.9, stuckAt:-1, wig:Math.random() * 6};
  };
  const first = Math.random() < .5 ? 'row' : 'col';
  const t = lane(first) || lane(first === 'row' ? 'col' : 'row');
  if (t) { B.tents.push(t); sfx('warn', {x:t.cells[0].x}); }
}

function updateTents(dt) {
  const B = S.boss;
  for (const t of B.tents) {
    t.wig += dt;
    if (t.state === 'warn') { t.t -= dt; if (t.t <= 0) { t.state = 'out'; sfx('lash', {x:t.cells[0].x}); } }
    else if (t.state === 'out') {
      const from = Math.floor(t.len);
      t.len = Math.min(t.cells.length, t.len + dt * 13);
      for (let i = from; i < Math.ceil(t.len); i++) {
        const c = t.cells[i];
        if (S.grid[c.y][c.x] === 'c') { t.len = i; t.stuckAt = i; t.state = 'stuck'; t.t = 2.6; sfx('stuck', {x:c.x}); addShake(.15); break; }
      }
      if (t.state === 'out' && t.len >= t.cells.length) { t.state = 'hold'; t.t = .35; }
    } else if (t.state === 'hold') { t.t -= dt; if (t.t <= 0) t.state = 'back'; }
    else if (t.state === 'stuck') {
      t.t -= dt;
      if (t.t <= 0) { const c = t.cells[t.stuckAt]; if (isBlock(c.x, c.y)) { breakBlock(c.x, c.y, 0); sfx('break', {x:c.x}); } t.state = 'back'; }
    } else if (t.state === 'back') t.len -= dt * 10;

  B.tents = B.tents.filter(t => !(t.state === 'back' && t.len <= 0));
}

function tentEnds(t) {
  const bx = t.cells[0].x + .5 - t.d.x * .5, by = t.cells[0].y + .5 - t.d.y * .5;
  return {bx, by, tx:bx + t.d.x * t.len, ty:by + t.d.y * t.len};
}

function tentCollide() {
  const B = S.boss;
  if (!B || B.kind !== 'queen' || B.dead) return;
  for (const t of B.tents) {
    if (t.state === 'warn' || t.state === 'back') continue;
    const {bx, by, tx, ty} = tentEnds(t);
    for (const p of S.players) {
      if (p.dead) continue;
      const cx = p.fx + .5, cy = p.fy + .5;
      if (t.state === 'stuck') {
        if (p.puff > 0 && Math.hypot(cx - tx, cy - ty) < 1.6) { bossHit(p); t.state = 'back'; return; }
        continue;
      }
      if (p.puff > 0 || p.inv > 0) continue;
      const along = (cx - bx) * t.d.x + (cy - by) * t.d.y, perp = Math.abs((cx - bx) * t.d.y - (cy - by) * t.d.x);
      if (along > -.2 && along < t.len + .1 && perp < .5) hurt(p, null);
    }
  }
}

function hurt(p, e) {
  if (p.shield) {
    p.shield = false; p.inv = 1.2;
    if (e) stunEnemy(e, 2);
    sfx('pop', {x:p.fx, p:p.id}); ring(p.fx + .5, p.fy + .45, 'rgba(200,240,255,0.95)'); addShake(.12);
    for (let i = 0; i < 10; i++) parts.push({x:p.fx + .5, y:p.fy + .45, vx:rand(-2, 2), vy:rand(-2, 1), life:.5, max:.5, size:rand(.04, .08), kind:'bub', delay:0, ph:Math.random() * 6});
    return;
  }
  killPlayer(p);
}

function updateFriend(n, dt) {
  n.anim += dt;
  if (n.shieldCd > 0) n.shieldCd -= dt;
  let rem = dt;
  for (let g = 0; g < 3 && rem > 0; g++) {
    if (!n.moving) {
      if (n.wait > 0) { n.wait -= dt; break; }
      const free = d => { const x = n.x + d.x, y = n.y + d.y; return inb(x, y) && S.grid[y][x] === '.'; };
      const ap = alive();
      const far = ap.length && Math.min(...ap.map(p => Math.abs(p.fx - n.fx) + Math.abs(p.fy - n.fy))) > 3;
      let d = null;
      if (far && Math.random() < .7) { const s = bfsStep(n, false, ap); if (s && free(s)) d = s; }
      if (!d) {
        const opts = DLIST.filter(free);
        if (!opts.length) { n.wait = .4; break; }
        if (free(n.dir) && Math.random() < .8) d = n.dir;
        else { const nr = opts.filter(o => !(o.x === -n.dir.x && o.y === -n.dir.y)); d = pick(nr.length ? nr : opts); }
        if (!far && Math.random() < .15) { n.wait = rand(.4, 1.2); n.dir = d; break; }
      }
      n.dir = d; n.tx = n.x + d.x; n.ty = n.y + d.y; n.moving = true;
    }
    const left = advance(n, n.speed, rem);
    if (left < 0) break;
    rem = left;
  }
}

function friendCheck() {
  for (const n of S.friends) {
    for (const e of S.enemies) {
      if (e.kind === 'K' || harmless(e) || e.stun > 0) continue;
      if (Math.hypot(e.fx - n.fx, e.fy - n.fy) < .8) {
        stunEnemy(e, 1.8); sfx('boop', {x:n.fx}); ring(e.fx + .5, e.fy + .45, 'rgba(255,255,255,0.8)'); n.happy = .6;
      }
    }
    if (mode !== 'play' && mode !== 'style') continue;
    for (const p of S.players) {
      if (p.dead || p.shield || n.shieldCd > 0) continue;
      if (Math.hypot(p.fx - n.fx, p.fy - n.fy) < .75) {
        p.shield = true; n.shieldCd = 7; n.happy = .8;
        sfx('shield', {x:p.fx, p:p.id}); ring(p.fx + .5, p.fy + .45, 'rgba(190,240,255,0.95)');
      }
    }
    if (n.happy > 0) n.happy -= 1 / 60;
  }
}

function hazardCheck() {
  for (const p of S.players) {
    if (p.dead || p.inv > 0) continue;
    const x = Math.round(p.fx), y = Math.round(p.fy);
    const u = S.urchins.get(y * COLS + x);
    if (u && u.armed && Math.hypot(p.fx - x, p.fy - y) < .4) hurt(p, null);
  }
}

function killPlayer(p) {
  p.dead = true; p.deathT = 1.4; p.moving = false; p.shield = false;
  S.catches++; addShake(.3);
  sfx('die', {x:p.fx, p:p.id});
  for (let i = 0; i < 12; i++) parts.push({x:p.fx + .5, y:p.fy + .5, vx:rand(-1, 1), vy:rand(-2, -.5), life:1, max:1, size:rand(.04, .09), kind:'bub', delay:0, ph:Math.random() * 6});
}

function collectCheck() {
  if (mode !== 'play') return;
  for (const p of S.players) {
    if (p.dead) continue;
    for (let i = S.snacks.length - 1; i >= 0; i--) {
      const s = S.snacks[i];
      if (time < s.born) continue;
      if (S.grid[Math.round(s.fy)][Math.round(s.fx)] === 'c') continue;
      if (s.type === 'clam' && s.lid < .6) continue;
      if (Math.hypot(s.fx - p.fx, s.fy - p.fy) < .62) {
        S.snacks.splice(i, 1); p.score++; save.stats.snacks = (save.stats.snacks || 0) + 1;
        p.streak = time - p.lastGet < STREAK_WINDOW ? p.streak + 1 : 0; p.lastGet = time;
        award(p, (SNACK_PTS[s.type] || 10) + Math.min(p.streak, STREAK_MAX) * STREAK_PTS, s.fx + .5, s.fy + .1, p.streak >= 2);
        sfx('get', {x:s.fx, p:p.id});
        sparkle(s.fx + .5, s.fy + .5, '#fff3b0');
      }
    }
  }
  if (!S.boss && S.snacks.length === 0 && S.failT <= 0 && S.players.some(p => !p.dead)) nextWave(false);
}

// ================= particles =================
function sparkle(x, y, col) { for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2; parts.push({x, y, vx:Math.cos(a) * 1.6, vy:Math.sin(a) * 1.6, life:.45, max:.45, size:.05, kind:'spark', col, delay:0, ph:0}); } }
function ring(x, y, col) { parts.push({x, y, vx:0, vy:0, life:.4, max:.4, size:.2, kind:'ring', col, delay:0, ph:0}); }
function steam(x, y, delay, big) { for (let i = 0; i < (big ? 18 : 6); i++) parts.push({x:x + rand(.2, .8), y:y + .6, vx:rand(-.5, .5), vy:-rand(.8, big ? 2.6 : 1.6), life:big ? 1.1 : .7, max:big ? 1.1 : .7, size:rand(.05, big ? .16 : .1), kind:'steam', delay, ph:0}); }
function updateParts(dt) {
  if (Math.random() < dt * 2.2) parts.push({x:Math.random() * COLS, y:ROWS + .2, vx:0, vy:-rand(.5, 1.1), life:14, max:14, size:rand(.03, .08), kind:'amb', delay:0, ph:Math.random() * 6});
  if (S) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (S.floor[y][x] === 'h' && Math.random() < dt * (S.ventT > VENT_PERIOD - VENT_WARN ? 6 : 1.2))
    parts.push({x:x + rand(.3, .7), y:y + .5, vx:0, vy:-rand(.6, 1), life:1.6, max:1.6, size:rand(.03, .06), kind:'vent', delay:0, ph:Math.random() * 6});
  for (const q of parts) {
    if (q.delay > 0) { q.delay -= dt; continue; }
    q.life -= dt;
    const wob = (q.kind === 'amb' || q.kind === 'bub' || q.kind === 'vent') ? Math.sin(time * 2 + q.ph) * .15 * dt : 0;
    q.x += q.vx * dt + wob; q.y += q.vy * dt;
    if (q.kind === 'chip' || q.kind === 'sand') q.vy += 3.2 * dt;
    if (q.kind === 'bub') { q.vx *= .94; q.vy = q.vy * .94 - .6 * dt; }
    if (q.kind === 'ring') q.size += dt * 3.2;
    if (q.kind === 'steam') { q.size += dt * .12; q.vx *= .96; }
  }
  parts = parts.filter(q => q.life > 0 && q.y > -1);
}

// ================= render setup (sprites) =================
const floorCv = document.createElement('canvas'), vigCv = document.createElement('canvas'), shadeCv = document.createElement('canvas'), glowCv = document.createElement('canvas'), grainCv = document.createElement('canvas');
const overlayCv = document.createElement('canvas'); // grain and vignette flattened into one layer, blitted once per frame
let rockSpr = [], coralSpr = [], kelpSpr = [], curSpr = {};
const KELP_PH = 12, CUR_PH = 8; // animation phases prerendered for kelp and current tiles

function makeSprite(fn) {

  const c = s.getContext('2d');

function paperGrain(c, x, y, w, h, n, seed) {

  for (let i = 0; i < n; i++) { const px = x + r() * w, py = y + r() * h; c.beginPath(); c.moveTo(px, py); c.lineTo(px + (r() - .5) * .18, py + (r() - .5) * .07); c.stroke(); }
  c.strokeStyle = 'rgba(0,30,40,0.06)';

  c.restore();
}
function paperBlock(c, color, seed, lines, lineColor) {
  const px = T * dpr;
  c.save();
  c.shadowColor = 'rgba(5,25,35,0.42)'; c.shadowBlur = px * .12; c.shadowOffsetX = px * .035; c.shadowOffsetY = px * .07;

    const rr = mulberry(seed + 9);

  }

  c.restore();
}
function buildPaperArt() {
  const th = theme, px = T * dpr;
  floorCv.width = Math.ceil(COLS * px); floorCv.height = Math.ceil(ROWS * px);
  let c = floorCv.getContext('2d');

function buildArt() {
  if (theme.paper) { buildPaperArt(); return; }
  const th = theme;
  floorCv.width = Math.ceil(COLS * T * dpr); floorCv.height = Math.ceil(ROWS * T * dpr);

  const r = mulberry(1234);

function drawPuffer(p, alphaMul) {
  const F = p.fish;
  let puffAmt = 0;
  if (p.puff > 0) puffAmt = Math.min(1, (PUFF_T - p.puff) / .12, p.puff / .18);
  const r = .32 + .15 * puffAmt;
  const bob = p.dead ? 0 : Math.sin(time * 4 + p.id) * .03;
  let lift = 0, alpha = alphaMul || 1;
  if (p.dead) { const k = 1 - p.deathT / 1.4; lift = -k * .8; alpha *= Math.max(0, 1 - k * .9); }
  if (!p.dead && p.inv > 0 && Math.floor(time * 12) % 2) alpha *= .4;
  if (!p.dead && S && mode !== 'style' && p.held && hiddenP(p)) alpha *= .5; // hidden in kelp
  if (!p.dead) shadow(p.fx + .5, p.fy + .88, r * .9);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(p.fx + .5, p.fy + .45 + bob + lift);
  const f = p.face;
  if (f.x < 0) ctx.scale(-1, 1);
  else if (f.y !== 0) ctx.rotate(Math.atan2(f.y, f.x) * .55);
  if (p.dead) ctx.scale(1, -1);
  if (puffAmt > 0) {
    ctx.strokeStyle = F.spike; ctx.lineWidth = .035; ctx.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * .92, Math.sin(a) * r * .92); ctx.lineTo(Math.cos(a) * (r + .1 * puffAmt), Math.sin(a) * (r + .1 * puffAmt)); ctx.stroke();
    }
  }
  const wag = Math.sin(time * 9 + p.id) * .04;
  ctx.fillStyle = F.fin;
  ctx.beginPath(); ctx.moveTo(-r * .8, 0); ctx.lineTo(-r - .17, -.13 + wag); ctx.lineTo(-r - .12, 0); ctx.lineTo(-r - .17, .13 + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-r * .2, -r * .92); ctx.quadraticCurveTo(-r * .45, -r * 1.25 - wag, -r * .6, -r * .78); ctx.closePath(); ctx.fill();
  const bg = ctx.createRadialGradient(-r * .3, -r * .4, r * .1, 0, 0, r);
  bg.addColorStop(0, F.c1); bg.addColorStop(1, F.c2);
  ctx.fillStyle = bg; circ(0, 0, r); ctx.fill();
  if (F.pattern === 'stripes') {
    ctx.save(); circ(0, 0, r); ctx.clip();
    ctx.strokeStyle = F.spot; ctx.lineWidth = r * .14; ctx.lineCap = 'round';
    for (const sx of [-.55, -.18, .2]) { ctx.beginPath(); ctx.moveTo(sx * r + r * .08, -r * 1.05); ctx.quadraticCurveTo(sx * r - r * .2, -r * .4, sx * r, r * .15); ctx.stroke(); }
    ctx.restore();
  }
  ctx.fillStyle = F.belly; ctx.globalAlpha = alpha * .92; ell(r * .05, r * .42, r * .72, r * .42); ctx.fill(); ctx.globalAlpha = alpha;
  ctx.fillStyle = F.spot;
  if (F.pattern === 'spots' || !F.pattern) for (const [sx, sy, sr] of [[-.45, -.35, .09], [-.1, -.6, .07], [-.6, .05, .07], [.15, -.25, .05], [-.3, -.05, .045]]) { circ(sx * r, sy * r, sr * r * 1.6); ctx.fill(); }
  if (F.pattern === 'hearts') for (const [sx, sy, sz] of [[-.46, -.38, 1], [-.08, -.66, .85], [-.66, .04, .8], [.16, -.3, .7], [-.24, -.06, .65]]) {
    const hs = r * .2 * sz;
    ctx.save(); ctx.translate(sx * r, sy * r); ctx.beginPath();
    ctx.moveTo(0, hs * .35); ctx.bezierCurveTo(-hs * 1.2, -hs * .35, -hs * .45, -hs * 1.15, 0, -hs * .45); ctx.bezierCurveTo(hs * .45, -hs * 1.15, hs * 1.2, -hs * .35, 0, hs * .35);
    ctx.fill(); ctx.restore();
  }
  if (F.pattern === 'freckles') for (const [sx, sy] of [[-.62, -.2], [-.48, -.48], [-.3, -.68], [-.08, -.78], [.12, -.62], [-.34, -.3], [-.12, -.42], [-.56, .1], [.05, -.3], [-.28, -.08], [.22, -.4], [-.7, -.02]]) { circ(sx * r, sy * r, r * .045); ctx.fill(); }
  if (puffAmt === 0) for (let i = 0; i < 6; i++) { const a = -2.6 + i * .45; circ(Math.cos(a) * r * .95, Math.sin(a) * r * .95, .018); ctx.fill(); }

    ctx.fillStyle = '#fff'; circ(ex + r * .12, ey - r * .05, r * .055); ctx.fill();

  if (F.acc && F.acc !== 'none') drawAccessory(F.acc, r, ex, ey);
  ctx.restore();
}

function drawAccessory(acc, r, ex, ey) {
  const k = r / .32;
  ctx.save();
  if (acc === 'glasses') {
    const er = r * .34;
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = .028 * k; ctx.lineCap = 'round';
    circ(ex, ey, er); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex - er, ey - er * .1); ctx.lineTo(ex - er * 2.1, ey - er * .35); ctx.stroke();
    ctx.fillStyle = 'rgba(200,240,255,0.25)'; circ(ex, ey, er); ctx.fill();
  } else if (acc === 'bow') {
    ctx.translate(-r * .12, -r * .95); ctx.rotate(-.25); ctx.scale(k, k);
    ctx.fillStyle = '#ff5c8a';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-.13, -.08); ctx.lineTo(-.13, .08); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(.13, -.08); ctx.lineTo(.13, .08); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d63e6c'; circ(0, 0, .035); ctx.fill();
  } else if (acc === 'flower') {
    ctx.translate(r * .05, -r * .94); ctx.scale(k, k);
    ctx.fillStyle = '#fff3f7';
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 - Math.PI / 2; circ(Math.cos(a) * .055, Math.sin(a) * .055, .045); ctx.fill(); }
    ctx.fillStyle = '#ffcf4a'; circ(0, 0, .035); ctx.fill();
  } else if (acc === 'cap') {
    // a sailor's cap: white crown, navy band with a gold stripe, short dark visor, red pompom
    ctx.translate(-r * .02, -r * .9); ctx.rotate(-.15); ctx.scale(k, k);
    ctx.fillStyle = '#1e2d4d'; ctx.beginPath(); ctx.ellipse(.1, .035, .17, .045, .12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-.21, .025); ctx.quadraticCurveTo(-.2, -.17, 0, -.19); ctx.quadraticCurveTo(.2, -.17, .21, .025); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#9fb2cc'; ctx.lineWidth = .012; ctx.stroke();
    ctx.fillStyle = '#2f55a8'; ctx.fillRect(-.21, -.03, .42, .055);
    ctx.fillStyle = '#f6c445'; ctx.fillRect(-.21, -.012, .42, .012);
    ctx.fillStyle = '#e8463a'; circ(0, -.2, .032); ctx.fill();
  } else if (acc === 'star') {
    ctx.translate(-r * .3, -r * .9); ctx.rotate(.3); ctx.scale(k * 1.35, k * 1.35);
    ctx.fillStyle = '#ffb347'; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? .04 : .095; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.9)'; circ(0, 0, .015); ctx.fill();
  } else if (acc === 'fin') {
    // a dorsal fin on a headband, swept back like Bruiser's, with a pale front face
    ctx.translate(-r * .1, -r * .9); ctx.rotate(-.1); ctx.scale(k, k);
    ctx.fillStyle = '#7b94a3'; ctx.beginPath(); ctx.moveTo(-.17, .02); ctx.quadraticCurveTo(-.1, -.2, .06, -.32); ctx.quadraticCurveTo(.07, -.13, .18, .02); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3c4f5a'; ctx.lineWidth = .012; ctx.stroke();
    ctx.fillStyle = '#d3dee4'; ctx.beginPath(); ctx.moveTo(-.09, .02); ctx.quadraticCurveTo(-.03, -.14, .05, -.25); ctx.quadraticCurveTo(.03, -.1, .08, .02); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4d6472'; rr(-.22, .0, .44, .055, .02); ctx.fill();
    ctx.fillStyle = '#9fb3c0'; ctx.fillRect(-.22, .02, .44, .012);
  } else if (acc === 'crown') {
    ctx.translate(-r * .06, -r * .93); ctx.rotate(-.12); ctx.scale(k, k);
    ctx.fillStyle = '#f6c445';
    ctx.beginPath(); ctx.moveTo(-.13, .03);
    for (const [x, y] of [[-.12, -.11], [-.06, -.03], [0, -.15], [.06, -.03], [.12, -.11], [.13, .03]]) ctx.lineTo(x, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8463a'; circ(0, -.05, .022); ctx.fill();
    ctx.fillStyle = '#7cc4f0'; circ(-.08, -.01, .016); ctx.fill(); circ(.08, -.01, .016); ctx.fill();

    const pts = []; for (let i = 0; i < 9; i++) { const a = .2 * Math.PI + i * (.6 * Math.PI / 8); pts.push([Math.cos(a) * r * .82, Math.sin(a) * r * .82]); }

    });
  }
  ctx.restore();
}

// small animated fish previews inside menu cards
function drawPreviews() {
  const cvs = card.querySelectorAll('canvas[data-who]');
  if (!cvs.length) return;
  const keep = ctx;
  for (const pc of cvs) {
    const w = pc.clientWidth || +pc.getAttribute('width') || 120, d = Math.min(window.devicePixelRatio || 1, 2.5);
    if (pc.width !== Math.round(w * d)) { pc.width = Math.round(w * d); pc.height = Math.round(w * d); }
    const c = pc.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pc.width, pc.height);
    const u = pc.width / 1.5;
    c.setTransform(u, 0, 0, u, 0, 0);
    ctx = c;
    const who = pc.dataset.who, big = pc.dataset.big === '1';
    const cyc = (time + (who === 'milli' ? 1.3 : 0)) % 4;
    try {
      drawPuffer({id:who === 'milli' ? 1 : 0, fish:getFish(who), fx:.28, fy:.36, face:who === 'milli' && !big ? LEFT : RIGHT, puff:big && cyc > 3 ? .65 : 0, dead:false, inv:0});
    } finally { ctx = keep; }
  }
}

function drawTags() {
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `800 ${Math.max(10, Math.round(T * .3))}px Grandstander, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineJoin = 'round'; // miter joins put spikes on the M and N of the outlined names
  for (const n of S.friends) {
    const x = (n.fx + .5) * T, y = (n.fy - .02) * T;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,26,36,0.75)'; ctx.strokeText('Niko', x, y);
    ctx.fillStyle = '#ffd6e0'; ctx.fillText('Niko', x, y);
  }
  for (const q of S.popups) {
    const k = q.t, x = q.x * T, y = (q.y - k * .9) * T;
    ctx.globalAlpha = Math.max(0, 1 - k * k);
    ctx.font = `800 ${Math.max(11, Math.round(T * (q.big ? .5 : .36)))}px Grandstander, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(2,26,36,0.8)'; ctx.strokeText(q.text, x, y);
    ctx.fillStyle = q.col; ctx.fillText(q.text, x, y);
  }
  ctx.globalAlpha = 1;
  ctx.font = `800 ${Math.max(10, Math.round(T * .3))}px Grandstander, system-ui, sans-serif`;
  if (!twoP && mode !== 'style') { ctx.restore(); return; }
  for (const p of S.players) {
    if (p.dead) continue;
    const x = (p.fx + .5) * T, y = (p.fy - .02) * T - (p.puff > 0 ? T * .14 : 0);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,26,36,0.75)'; ctx.strokeText(p.fish.name, x, y);
    ctx.fillStyle = p.fish.tag; ctx.fillText(p.fish.name, x, y);
  }
  ctx.restore();
}

function drawStun(e) {
  if (e.stun <= 0) return;
  ctx.fillStyle = '#fff4a3';
  for (let i = 0; i < 3; i++) { const a = time * 5 + i * 2.09; circ(e.fx + .5 + Math.cos(a) * .22, e.fy + .02 + Math.sin(a) * .07, .045); ctx.fill(); }
}

function drawEnemy(e) {
  if (e.kind === 'Y' && e.state === 'buried') { drawRay(e); return; }
  shadow(e.fx + .5, e.fy + (FLY[e.kind] ? .97 : .88), e.kind === 'J' ? .2 : e.kind === 'A' ? .32 : e.kind === 'K' ? .5 : .3);
  ctx.save();
  if (e.stun > 0) ctx.globalAlpha = .75;
  ({C:drawCrab, J:drawJelly, E:drawEel, O:drawOcto, S:drawSword, M:drawMantis, A:drawManta, Y:drawRay, F:drawLion, K:drawShark})[e.kind](e);
  ctx.restore();
  drawStun(e);
}

function drawCrab(e) {
  const w = Math.sin(e.anim * 16) * (e.moving && e.stun <= 0 ? 1 : .15);
  ctx.translate(e.fx + .5, e.fy + .5);
  ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .045; ctx.lineCap = 'round';
  for (let s = -1; s <= 1; s += 2) for (let i = 0; i < 3; i++) {
    const yy = -.02 + i * .07;
    ctx.beginPath(); ctx.moveTo(s * .2, yy); ctx.lineTo(s * .35, yy + .04 + (i % 2 ? w : -w) * .03); ctx.lineTo(s * .4, yy + .15); ctx.stroke();
  }
  for (let s = -1; s <= 1; s += 2) {
    ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .05;
    ctx.beginPath(); ctx.moveTo(s * .16, -.08); ctx.lineTo(s * .28, -.22); ctx.stroke();
    ctx.fillStyle = '#f0604a'; circ(s * .31, -.28, .095); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; circ(s * .29, -.31, .03); ctx.fill();
    ctx.strokeStyle = '#7a1f14'; ctx.lineWidth = .028;
    ctx.beginPath(); ctx.moveTo(s * .31, -.28); ctx.lineTo(s * .38, -.36 - w * .02); ctx.stroke();
  }

  g.addColorStop(0, '#ff7a5c'); g.addColorStop(1, '#d6453a');
  ctx.fillStyle = g; ell(0, 0, .28, .2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ell(0, -.08, .15, .05); ctx.fill();
  for (let s = -1; s <= 1; s += 2) {
    ctx.strokeStyle = '#a8302a'; ctx.lineWidth = .03;
    ctx.beginPath(); ctx.moveTo(s * .07, -.13); ctx.lineTo(s * .09, -.24); ctx.stroke();
    ctx.fillStyle = '#fff'; circ(s * .09, -.26, .05); ctx.fill();
    ctx.fillStyle = '#111'; circ(s * .09 + e.dir.x * .015, -.26 + e.dir.y * .015, .025); ctx.fill();
  }
}

function drawJelly(e) {
  const pulse = Math.sin(e.anim * 4) * .035;
  ctx.translate(e.fx + .5, e.fy + .3);
  ctx.lineCap = 'round';
  // thin tentacles, then two thick frilly arms
  ctx.strokeStyle = 'rgba(255,190,220,0.6)'; ctx.lineWidth = .022;
  for (let i = 0; i < 5; i++) {
    const x0 = -.2 + i * .1;
    ctx.beginPath(); ctx.moveTo(x0, .1);
    for (let k = 1; k <= 5; k++) ctx.lineTo(x0 + Math.sin(e.anim * 5 + i + k * .9) * .04, .1 + k * .072);

  ctx.strokeStyle = 'rgba(60,80,90,0.5)'; ctx.lineWidth = .015;

}

function drawTentPath(pts, w0, w1) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = pts.length;
  // the silhouette pass gets one stroke; a segment-by-segment shadow was most of the Queen's frame cost
  if (silMode()) {
    ctx.lineWidth = (w0 + w1) / 2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    ctx.restore(); return;
  }
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? '#c25a9e' : '#6e2463';
    for (let i = 1; i < n; i++) {
      ctx.lineWidth = (w0 + (w1 - w0) * (i / (n - 1))) * (pass ? .7 : 1);
      ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,215,235,0.75)';
  for (let i = 1; i < n - 1; i += 2) { const w = w0 + (w1 - w0) * (i / (n - 1)); circ(pts[i].x, pts[i].y + w * .15, w * .16); ctx.fill(); }
  ctx.restore();
}

function drawQueenBody(cx, cy, sc, mood, alpha, flash, lookX) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy); ctx.scale(sc, sc);
  for (let i = 0; i < 6; i++) {
    const side = i < 3 ? -1 : 1, k = i % 3, pts = [];
    for (let j = 0; j <= 10; j++) { const s = j / 10; pts.push({x:side * (.55 + k * .3 + s * (1.1 + k * .25)), y:.55 + s * (1.3 - k * .25) + Math.sin(time * 2 + s * 4 + i) * .15 * s}); }
    drawTentPath(pts, .34, .1);
  }
  if (silMode()) { ell(0, 0, 1.45, 1.12); ctx.fill(); ctx.restore(); return; }
  const g = ctx.createRadialGradient(-.4, -.5, .1, 0, 0, 1.6);

  ctx.fillStyle = 'rgba(255,220,240,0.25)';
  for (const [x, y, r] of [[-.75, -.4, .12], [.5, -.62, .09], [.92, -.1, .1], [-.3, -.78, .07], [.2, .55, .08]]) { circ(x, y, r); ctx.fill(); }
  ctx.fillStyle = '#f6c445';
  ctx.beginPath(); ctx.moveTo(-.55, -.98);
  for (const [x, y] of [[-.48, -1.45], [-.26, -1.12], [0, -1.58], [.26, -1.12], [.48, -1.45], [.55, -.98]]) ctx.lineTo(x, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8463a'; circ(0, -1.25, .07); ctx.fill();
  ctx.fillStyle = '#7cc4f0'; circ(-.36, -1.12, .05); ctx.fill(); circ(.36, -1.12, .05); ctx.fill();
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fff'; ell(s * .5, .15, .3, .36); ctx.fill();
    ctx.fillStyle = '#1b0d1f'; ell(s * .5 + (lookX || 0) * .1, .2, mood === 'calm' ? .13 : .08, mood === 'calm' ? .16 : .26); ctx.fill();
    ctx.fillStyle = '#fff'; circ(s * .5 + .07, .06, .05); ctx.fill();
  }
  if (mood === 'angry') {

    ctx.lineWidth = .05; ctx.beginPath(); ctx.moveTo(-.22, .72); ctx.quadraticCurveTo(0, .6, .22, .72); ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,150,190,0.5)'; for (const s of [-1, 1]) { ell(s * .88, .52, .18, .09); ctx.fill(); }
    ctx.strokeStyle = '#4a1240'; ctx.lineWidth = .05; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-.2, .66); ctx.quadraticCurveTo(0, .8, .2, .66); ctx.stroke();
  }
  if (flash) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ell(0, 0, 1.45, 1.12); ctx.fill(); }
  ctx.restore();
}

function drawTent(t) {
  if (t.len <= .05) return;
  const d = t.d, {bx, by} = tentEnds(t), px = -d.y, py = d.x, n = Math.max(3, Math.ceil(t.len * 3));
  const tremble = t.state === 'stuck' ? Math.sin(time * 40) * .05 : 0, pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n * t.len, w = Math.sin(t.wig * 4 + s * 1.6) * .1 * Math.min(1, s) + (i === n ? tremble : 0);
    pts.push({x:bx + d.x * s + px * w, y:by + d.y * s + py * w});
  }
  drawTentPath(pts, .62, .3);
  if (t.state === 'stuck') {
    const tip = pts[n];
    ctx.strokeStyle = `rgba(255,220,90,${.55 + .4 * Math.sin(time * 10)})`; ctx.lineWidth = .06;
    circ(tip.x, tip.y, .48); ctx.stroke();
    ctx.fillStyle = '#fff4a3';
    for (let i = 0; i < 3; i++) { const a = time * 6 + i * 2.09; circ(tip.x + Math.cos(a) * .3, tip.y - .35 + Math.sin(a) * .08, .045); ctx.fill(); }
  }
}

function drawWarnings() {
  for (const t of S.boss.tents) {
    if (t.state !== 'warn') continue;
    ctx.fillStyle = `rgba(255,70,110,${.18 + .14 * Math.sin(time * 18)})`;
    for (const c of t.cells) { if (S.grid[c.y][c.x] === 'c') break; rr(c.x + .06, c.y + .06, .88, .88, .14); ctx.fill(); }
    const c0 = t.cells[0];
    if (Math.random() < .35) parts.push({x:c0.x + .5 - t.d.x * .4 + rand(-.3, .3), y:c0.y + .5 - t.d.y * .4, vx:0, vy:-rand(.5, 1), life:.8, max:.8, size:rand(.04, .08), kind:'bub', delay:0, ph:0});
  }
}

function drawBoss() {
  const B = S.boss;
  if (B.kind !== 'queen') return;
  const k = B.dead ? Math.max(0, B.dying / 2.2) : 1;
  const tgt = alive()[0], lookX = tgt ? Math.max(-1, Math.min(1, (tgt.fx + .5 - B.cx) / 4)) : 0;
  drawQueenBody(B.cx, B.cy + (1 - k) * 1.2, 1, B.dead ? 'calm' : 'angry', k, B.hurtT > 0 && Math.floor(time * 20) % 2, lookX);
  for (const t of B.tents) drawTent(t);
}

// ================= story =================
let story = null;
function playStory(id, done) {
  mode = 'story'; S = null;
  overlay.hidden = true; hideBanner(); hideStyle();
  story = {id, i:0, done, t0:time, chars:0};
  storyEl.classList.remove('out'); storyEl.hidden = false;
  showPanel();
}
function showPanel() {
  const list = STORY[story.id];
  story.t0 = time; story.chars = 0;
  storyDots.innerHTML = list.length > 1 ? list.map((_, i) => `<i class="${i === story.i ? 'on' : ''}"></i>`).join('') : '';
  storyNextBtn.textContent = story.i < list.length - 1 ? 'Next' : story.id === 'intro' ? 'Start' : 'Continue';
}
function storyNext() {
  if (!story) return;
  const P = STORY[story.id][story.i];
  if (story.chars < P.text.length) { story.chars = P.text.length; return; }
  sfx('click');
  story.i++;
  if (story.i >= STORY[story.id].length) endStory(); else showPanel();
}
function endStory() {
  if (!story) return;
  const d = story.done; story = null; mode = 'menu';
  storyEl.classList.add('out');
  setTimeout(() => { if (!story) storyEl.hidden = true; storyEl.classList.remove('out'); }, 200);
  if (d) d();
}
storyNextBtn.addEventListener('click', e => { unlockAudio(); e.currentTarget.blur(); storyNext(); });
$('#storySkip').addEventListener('click', e => { unlockAudio(); e.currentTarget.blur(); endStory(); });
cv.addEventListener('click', () => { if (mode === 'story') { unlockAudio(); storyNext(); } });

function drawStory() {

  const glow = (x, y, r, col) => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore(); };

  const lanterns = () => { for (let i = 0; i < 5; i++) { const x = 1.8 + i * 2.85, y = 1.4 + Math.sin(time * 1.1 + i) * .12; glow(x, y, 1.1, 'rgba(255,190,100,0.28)'); ctx.fillStyle = '#f6c445'; rr(x - .18, y - .28, .36, .5, .1); ctx.fill(); ctx.fillStyle = 'rgba(255,240,200,0.9)'; rr(x - .1, y - .18, .2, .3, .06); ctx.fill(); ctx.strokeStyle = 'rgba(255,230,180,0.5)'; ctx.lineWidth = .03; ctx.beginPath(); ctx.moveTo(x, y - .28); ctx.lineTo(x, 0); ctx.stroke(); } };
  const cake = (x, y) => { ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#e8eef4'; ell(0, .32, .62, .12); ctx.fill(); ctx.fillStyle = '#f6b7c8'; rr(-.5, -.05, 1, .38, .08); ctx.fill(); ctx.fillStyle = '#fff0f4'; for (let i = 0; i < 4; i++) { ell(-.36 + i * .24, -.03, .12, .07); ctx.fill(); } ctx.fillStyle = '#f29ab4'; rr(-.32, -.38, .64, .36, .08); ctx.fill(); ctx.fillStyle = '#fff0f4'; for (let i = 0; i < 3; i++) { ell(-.2 + i * .2, -.36, .1, .06); ctx.fill(); } ctx.fillStyle = '#fffbe6'; rr(-.03, -.62, .06, .26, .02); ctx.fill(); glow(0, -.68, .5, 'rgba(255,200,90,0.5)'); ctx.fillStyle = '#ffb347'; ell(0, -.68 + Math.sin(time * 9) * .02, .06, .1); ctx.fill(); ctx.fillStyle = '#e8463a'; circ(.22, -.44, .06); ctx.fill(); ctx.restore(); };
  const sparkle = () => { if (Math.random() < .35) parts.push({x:Math.random() * COLS, y:-.2, vx:rand(-.3, .3), vy:rand(.8, 1.6), life:7, max:7, size:rand(.05, .09), kind:'spark', col:pick(['#f6c445', '#ff8fa3', '#7cc4f0', '#8fe0a0', '#ffffff']), delay:0, ph:0}); };
  const ring6 = (cx, cy, rx, ry, types) => types.forEach((ty, i) => { const a = i / types.length * Math.PI * 2 + time * .25; snack(ty, cx - .5 + Math.cos(a) * rx, cy - .5 + Math.sin(a) * ry); });
  rockRow(0); rockRow(ROWS - 1);

  switch (P.scene) {

      fish(0, 5.5, 6 + bob(0), RIGHT, (t % 4) > 3.2); fish(1, 8.5, 6 + bob(1.5), LEFT, false);

    case 'feast':

    shield(o, pan, pm) { splash(.35, .07, 0, pan); [0, 7, 12, 19].forEach((st, i) => drop(hz(79 + st) * pm, .07, i * .05, pan)); },
    pop(o, pan) { splash(.08, .3, 0, pan); drop(1600, .1, 0, pan); drop(500, .08, .03, pan); },
    boop(o, pan) { drop(520, .13, 0, pan); drop(560, .12, .12, pan); },
    rise(o, pan) { splash(.55, .16, 0, pan); for (let i = 0; i < 5; i++) drop(250 + i * 120, .07, .1 + i * .07, pan); },
    flare(o, pan) { for (let i = 0; i < 6; i++) drop(2000 + (i * 7 % 5) * 300, .05, i * .03, pan); },
    roar(o, pan) { tone(95, 60, .6, 'sine', .08, 0, pan); splash(.6, .14, 0, pan); for (let i = 0; i < 4; i++) drop(180 - i * 20, .08, i * .12, pan); },
    crash(o, pan) { tone(80, 35, .5, 'sine', .22, 0, pan); splash(.3, .3, 0, pan); for (let i = 0; i < 5; i++) drop(rand(500, 1200), .07, .05 + i * .07, pan); },
    bosshit(o, pan) { splash(.25, .22, 0, pan); [0, 3, 7].forEach((st, i) => drop(hz(60 + st), .1, i * .03, pan)); },
    warn(o, pan) { for (let i = 0; i < 4; i++) { drop(140, .12, i * .2, pan); } tone(60, 75, .8, 'sine', .1, 0, pan); },
    lash(o, pan) { splash(.25, .22, 0, pan); for (let i = 0; i < 4; i++) drop(1200 - i * 250, .06, i * .04, pan); },
    stuck(o, pan) { drop(300, .12, 0, pan); drop(260, .11, .1, pan); drop(300, .1, .2, pan); },
    bossdown() { [60, 55, 52, 48].forEach((m, i) => drop(hz(m), .1, i * .18, 0)); splash(.9, .1, .5, 0); [72, 76, 79, 84, 91].forEach((m, i) => drop(hz(m), .09, .9 + i * .08, 0)); },
    vent(o, pan) { splash(.4, .18, 0, pan); for (let i = 0; i < 4; i++) drop(900 + i * 200, .06, i * .06, pan); },
    rustle(o, pan) { noise(.15, .07, 2500, 5000, 'bandpass', 1.2, 0, pan); drop(1800, .04, .05, pan); },
  }},
};
let pack = PACKS[save.pack] || PACKS.bubbly;
function applyPack(id) { pack = PACKS[id] || PACKS.bubbly; save.pack = id; persist(); if (sendGain) { sendGain.gain.value = pack.echo; softLP.frequency.value = pack.lp; } }

// o.x: tile column for stereo position, o.p: which fish (Milli sits a little higher), o.n: how many blocks
function sfx(n, o) {
  if (!ac || muted) return;
  if (mode === 'style' && !previewing) return;
  o = o || {};
  const pan = o.x != null ? ((o.x + .5) / COLS * 2 - 1) * .7 : 0;
  const pm = o.p === 1 ? 1.15 : 1;
  const k = Math.min(o.n || 1, 10);
  const f = pack.fx[n];
  if (f) try { f(o, pan, pm, k); } catch (e) {}
}

// ---- music: three original loops, scheduled ahead on the audio clock ----
function at(t) { return t - ac.currentTime; }
function mallet(m, t, vol) {
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
  o.type = 'triangle'; o.frequency.value = hz(m); o2.type = 'sine'; o2.frequency.value = hz(m) * 4;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .45);
  g2.gain.setValueAtTime(.0001, t); g2.gain.exponentialRampToValueAtTime(vol * .25, t + .003); g2.gain.exponentialRampToValueAtTime(.0001, t + .08);
  o.connect(g); o2.connect(g2); g.connect(trackBus); g2.connect(trackBus);
  o.start(t); o2.start(t); o.stop(t + .5); o2.stop(t + .1);
}
function bassNote(m, t, dur, vol, type) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = hz(m);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(trackBus); o.start(t); o.stop(t + dur + .05);
}
function pad(ms, t, dur, vol) {
  for (const m of ms) for (const det of [-7, 7]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = hz(m) * Math.pow(2, det / 1200);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .9);
    g.gain.setValueAtTime(vol, t + Math.max(1, dur - .4)); g.gain.exponentialRampToValueAtTime(.0001, t + dur + .8);
    o.connect(g); g.connect(trackBus); o.start(t); o.stop(t + dur + .9);
  }
}
const TRACKS = {
  reef: {name:'Reef loop', desc:'Bright mallets, easygoing', bpm:100, fn(s, bar, t) {
    const [root, ch] = [[48, [60, 64, 67]], [45, [57, 60, 64]], [41, [57, 60, 65]], [43, [55, 59, 62]]][bar];
    if (s === 0 || s === 10) bassNote(root, t, .5, .09);
    if (s === 6 || s === 14) bassNote(root + 7, t, .25, .05);
    if (s % 2 === 0 && Math.random() < .75) mallet(ch[(s / 2 + bar) % 3] + (Math.random() < .3 ? 12 : 0), t, .05);
    if (s % 4 === 3 && Math.random() < .3) mallet(ch[(Math.random() * 3) | 0] + 24, t, .02);
  }},
  deep: {name:'Deep current', desc:'Slow pads and distant bells', bpm:72, fn(s, bar, t, stepLen) {
    const [root, ch] = [[38, [62, 65, 69]], [46, [58, 62, 65]], [41, [60, 65, 69]], [48, [60, 64, 67]]][bar];
    if (s === 0) { pad(ch, t, stepLen * 16, .022); bassNote(root, t, stepLen * 15, .08); }
    if (s % 4 === 2 && Math.random() < .35) { const m = ch[(Math.random() * 3) | 0] + 24; tone(hz(m), hz(m), 1.4, 'sine', .022, at(t), 0, trackBus); tone(hz(m) * 2.01, hz(m) * 2.01, .4, 'sine', .006, at(t), 0, trackBus); }
  }},
  tidepool: {name:'Tide pool', desc:'Slow kalimba over a drone', bpm:64, fn(s, bar, t, stepLen) {
    // pentatonic, one chord per bar, a drone that only moves every two bars
    const [root, ch] = [[45, [57, 60, 64, 67]], [45, [57, 60, 64, 67]], [41, [53, 57, 60, 65]], [43, [55, 59, 62, 67]]][bar];
    if (s === 0 && bar % 2 === 0) pad([root + 12, root + 19], t, stepLen * 32, .014);
    if (s === 0) bassNote(root, t, stepLen * 14, .06);
    const seq = [0, 2, 1, 3, 2, 0, 3, 1];
    if (s % 2 === 0 && Math.random() < .85) mallet(ch[seq[(s / 2 + bar * 2) % 8]] + 12, t, .028);
    if (s === 11 && Math.random() < .5) mallet(ch[0] + 24, t, .012);
  }},
  moondrift: {name:'Moon drift', desc:'Breathing pads, no pulse', bpm:56, fn(s, bar, t, stepLen) {
    const [root, ch] = [[38, [57, 62, 65]], [41, [57, 60, 65]], [36, [55, 60, 64]], [43, [55, 59, 62]]][bar];
    if (s === 0) { pad(ch, t, stepLen * 16, .02); pad([ch[0] + 12], t + stepLen * 4, stepLen * 10, .008); bassNote(root, t, stepLen * 16, .07); }
    if (s === 8 && Math.random() < .6) { const m = ch[(Math.random() * 3) | 0] + 24; tone(hz(m), hz(m), 2.2, 'sine', .016, at(t), 0, trackBus); }
    if (s === 4 && bar % 2 === 1) mallet(ch[2] + 12, t, .012);
  }},
  lantern: {name:'Lantern', desc:'A lullaby on soft mallets', bpm:80, fn(s, bar, t, stepLen) {
    const [root, ch] = [[48, [60, 64, 67]], [45, [57, 60, 64]], [53, [57, 60, 65]], [43, [55, 59, 62]]][bar];
    if (s === 0) { bassNote(root, t, stepLen * 12, .07); pad([ch[0], ch[2]], t, stepLen * 15, .011); }
    // three-note cells, one per half bar, each a question then an answer
    const cell = [[0, 1, 2], [2, 1, 0], [1, 2, 0], [0, 2, 1]][(bar + (s >= 8 ? 1 : 0)) % 4];
    if (s % 8 === 0 || s % 8 === 3 || s % 8 === 5) mallet(ch[cell[[0, 3, 5].indexOf(s % 8)]] + (s >= 8 ? 12 : 0), t, .034);
    if (s === 14 && Math.random() < .4) mallet(ch[1] + 24, t, .014);
  }},
};
// 'auto' (the default) follows the reef: the loops get calmer the deeper you go, and each boss has its own
const trackForLevel = i => TRACKS[i === 17 ? 'moondrift' : i === 12 ? 'deep' : i >= 10 ? 'tidepool' : i >= 6 ? 'lantern' : 'reef'];
const autoTrackNow = () => mode === 'style' ? TRACKS.lantern : S ? trackForLevel(levelIdx) : TRACKS.reef; // the lab previews Lantern, which only the automatic choice plays
let autoTrack = !save.track || save.track === 'auto', musicDuckUntil = 0;
// change loops through a short dip in the music bus rather than a hard cut; the new loop starts from its first bar
function setTrack(t, now) {
  if (t === track && !now) return;
  track = t; step = 0;
  if (!ac) return;
  // everything the old loop already scheduled (pads ring for seconds) fades out on its own bus; the new loop gets a fresh one
  const old = trackBus; old.gain.setTargetAtTime(0, ac.currentTime, .12); setTimeout(() => { try { old.disconnect(); } catch (e) {} }, 1500);
  trackBus = ac.createGain(); trackBus.connect(musicBus);
  nextStep = ac.currentTime + (now ? .05 : .7); musicDuckUntil = now ? 0 : ac.currentTime + .7;
}
let track = autoTrack ? TRACKS.reef : (TRACKS[save.track] || TRACKS.reef);
function applyTrack(id) {
  if (id === 'off') { musicOn = false; }
  else { musicOn = true; autoTrack = id === 'auto' || !TRACKS[id]; setTrack(autoTrack ? autoTrackNow() : TRACKS[id], true); save.track = autoTrack ? 'auto' : id; }
  save.music = musicOn; persist(); setAudioLabels();
}
function scheduleMusic() {
  if (!ac) return;
  const on = !muted && musicOn && mode !== 'paused' && !document.hidden && ac.currentTime >= musicDuckUntil;
  musicBus.gain.setTargetAtTime(on ? (mode === 'play' ? .9 : .7) : 0, ac.currentTime, .3);
  const STEP = 60 / track.bpm / 4;
  if (nextStep < ac.currentTime - .5) nextStep = ac.currentTime + .05;
  try {
    while (nextStep < ac.currentTime + musicAhead) {
      if (on) track.fn(step % 16, Math.floor(step / 16) % 4, nextStep, STEP);
      nextStep += STEP; step++;
    }
  } catch (e) {}
}

// ================= look and sound lab =================
const PREVIEWS = [['grow', 'Grow coral'], ['break', 'Break coral'], ['get', 'Snack'], ['wave', 'New wave'], ['puff', 'Puff'], ['stun', 'Stun'],
  ['bonk', 'Bump'], ['charge', 'Swordfish charge'], ['thud', 'Swordfish crash'], ['punch', 'Mantis punch'], ['blink', 'Moon pearl'],
  ['die', 'Caught'], ['revive', 'Revive'], ['shield', 'Bubble shield'], ['pop', 'Shield pops'], ['boop', 'Niko boops'], ['rise', 'Stingray bursts out'], ['flare', 'Lionfish flare'],
  ['roar', 'Bruiser roars'], ['crash', 'Bruiser crashes'], ['warn', 'Tentacle warning'], ['lash', 'Tentacle lash'], ['stuck', 'Tentacle stuck'], ['bosshit', 'Boss hit'], ['bossdown', 'Boss defeated'],
  ['win', 'Reef cleared'], ['vent', 'Vent hiss'], ['rustle', 'Kelp rustle'], ['click', 'Menu click']];
function openStyle() {
  const tw = twoP; twoP = true; loadLevel(LEVELS.findIndex(l => l.name === 'Lionfish Lair')); twoP = tw;
  mode = 'style'; S.readyT = 0; hideBanner(); overlay.hidden = true;
  if (autoTrack) setTrack(TRACKS.lantern);
  stylePanel.hidden = false; resize();
  unlockAudio(); renderStyle();
  stylePanel.scrollTop = 0; if (stylePanel.getBoundingClientRect().top > (window.innerHeight || 800) - 120) stylePanel.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeStyle() { hideStyle(); showMenu(); }
// the board shares the row with the lab, so it has to be re-measured whenever the lab goes away
function hideStyle() { if (!stylePanel.hidden) { stylePanel.hidden = true; resize(); } }
function renderStyle() {
  const opt = (attr, id, o, on, sw) => `<button class="opt" data-${attr}="${id}" aria-pressed="${on}">${sw || ''}<b>${o.name}</b><small>${o.desc}</small></button>`;
  $('#optTheme').innerHTML = Object.entries(THEMES).map(([id, t]) => opt('theme', id, t, theme === t, `<span class="sw">${t.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span>`)).join('');
  $('#optPack').innerHTML = Object.entries(PACKS).map(([id, p]) => opt('pack', id, p, pack === p)).join('');
  $('#optTrack').innerHTML = opt('track', 'auto', {name:'Reef by reef', desc:'Five tunes, one per stretch of reef'}, musicOn && autoTrack)
    + ['reef', 'tidepool', 'moondrift'].map(id => opt('track', id, TRACKS[id], musicOn && !autoTrack && track === TRACKS[id])).join('');
  $('#previews').innerHTML = `<button class="all" id="playAll">Play all</button>` + PREVIEWS.map(([n, l]) => `<button data-pv="${n}">${l}</button>`).join('');
}
function preview(n) {
  previewing = true;
  try {
    const p = S && mode === 'style' ? S.players[0] : null;
    if (p && !p.dead && (n === 'grow' || n === 'break')) {
      if (p.moving) { p.fx = p.x = p.tx; p.fy = p.y = p.ty; p.moving = false; }
      const d = p.face, front = isBlock(p.x + d.x, p.y + d.y);
      let x = p.x + d.x, y = p.y + d.y;
      if (n === 'grow' && front) while (isBlock(x, y)) { S.grid[y][x] = '.'; x += d.x; y += d.y; }
      if (n === 'break' && !front) while (canPlace(x, y)) { S.grid[y][x] = 'c'; S.born[y][x] = -9; x += d.x; y += d.y; }
      coralAction(p);
    } else if (p && n === 'puff') { p.puffCd = 0; p.puff = 0; startPuff(p); }
    else if (p && n === 'revive') { ring(p.fx + .5, p.fy + .5, '#fff4b8'); sfx('revive', {x:p.fx}); }
    else sfx(n, {x:p ? p.fx : 7, p:0, n:5});
  } finally { previewing = false; }
}
stylePanel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  unlockAudio();
  if (b.dataset.theme) { theme = THEMES[b.dataset.theme]; save.theme = b.dataset.theme; persist(); rebuildArt(); renderStyle(); }
  else if (b.dataset.pack) { applyPack(b.dataset.pack); renderStyle(); preview('get'); }
  else if (b.dataset.track) { applyTrack(b.dataset.track); renderStyle(); }
  else if (b.dataset.pv) preview(b.dataset.pv);
  else if (b.id === 'playAll') PREVIEWS.forEach(([n], i) => setTimeout(() => { if (mode === 'style') preview(n); }, i * 700));
  else if (b.id === 'styleDone') { closeStyle(); return; }
  b.blur();
});
$('#bSound').addEventListener('click', () => { if (mode === 'style') renderStyle(); });
$('#bMusic').addEventListener('click', () => { if (mode === 'style') renderStyle(); });

// ================= loop =================
let last = performance.now();
const STEP = 1 / 120; let acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .1) dt = .1; if (dt < 0) dt = 0;
  // the simulation runs in fixed 1/120 s steps however late the frame is, so a slow frame never slows the fish or delays a key
  acc += dt;
  while (acc >= STEP) { time += STEP; if (shake > 0) shake = Math.max(0, shake - STEP * 1.2); update(STEP); acc -= STEP; }
  draw(); hud();
  if (mode === 'menu' || mode === 'fish') drawPreviews();
  requestAnimationFrame(frame);
}
resize();
setAudioLabels();
Ads.init();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
showMenu();
resize(); // the hud and help text exist now, so the board can take the height they leave
if (!save.seenIntro) playStory('intro', () => { save.seenIntro = true; persist(); showMenu(); });
requestAnimationFrame(frame);

window.__pp = {LEVELS, loadLevel, draw, coralAction, pressDir, releaseDir, startPuff, killPlayer,
  Ads, continueLevel, isUnlocked, unlockedSet, showFish, getFish, drawPreviews, award, fmtTime, bfsStep, startLevel, playStory, storyNext, endStory, bossHit, spawnTent, get story() { return story; }, openStyle, preview, applyPack, applyTrack, setTheme(id) { theme = THEMES[id]; rebuildArt(); }, get packs() { return PACKS; }, get tracks() { return TRACKS; }, get track() { return track; }, get palettes() { return PALETTES; }, hud,
  audioTest(c, ahead) { ac = c; musicAhead = ahead || .25; nextStep = 0; buildAudio(); }, sfx, scheduleMusic, setMode(m) { mode = m; },
  get S() { return S; }, get mode() { return mode; }, get ac() { return ac; }, setTwoP(v) { twoP = v; }, tick(dt) { time += dt; update(dt); }};
})();
</script>
