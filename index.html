  ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawTentPath(pts, w0, w1) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = pts.length;
  // the silhouette pass gets one stroke; a segment-by-segment shadow was most of the Queen's frame cost
  if (silMode()) {
    ctx.lineWidth = (w0 + w1) / 2;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < n; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    ctx.restore(); return;
  }
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? '#c25a9e' : '#6e2463';
    for (let i = 1; i < n; i++) {
      ctx.lineWidth = (w0 + (w1 - w0) * (i / (n - 1))) * (pass ? .7 : 1);
      ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(255,215,235,0.75)';
  for (let i = 1; i < n - 1; i += 2) { const w = w0 + (w1 - w0) * (i / (n - 1)); circ(pts[i].x, pts[i].y + w * .15, w * .16); ctx.fill(); }
  ctx.restore();
}

function drawQueenBody(cx, cy, sc, mood, alpha, flash, lookX) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx, cy); ctx.scale(sc, sc);
  for (let i = 0; i < 6; i++) {
    const side = i < 3 ? -1 : 1, k = i % 3, pts = [];
    for (let j = 0; j <= 10; j++) { const s = j / 10; pts.push({x:side * (.55 + k * .3 + s * (1.1 + k * .25)), y:.55 + s * (1.3 - k * .25) + Math.sin(time * 2 + s * 4 + i) * .15 * s}); }
    drawTentPath(pts, .34, .1);
  }
  if (silMode()) { ell(0, 0, 1.45, 1.12); ctx.fill(); ctx.restore(); return; }
  const g = ctx.createRadialGradient(-.4, -.5, .1, 0, 0, 1.6);
  g.addColorStop(0, '#ec93c4'); g.addColorStop(1, '#7b2a6e');
  ctx.fillStyle = g; ell(0, 0, 1.45, 1.12); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,240,0.25)';
  for (const [x, y, r] of [[-.75, -.4, .12], [.5, -.62, .09], [.92, -.1, .1], [-.3, -.78, .07], [.2, .55, .08]]) { circ(x, y, r); ctx.fill(); }
  ctx.fillStyle = '#f6c445';
  ctx.beginPath(); ctx.moveTo(-.55, -.98);
  for (const [x, y] of [[-.48, -1.45], [-.26, -1.12], [0, -1.58], [.26, -1.12], [.48, -1.45], [.55, -.98]]) ctx.lineTo(x, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8463a'; circ(0, -1.25, .07); ctx.fill();
  ctx.fillStyle = '#7cc4f0'; circ(-.36, -1.12, .05); ctx.fill(); circ(.36, -1.12, .05); ctx.fill();
  for (const s of [-1, 1]) {
    ctx.fillStyle = '#fff'; ell(s * .5, .15, .3, .36); ctx.fill();
    ctx.fillStyle = '#1b0d1f'; ell(s * .5 + (lookX || 0) * .1, .2, mood === 'calm' ? .13 : .08, mood === 'calm' ? .16 : .26); ctx.fill();
    ctx.fillStyle = '#fff'; circ(s * .5 + .07, .06, .05); ctx.fill();
  }
  if (mood === 'angry') {
    ctx.strokeStyle = '#4a1240'; ctx.lineWidth = .08; ctx.lineCap = 'round';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * .82, -.3); ctx.lineTo(s * .25, -.12); ctx.stroke(); }
    ctx.lineWidth = .05; ctx.beginPath(); ctx.moveTo(-.22, .72); ctx.quadraticCurveTo(0, .6, .22, .72); ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,150,190,0.5)'; for (const s of [-1, 1]) { ell(s * .88, .52, .18, .09); ctx.fill(); }
    ctx.strokeStyle = '#4a1240'; ctx.lineWidth = .05; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-.2, .66); ctx.quadraticCurveTo(0, .8, .2, .66); ctx.stroke();
  }
  if (flash) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,255,255,0.4)'; ell(0, 0, 1.45, 1.12); ctx.fill(); }
  ctx.restore();
}

function drawTent(t) {
  if (t.len <= .05) return;
  const d = t.d, {bx, by} = tentEnds(t), px = -d.y, py = d.x, n = Math.max(3, Math.ceil(t.len * 3));
  const tremble = t.state === 'stuck' ? Math.sin(time * 40) * .05 : 0, pts = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n * t.len, w = Math.sin(t.wig * 4 + s * 1.6) * .1 * Math.min(1, s) + (i === n ? tremble : 0);
    pts.push({x:bx + d.x * s + px * w, y:by + d.y * s + py * w});
  }
  drawTentPath(pts, .62, .3);
  if (t.state === 'stuck') {
    const tip = pts[n];
    ctx.strokeStyle = `rgba(255,220,90,${.55 + .4 * Math.sin(time * 10)})`; ctx.lineWidth = .06;
    circ(tip.x, tip.y, .48); ctx.stroke();
    ctx.fillStyle = '#fff4a3';
    for (let i = 0; i < 3; i++) { const a = time * 6 + i * 2.09; circ(tip.x + Math.cos(a) * .3, tip.y - .35 + Math.sin(a) * .08, .045); ctx.fill(); }
  }
}

function drawWarnings() {
  for (const t of S.boss.tents) {
    if (t.state !== 'warn') continue;
    ctx.fillStyle = `rgba(255,70,110,${.18 + .14 * Math.sin(time * 18)})`;
    for (const c of t.cells) { if (S.grid[c.y][c.x] === 'c') break; rr(c.x + .06, c.y + .06, .88, .88, .14); ctx.fill(); }
    const c0 = t.cells[0];
    if (Math.random() < .35) parts.push({x:c0.x + .5 - t.d.x * .4 + rand(-.3, .3), y:c0.y + .5 - t.d.y * .4, vx:0, vy:-rand(.5, 1), life:.8, max:.8, size:rand(.04, .08), kind:'bub', delay:0, ph:0});
  }
}

function drawBoss() {
  const B = S.boss;
  if (B.kind !== 'queen') return;
  const k = B.dead ? Math.max(0, B.dying / 2.2) : 1;
  const tgt = alive()[0], lookX = tgt ? Math.max(-1, Math.min(1, (tgt.fx + .5 - B.cx) / 4)) : 0;
  drawQueenBody(B.cx, B.cy + (1 - k) * 1.2, 1, B.dead ? 'calm' : 'angry', k, B.hurtT > 0 && Math.floor(time * 20) % 2, lookX);
  for (const t of B.tents) drawTent(t);
}

// ================= story =================
let story = null;
function playStory(id, done) {
  mode = 'story'; S = null;
  overlay.hidden = true; hideBanner(); hideStyle();
  story = {id, i:0, done, t0:time, chars:0};
  storyEl.classList.remove('out'); storyEl.hidden = false;
  showPanel();
}
function showPanel() {
  const list = STORY[story.id];
  story.t0 = time; story.chars = 0;
  storyDots.innerHTML = list.length > 1 ? list.map((_, i) => `<i class="${i === story.i ? 'on' : ''}"></i>`).join('') : '';
  storyNextBtn.textContent = story.i < list.length - 1 ? 'Next' : story.id === 'intro' ? 'Start' : 'Continue';
}
function storyNext() {
  if (!story) return;
  const P = STORY[story.id][story.i];
  if (story.chars < P.text.length) { story.chars = P.text.length; return; }
  sfx('click');
  story.i++;
  if (story.i >= STORY[story.id].length) endStory(); else showPanel();
}
function endStory() {
  if (!story) return;
  const d = story.done; story = null; mode = 'menu';
  storyEl.classList.add('out');
  setTimeout(() => { if (!story) storyEl.hidden = true; storyEl.classList.remove('out'); }, 200);
  if (d) d();
}
storyNextBtn.addEventListener('click', e => { unlockAudio(); e.currentTarget.blur(); storyNext(); });
$('#storySkip').addEventListener('click', e => { unlockAudio(); e.currentTarget.blur(); endStory(); });
cv.addEventListener('click', () => { if (mode === 'story') { unlockAudio(); storyNext(); } });

function drawStory() {
  const P = STORY[story.id][story.i], t = time - story.t0;
  const fish = (id, fx, fy, face, puffed) => paperDraw(drawPuffer, {id, fish:getFish(id ? 'milli' : 'killi'), fx, fy, face, puff:puffed ? .65 : 0, dead:false, inv:0}, 'p');
  const enemy = e => paperDraw(drawEnemy, e, e.kind === 'E' || e.kind === 'K' ? '' : 'e'); // eels and a scaled-up Bruiser take the live silhouette
  const seal = o => paperDraw(drawSeal, o, 'f');
  const queen = (...q) => paperDraw(() => drawQueenBody(...q), null, '');
  const tent = (pts, w0, w1) => paperDraw(() => drawTentPath(pts, w0, w1), null, '');
  const rockRow = y => { for (let x = 0; x < COLS; x++) ctx.drawImage(rockSpr[hashi(x, y) % 3][1], x, y - .2, 1, 1.2); };
  const coral = (x, y) => ctx.drawImage(coralSpr[hashi(x, y) % 4], x, y - .2, 1, 1.2);
  const mk = (kind, fx, fy, dir) => ({kind, fx, fy, x:Math.round(fx), y:Math.round(fy), dir, anim:time + fx, moving:true, stun:0, chew:0, windup:0, charge:false,
    punch:0, punchFx:0, daze:0, crash:0, state:'hunt', t:1, ph:'calm', ft:1, trail:Array.from({length:9}, (_, i) => ({x:fx - dir.x * i * .14, y:fy - dir.y * i * .14}))});
  const snack = (type, fx, fy) => paperDraw(drawSnack, {type, x:Math.round(fx), y:Math.round(fy), fx, fy, born:-9, anim:time, t:9, lid:1, open:true, dir:RIGHT}, 's');

function drawParts() {
  for (const q of parts) {
    if (q.delay > 0) continue;
    const a = Math.min(1, q.life / q.max * 1.5);
    if (q.kind === 'amb' || q.kind === 'bub' || q.kind === 'vent') {
      const col = q.kind === 'vent' ? '255,215,170' : '220,250,255';
      ctx.strokeStyle = `rgba(${col},${(q.kind === 'amb' ? .35 : .7) * a})`; ctx.lineWidth = .018;
      circ(q.x, q.y, q.size); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${.5 * a})`; circ(q.x - q.size * .35, q.y - q.size * .35, q.size * .25); ctx.fill();
    } else if (q.kind === 'chip') {
      ctx.fillStyle = `rgba(255,150,145,${a})`; circ(q.x, q.y, q.size); ctx.fill();
    } else if (q.kind === 'ring') {
      ctx.strokeStyle = q.col; ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.lineWidth = .05; circ(q.x, q.y, q.size); ctx.stroke(); ctx.globalAlpha = 1;
    } else if (q.kind === 'sand') {
      ctx.fillStyle = `rgba(230,210,160,${.8 * a})`; circ(q.x, q.y, q.size); ctx.fill();
    } else if (q.kind === 'steam') {
      ctx.fillStyle = `rgba(230,240,240,${.35 * q.life / q.max})`; circ(q.x, q.y, q.size); ctx.fill();
    } else {
      ctx.fillStyle = q.col || '#fff7c2'; ctx.globalAlpha = a; circ(q.x, q.y, q.size); ctx.fill(); ctx.globalAlpha = 1;

  nextStep = ac.currentTime + (now ? .05 : .7); musicDuckUntil = now ? 0 : ac.currentTime + .7;
}
let track = autoTrack ? TRACKS.reef : (TRACKS[save.track] || TRACKS.reef);
function applyTrack(id) {
  if (id === 'off') { musicOn = false; }
  else { musicOn = true; autoTrack = id === 'auto' || !TRACKS[id]; setTrack(autoTrack ? autoTrackNow() : TRACKS[id], true); save.track = autoTrack ? 'auto' : id; }
  save.music = musicOn; persist(); setAudioLabels();
}
function scheduleMusic() {
  if (!ac) return;
  const on = !muted && musicOn && mode !== 'paused' && !document.hidden && ac.currentTime >= musicDuckUntil;
  musicBus.gain.setTargetAtTime(on ? (mode === 'play' ? .9 : .7) : 0, ac.currentTime, .3);
  const STEP = 60 / track.bpm / 4;
  if (nextStep < ac.currentTime - .5) nextStep = ac.currentTime + .05;
  try {
    while (nextStep < ac.currentTime + musicAhead) {
      if (on) track.fn(step % 16, Math.floor(step / 16) % 4, nextStep, STEP);
      nextStep += STEP; step++;
    }
  } catch (e) {}
}

// ================= look and sound lab =================
const PREVIEWS = [['grow', 'Grow coral'], ['break', 'Break coral'], ['get', 'Snack'], ['wave', 'New wave'], ['puff', 'Puff'], ['stun', 'Stun'],
  ['bonk', 'Bump'], ['charge', 'Swordfish charge'], ['thud', 'Swordfish crash'], ['punch', 'Mantis punch'], ['blink', 'Moon pearl'],
  ['die', 'Caught'], ['revive', 'Revive'], ['shield', 'Bubble shield'], ['pop', 'Shield pops'], ['boop', 'Niko boops'], ['rise', 'Stingray bursts out'], ['flare', 'Lionfish flare'],
  ['roar', 'Bruiser roars'], ['crash', 'Bruiser crashes'], ['warn', 'Tentacle warning'], ['lash', 'Tentacle lash'], ['stuck', 'Tentacle stuck'], ['bosshit', 'Boss hit'], ['bossdown', 'Boss defeated'],
  ['win', 'Reef cleared'], ['vent', 'Vent hiss'], ['rustle', 'Kelp rustle'], ['click', 'Menu click']];
function openStyle() {
  const tw = twoP; twoP = true; loadLevel(LEVELS.findIndex(l => l.name === 'Lionfish Lair')); twoP = tw;
  mode = 'style'; S.readyT = 0; hideBanner(); overlay.hidden = true;
  if (autoTrack) setTrack(TRACKS.lantern);
  stylePanel.hidden = false; resize();
  unlockAudio(); renderStyle();
  stylePanel.scrollTop = 0;
}
function closeStyle() { hideStyle(); showMenu(); }
// the board shares the row with the lab, so it has to be re-measured whenever the lab goes away
function hideStyle() { if (!stylePanel.hidden) { stylePanel.hidden = true; resize(); } }
function renderStyle() {
  const opt = (attr, id, o, on, sw) => `<button class="opt" data-${attr}="${id}" aria-pressed="${on}">${sw || ''}<b>${o.name}</b><small>${o.desc}</small></button>`;
  $('#optTheme').innerHTML = Object.entries(THEMES).map(([id, t]) => opt('theme', id, t, theme === t, `<span class="sw">${t.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span>`)).join('');
  $('#optPack').innerHTML = Object.entries(PACKS).map(([id, p]) => opt('pack', id, p, pack === p)).join('');
  $('#optTrack').innerHTML = opt('track', 'auto', {name:'Reef by reef', desc:'Five tunes, one per stretch of reef'}, musicOn && autoTrack)
    + ['reef', 'tidepool', 'moondrift'].map(id => opt('track', id, TRACKS[id], musicOn && !autoTrack && track === TRACKS[id])).join('');
  $('#previews').innerHTML = `<button class="all" id="playAll">Play all</button>` + PREVIEWS.map(([n, l]) => `<button data-pv="${n}">${l}</button>`).join('');
}
function preview(n) {
  previewing = true;
  try {
    const p = S && mode === 'style' ? S.players[0] : null;
    if (p && !p.dead && (n === 'grow' || n === 'break')) {
      if (p.moving) { p.fx = p.x = p.tx; p.fy = p.y = p.ty; p.moving = false; }
      const d = p.face, front = isBlock(p.x + d.x, p.y + d.y);
      let x = p.x + d.x, y = p.y + d.y;
      if (n === 'grow' && front) while (isBlock(x, y)) { S.grid[y][x] = '.'; x += d.x; y += d.y; }
      if (n === 'break' && !front) while (canPlace(x, y)) { S.grid[y][x] = 'c'; S.born[y][x] = -9; x += d.x; y += d.y; }
      coralAction(p);
    } else if (p && n === 'puff') { p.puffCd = 0; p.puff = 0; startPuff(p); }
    else if (p && n === 'revive') { ring(p.fx + .5, p.fy + .5, '#fff4b8'); sfx('revive', {x:p.fx}); }
    else sfx(n, {x:p ? p.fx : 7, p:0, n:5});
  } finally { previewing = false; }
}
stylePanel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  unlockAudio();
  if (b.dataset.theme) { theme = THEMES[b.dataset.theme]; save.theme = b.dataset.theme; persist(); rebuildArt(); renderStyle(); }
  else if (b.dataset.pack) { applyPack(b.dataset.pack); renderStyle(); preview('get'); }
  else if (b.dataset.track) { applyTrack(b.dataset.track); renderStyle(); }
  else if (b.dataset.pv) preview(b.dataset.pv);
  else if (b.id === 'playAll') PREVIEWS.forEach(([n], i) => setTimeout(() => { if (mode === 'style') preview(n); }, i * 700));
  else if (b.id === 'styleDone') { closeStyle(); return; }
  b.blur();
});
$('#bSound').addEventListener('click', () => { if (mode === 'style') renderStyle(); });
$('#bMusic').addEventListener('click', () => { if (mode === 'style') renderStyle(); });

// ================= loop =================
let last = performance.now();
const STEP = 1 / 120; let acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .1) dt = .1; if (dt < 0) dt = 0;
  // the simulation runs in fixed 1/120 s steps however late the frame is, so a slow frame never slows the fish or delays a key
  acc += dt;
  while (acc >= STEP) { time += STEP; if (shake > 0) shake = Math.max(0, shake - STEP * 1.2); update(STEP); acc -= STEP; }
  draw(); hud();
  if (mode === 'menu' || mode === 'fish') drawPreviews();
  requestAnimationFrame(frame);
}
resize();
setAudioLabels();
Ads.init();
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
showMenu();
resize(); // the hud and help text exist now, so the board can take the height they leave
if (!save.seenIntro) playStory('intro', () => { save.seenIntro = true; persist(); showMenu(); });
requestAnimationFrame(frame);

window.__pp = {LEVELS, loadLevel, draw, coralAction, pressDir, releaseDir, startPuff, killPlayer,
  Ads, continueLevel, isUnlocked, unlockedSet, showFish, getFish, drawPreviews, award, fmtTime, bfsStep, startLevel, playStory, storyNext, endStory, bossHit, spawnTent, get story() { return story; }, openStyle, preview, applyPack, applyTrack, setTheme(id) { theme = THEMES[id]; rebuildArt(); }, get packs() { return PACKS; }, get tracks() { return TRACKS; }, get track() { return track; }, get palettes() { return PALETTES; }, hud,
  audioTest(c, ahead) { ac = c; musicAhead = ahead || .25; nextStep = 0; buildAudio(); }, sfx, scheduleMusic, setMode(m) { mode = m; },
  get S() { return S; }, get mode() { return mode; }, get ac() { return ac; }, setTwoP(v) { twoP = v; }, tick(dt) { time += dt; update(dt); }};
})();
</script>
